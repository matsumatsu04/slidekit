<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlideKit｜パターンプレビュー</title>
<link rel="icon" type="image/png" href="/assets/brand/favicon.png">
<link rel="apple-touch-icon" type="image/png" href="/assets/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Prompt:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1d2e54;--yellow:#fed309;--on-yellow:#333;--ink:#333;--muted:#6b7280;--line:#e6e7ea;--bg:#fafafa;--brand:var(--navy);--surf:#f5f5f5;--font-jp:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;--font-en:'Prompt','Zen Kaku Gothic New',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  /* box-sizing:border-box なので高さは固定ヘッダー分の padding-top を含めた100vh。
     従来の calc(100vh - 80px) だと下に80pxの空白が残り、プレビューが上寄りに小さくなっていた（2026-09-25）*/
  body{font-family:var(--font-jp);background:#f3f4f6;color:var(--ink);height:100vh;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .bar a.back{color:#2f6bff;text-decoration:none;font-size:14px}
  .bar .name{font-weight:700;font-size:14px}
  .bar .pid{font-size:11px;font-weight:700;color:#666;background:#f4f5f7;border-radius:5px;padding:2px 8px}
  .bar .cat{font-size:11px;color:#fff;background:var(--ink);border-radius:5px;padding:1px 8px}
  .bar .sp{flex:1}
  .bar .lab{font-size:12px;color:var(--muted);font-weight:700}
  .bar .btn{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;text-decoration:none;color:var(--ink);cursor:pointer}
  .bar .btn:hover{border-color:#2f6bff;color:#2f6bff}
  .bar .btn.gray{color:var(--muted)}
  .palettes{display:flex;gap:6px;flex-wrap:wrap}
  .pal-chip{display:flex;align-items:center;gap:7px;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px 5px 8px;cursor:pointer;color:#555;white-space:nowrap}
  .pal-chip .dots{display:flex}
  .pal-chip .d{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line);margin-left:-4px}
  .pal-chip .d:first-child{margin-left:0}
  .pal-chip.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);color:var(--ink);font-weight:700}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:24px}
  /* 枠（.holder）は縮尺後の実寸にし、中の iframe だけを左上基準で縮める。
     従来は960pxの枠ごと中央基準で縮めていたため、スマホ幅では枠がはみ出してスライドが右に切れていた（2026-09-25）*/
  .holder{position:relative;width:960px;height:540px;flex:0 0 auto;overflow:hidden}
  .holder iframe{position:absolute;top:0;left:0;width:960px;height:540px;border:0;background:#e8e8e8;transform-origin:top left}
  .empty{max-width:520px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 26px;text-align:center;font-size:14px;line-height:1.8}
  .empty strong{display:block;font-size:16px;margin-bottom:6px}
  .empty a{color:#2f6bff}

/* ===================================================== 共通ヘッダー（macminol.com 準拠）
   実測値: 高さ80px・position:fixed・背景 #1D2E54・影なし・ロゴ180x58・
   ナビ16px/weight400/白・項目ピッチ約110px。CTAピルはこの2サイトでは置かない（2026-08-19 代表判断）。
   モバイルはネイビー地に白ハンバーガー。 */
.mm-header{position:fixed;top:0;left:0;right:0;height:80px;background:#1d2e54;z-index:100}
.mm-header-inner{max-width:1230px;height:100%;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;gap:24px}
.mm-logo{display:flex;align-items:center;flex:0 0 auto;text-decoration:none}
.mm-wordmark{color:#fff;font-family:'Prompt','Zen Kaku Gothic New',system-ui,sans-serif;
  font-size:22px;font-weight:600;letter-spacing:.02em;line-height:1;white-space:nowrap;margin:0}
.mm-nav{display:flex;align-items:center;gap:36px}
.mm-nav a{color:#fff;font-size:16px;font-weight:400;text-decoration:none;white-space:nowrap;
  padding:6px 0;border-bottom:2px solid transparent}
.mm-nav a:hover{border-bottom-color:#fed309}
.mm-burger{display:none;width:44px;height:44px;background:none;border:none;cursor:pointer;
  flex-direction:column;justify-content:center;gap:7px;padding:0 8px}
.mm-burger span{display:block;height:2px;background:#fff;border-radius:2px}
body{padding-top:80px}

@media (max-width:900px){
  .mm-header-inner{padding:0 16px}
  .mm-wordmark{font-size:19px}
  .mm-burger{display:flex}
  .mm-nav{position:fixed;top:80px;left:0;right:0;background:#1d2e54;flex-direction:column;
    align-items:stretch;gap:0;padding:8px 16px 20px;display:none}
  .mm-nav[data-open="1"]{display:flex}
  .mm-nav a{padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.16)}
  .mm-nav a:hover{border-bottom-color:rgba(255,255,255,.16)}
}
</style>
</head>
<body>
<header class="mm-header"><div class="mm-header-inner"><a class="mm-logo" href="/"><span class="mm-wordmark">SlideKit</span></a><nav class="mm-nav" id="mmNav"><a href="/#patterns">パターン</a><a href="/#designs">デザインテーマ</a><a href="/deck.html">スライド確認</a><a href="/start.html">導入手順</a><a href="/request.html">リクエスト</a></nav><button class="mm-burger" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="mmNav" data-role="mm-burger"><span></span><span></span><span></span></button></div></header>

  <div class="bar">
    <a class="back" href="/">← ギャラリーへ</a>
    <span class="pid" id="pid" title="恒久ID（追加・削除があっても変わりません）"></span>
    <span class="name" id="pname"></span>
    <span class="cat" id="pcat"></span>
    <span class="sp"></span>
    <span class="lab">カラーパレット</span>
    <div class="palettes" id="palettes"></div>
    <button class="btn gray" id="reset">グレーに戻す</button>
    <a class="btn" id="dl" download>.md DL</a>
  </div>
  <div class="stage">
    <div class="holder" id="holder">
      <iframe id="frame" title="パターンプレビュー"></iframe>
    </div>
  </div>

<script src="/palettes.js?v5"></script>
<script>
const qs=new URLSearchParams(location.search);
const name=(qs.get('p')||'').replace(/[^a-zA-Z0-9_-]/g,'');
// localStorage が使えない環境（Cookie全ブロック等）でも止まらないように（index.html と同じ作法）。
// 従来は直接 localStorage を読んでいて、使えない環境ではスクリプトが止まりプレビューが出なかった（2026-09-25）
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
let heading=qs.get('head')!=='off'; // 既定ON
const HSTYLE_VALUES=['a','b','c','d'];  // 旧d(2トーン)・旧e(ショートバー)は廃止。旧f(ラベル)をdへ改称
// 見出しデザイン: ?hstyle= ＞ ギャラリーで選んだもの（sk-hstyle）＞ A（パレットと同じ優先順）
let hstyle=[qs.get('hstyle'), lsGet('sk-hstyle')].find(v=>HSTYLE_VALUES.includes(v))||'a';
let cat=qs.get('cat')||'';
let pid=qs.get('id')||'';
const base=`/patterns/SLIDE-PATTERN-${name}`;
function showMeta(){
  document.getElementById('pname').textContent=name||'(指定なし)';
  document.getElementById('pcat').textContent=cat;
  document.getElementById('pcat').style.display=cat?'':'none';
  document.getElementById('pid').textContent=pid;
  document.getElementById('pid').style.display=pid?'':'none';
  if(name) document.title=`SlideKit｜${pid?pid+' ':''}${name}`;
}
showMeta();
if(name) document.getElementById('dl').href=`${base}/SLIDE-PATTERN-${name}.md`;
else document.getElementById('dl').style.display='none';

// パレット状態: ?pal=キー ＞ localStorage（sk-pal）＞ 既定ネイビー。'gray'はグレー表示
let PAL=(function(){
  const q=qs.get('pal')||lsGet('sk-pal');
  if(q==='gray') return null;
  return skFindPalette(q) || skFindPalette('navy-gold');
})();
const frame=document.getElementById('frame');
const holder=document.getElementById('holder');
// パターン未指定・存在しない名前のときは、404ページをiframeに出さず案内を出す（2026-09-25）
function showEmpty(html){
  holder.style.display='none';
  document.getElementById('dl').style.display='none';
  let box=document.querySelector('.stage .empty');
  if(!box){ box=document.createElement('div'); box.className='empty'; document.querySelector('.stage').appendChild(box); }
  box.innerHTML=html;
}
// onload をHTML属性で書くと、src未設定の初期 about:blank の load が script 評価前に走って
// 「apply is not defined」になる（2026-09-05 実測）。リスナーを付けてから src を入れる
frame.addEventListener('load',apply);
if(name){
  frame.src=`${base}/SLIDE-PATTERN-${name}.html?v10`;
  // ID・カテゴリがURLに無いとき（スキルの案内URL ?p=名前 だけ等）は一覧データから補う。
  // 名前が一覧に無ければ案内に切り替える。一覧が取れないときは何もしない
  fetch('/patterns/manifest.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!Array.isArray(j.patterns)) return;
    const p=j.patterns.find(x=>x.name===name);
    if(!p){
      frame.src='about:blank';
      showEmpty(`<strong>パターン「${name}」は見つかりません</strong>名前が変わったか、削除された可能性があります。<br><a href="/">ギャラリーで探す</a>`);
      return;
    }
    if(!pid && p.id) pid=p.id;
    if(!cat && p.category) cat=p.category;
    showMeta();
  }).catch(()=>{});
}else{
  showEmpty('<strong>パターンが指定されていません</strong>ギャラリーからパターンを選んでください。<br><a href="/">ギャラリーを開く</a>');
}
function apply(){
  // テキストは黒#333固定。装飾=メイン(--sk-accent)、淡い面=ベース(--sk-soft)、差し色=--sk-accent2。
  try{
    const root=frame.contentDocument&&frame.contentDocument.documentElement;
    if(root){
      skApplyPaletteVars(root, PAL);
      root.dataset.heading = heading ? 'on':'off';
      root.dataset.hstyle  = hstyle;
    }
  }catch(e){}
}
function setPal(palOrNull){
  PAL=palOrNull;
  lsSet('sk-pal', PAL ? PAL.key : 'gray');
  [...document.querySelectorAll('.pal-chip')].forEach(b=>b.classList.toggle('active', !!PAL && b.dataset.key===PAL.key));
  apply();
}
skRenderPaletteChips(document.getElementById('palettes'), PAL ? PAL.key : null, setPal);
document.getElementById('reset').addEventListener('click',()=>setPal(null));

// 画面に合わせてスケール
function fit(){
  const stage=document.querySelector('.stage');
  if(holder.style.display==='none') return;
  const sw=stage.clientWidth-48, sh=stage.clientHeight-48;
  const s=Math.max(Math.min(sw/960, sh/540, 1.4), 0.1);
  holder.style.width=(960*s)+'px';
  holder.style.height=(540*s)+'px';
  frame.style.transform=`scale(${s})`;
}
window.addEventListener('resize',fit); window.addEventListener('load',fit); fit();
</script>
<script>
(function(){
  var b=document.querySelector('[data-role="mm-burger"]'), n=document.getElementById('mmNav');
  if(!b||!n) return;
  function set(on){ n.setAttribute('data-open',on?'1':'0'); b.setAttribute('aria-expanded',on?'true':'false'); }
  set(false);
  b.addEventListener('click',function(){ set(n.getAttribute('data-open')!=='1'); });
  n.addEventListener('click',function(e){ if(e.target.tagName==='A') set(false); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') set(false); });
})();
</script>
</body>
</html>
