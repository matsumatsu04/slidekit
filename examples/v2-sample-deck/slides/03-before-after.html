<!-- P058 before-after-two-col: 左＝淡い地の BEFORE、右＝アクセント塗りの AFTER（塗りは右の1つだけ）。本文は見出し＋リード併用で top:128px 起点 -->
<section class="slide s3-ba">
  <div class="sk-h">導入前後で変わる制作の流れ</div>
  <div class="sk-msg">AIを入れて変わるのは、<b>確認が工程の中に入る</b>こと。</div>
  <div class="s3-content">
    <div class="s3-row">

      <!-- BEFORE パネル（淡い地） -->
      <div class="s3-panel s3-before">
        <div class="s3-kicker">BEFORE ／ 人が全部つくる</div>
        <div class="s3-flow">
          <div class="s3-box"><span class="s3-box-l">HUMAN</span><span class="s3-box-t">設計と構成</span></div>
          <svg class="s3-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="var(--sk-muted)" opacity=".5"/></svg>
          <div class="s3-box"><span class="s3-box-l">HUMAN</span><span class="s3-box-t">手で全部組む</span></div>
        </div>
        <div class="s3-chips">
          <div class="s3-chip">× 修正は組み直し</div>
          <div class="s3-chip">× 確認は納品直前</div>
          <div class="s3-chip">× 手順が人に依存</div>
          <div class="s3-chip">× 工数が読めない</div>
        </div>
        <div class="s3-note">例：文言の差し替え1回で半日、確認は最終日にまとめて行う</div>
      </div>

      <!-- AFTER パネル（アクセント塗り・白文字） -->
      <div class="s3-panel s3-after">
        <div class="s3-kicker">AFTER ／ AI × 人</div>
        <div class="s3-flow">
          <div class="s3-box"><span class="s3-box-l">PLAN</span><span class="s3-box-t">設計</span></div>
          <svg class="s3-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="#FFFFFF"/></svg>
          <div class="s3-box"><span class="s3-box-l">BUILD</span><span class="s3-box-t">生成</span></div>
          <svg class="s3-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="#FFFFFF"/></svg>
          <div class="s3-box"><span class="s3-box-l">CHECK</span><span class="s3-box-t">確認</span></div>
          <svg class="s3-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="#FFFFFF"/></svg>
          <div class="s3-box s3-box-outline"><span class="s3-box-l">PUBLISH</span><span class="s3-box-t">公開</span></div>
        </div>
        <div class="s3-chips">
          <div class="s3-chip">○ 修正は再生成</div>
          <div class="s3-chip">○ 確認は工程ごと</div>
          <div class="s3-chip">○ 指示が記録に残る</div>
          <div class="s3-chip">○ 工数が読める</div>
        </div>
        <div class="s3-note">例：差し替えは10分で再生成、確認は工程ごとに10分ずつ</div>
      </div>

    </div>
  </div>
</section>
