<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-milestone-timeline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。タイムライン一式は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 四半期の区切り（KICKER型のセル4つ・1pxの縦罫線で区切り・下に1pxの罫線） ── */
  .ms-phases { display: flex; border-bottom: 1px solid var(--sk-line,#e2e2e2); }
  .ms-phase { flex: 1; padding: 0 0 8px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-muted,#888888); border-left: 1px solid var(--sk-line,#e2e2e2); }
  .ms-phase:first-child { border-left: none; }

  /* ── マイルストーン列（6列等幅・上ぞろえ） ── */
  .ms-row { display: flex; align-items: flex-start; margin-top: 32px; }
  .ms-col { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 4px; }
  /* 幹線（1px・罫線色）：各列の左半分・右半分に分けて引く → 端点がノードの中心で止まる */
  .ms-col::before, .ms-col::after { content: ""; position: absolute; top: 7px; height: 1px; margin-top: -0.5px; background: var(--sk-line,#e2e2e2); }
  .ms-col::before { left: 0; right: 50%; }
  .ms-col::after { left: 50%; right: 0; }
  .ms-col:first-child::before, .ms-col:last-child::after { display: none; }
  /* ノード：白丸（1.5px 罫線色の枠）。幹線の上に載る */
  .ms-node { position: relative; z-index: 1; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--sk-line,#e2e2e2); background: #FFFFFF; }
  /* 完了のノードだけアクセント塗り（予定は白丸のまま） */
  .ms-col-done .ms-node { background: var(--sk-accent,#555555); border-color: var(--sk-accent,#555555); }
  /* ノードの下：日付（KICKER風・muted）→ 見出し16px太字 → 説明16px */
  .ms-date { margin-top: 12px; font-size: 10px; font-weight: 700; letter-spacing: .18em; line-height: 1; color: var(--sk-muted,#888888); white-space: nowrap; }
  .ms-ttl { margin-top: 8px; font-size: 16px; font-weight: 700; line-height: 1.4; }
  .ms-body { margin-top: 4px; font-size: 16px; line-height: 1.8; }

  /* ── 凡例（KICKER型・右寄せ） ── */
  .ms-legend { margin-top: 24px; display: flex; justify-content: flex-end; align-items: center; gap: 24px; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-muted,#888888); }
  .ms-legend-item { display: flex; align-items: center; gap: 8px; }
  .ms-legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--sk-line,#e2e2e2); background: #FFFFFF; }
  .ms-legend-dot-done { background: var(--sk-accent,#555555); border-color: var(--sk-accent,#555555); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：四半期の区切り → 幹線とマイルストーンのノード → 凡例（完了だけ塗り） -->
  <div class="content-area">

    <div class="ms-phases">
      <div class="ms-phase">Q1 ／ 1–3月</div>
      <div class="ms-phase">Q2 ／ 4–6月</div>
      <div class="ms-phase">Q3 ／ 7–9月</div>
      <div class="ms-phase">Q4 ／ 10–12月</div>
    </div>

    <div class="ms-row">

      <div class="ms-col ms-col-done">
        <div class="ms-node"></div>
        <div class="ms-date">1/10</div>
        <div class="ms-ttl">キックオフ</div>
        <div class="ms-body">体制を決める</div>
      </div>

      <div class="ms-col ms-col-done">
        <div class="ms-node"></div>
        <div class="ms-date">3/31</div>
        <div class="ms-ttl">要件確定</div>
        <div class="ms-body">要件を固める</div>
      </div>

      <div class="ms-col ms-col-done">
        <div class="ms-node"></div>
        <div class="ms-date">6/30</div>
        <div class="ms-ttl">設計完了</div>
        <div class="ms-body">設計を承認する</div>
      </div>

      <div class="ms-col">
        <div class="ms-node"></div>
        <div class="ms-date">9/15</div>
        <div class="ms-ttl">開発完了</div>
        <div class="ms-body">内部テスト開始</div>
      </div>

      <div class="ms-col">
        <div class="ms-node"></div>
        <div class="ms-date">11/1</div>
        <div class="ms-ttl">受入完了</div>
        <div class="ms-body">受入テスト終了</div>
      </div>

      <div class="ms-col">
        <div class="ms-node"></div>
        <div class="ms-date">12/15</div>
        <div class="ms-ttl">本番公開</div>
        <div class="ms-body">サービス開始</div>
      </div>

    </div>

    <div class="ms-legend">
      <div class="ms-legend-item"><span class="ms-legend-dot ms-legend-dot-done"></span><span>完了</span></div>
      <div class="ms-legend-item"><span class="ms-legend-dot"></span><span>予定</span></div>
    </div>

  </div>
</div>
</body>
</html>
