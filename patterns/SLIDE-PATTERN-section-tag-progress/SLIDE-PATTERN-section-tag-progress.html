<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-section-tag-progress</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide { width:960px; height:540px; background:#FFFFFF; border:1px solid var(--sk-accent,#CCCCCC); overflow:hidden; position:relative;
           color:var(--sk-ink,#3f4a52); font-weight:400; font-feature-settings:"palt" 1; line-break:strict; letter-spacing:.06em; line-height:1.8; }
  /* v2（2026-09-02）: 上に章タグ（soft 地の小さなピル・KICKER 型・現在章だけアクセント塗り＋白文字）、
     左の上下中央に 章番号（40px・400・アクセント色）→ 章タイトル（28px・700）→ 説明1行。塗りは現在地タグの1つだけ。
     共通部品は使えないので、同じ数値を stp- 接頭辞で持つ */
  .stp-tags  { position:absolute; left:48px; right:48px; top:48px; display:flex; gap:8px; }
  .stp-tag   { height:26px; padding:0 12px 0 14px; border-radius:13px; background:var(--sk-soft,#F0F0F0); display:flex; align-items:center;
               font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; white-space:nowrap; color:var(--sk-muted,#888888); }
  .stp-cur   { background:var(--sk-accent,#555555); color:#FFFFFF; }
  .stp-block { position:absolute; left:48px; right:48px; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; }
  .stp-no    { font-size:40px; font-weight:400; letter-spacing:.04em; line-height:1; color:var(--sk-accent,#666666); }
  .stp-title { margin-top:16px; max-width:760px; font-size:28px; font-weight:700; letter-spacing:.06em; line-height:1.5; }
  .stp-sub   { margin-top:12px; max-width:760px; font-size:16px; font-weight:400; line-height:1.8; color:var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <div class="stp-tags">
    <div class="stp-tag">01 現状</div>
    <div class="stp-tag">02 課題</div>
    <div class="stp-tag stp-cur">03 方針</div>
    <div class="stp-tag">04 手順</div>
    <div class="stp-tag">05 体制</div>
  </div>
  <div class="stp-block">
    <div class="stp-no">03</div>
    <div class="stp-title">AIに任せる工程と、人が決める工程</div>
    <div class="stp-sub">判断の主体を工程ごとに決めてから、道具を選ぶ</div>
  </div>
</div>
</body>
</html>
