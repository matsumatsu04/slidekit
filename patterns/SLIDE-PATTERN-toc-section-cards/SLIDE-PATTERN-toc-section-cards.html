<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-toc-section-cards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide { width:960px; height:540px; background:#FFFFFF; border:1px solid var(--sk-accent,#CCCCCC); overflow:hidden; position:relative;
           color:var(--sk-ink,#3f4a52); font-weight:400; font-feature-settings:"palt" 1; line-break:strict; letter-spacing:.06em; line-height:1.8; }
  /* v2（2026-09-03）: KICKER（Contents ／ 目次）の下に、soft 地の章カード3枚（等幅・等高・角丸11px・padding 24px）。
     カードの中身は「KICKER（01 ／ SECTION）→ 章名 18px/700 → 細罫線 → 説明1行 16px → 頁の注記」の型で上ぞろえ。
     現在章（1枚目）だけアクセント塗り＋白文字。塗りはその1枚だけ。共通部品は使えないので、同じ数値を tsc- 接頭辞で持つ */
  .content-area { position:absolute; left:48px; right:48px; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center; }
  html[data-heading="on"] .content-area { top:76px; }
  .tsc-kicker { margin-bottom:24px; font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-accent,#666666); }
  .tsc-grid   { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .tsc-card   { min-height:216px; background:var(--sk-soft,#F0F0F0); border-radius:11px; padding:24px; display:flex; flex-direction:column; align-items:flex-start; }
  .tsc-cur    { background:var(--sk-accent,#555555); color:#FFFFFF; }
  .tsc-ck     { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-accent,#666666); }
  .tsc-name   { margin-top:12px; font-size:18px; font-weight:700; letter-spacing:.06em; line-height:1.5; }
  .tsc-rule   { width:100%; height:1px; margin:16px 0; background:var(--sk-line,#e2e2e2); }
  .tsc-desc   { font-size:16px; font-weight:400; letter-spacing:.06em; line-height:1.8; }
  .tsc-note   { margin-top:12px; font-size:11.5px; font-weight:400; letter-spacing:.06em; line-height:1.8; color:var(--sk-muted,#888888); }
  .tsc-cur .tsc-ck   { color:#FFFFFF; }
  .tsc-cur .tsc-rule { background:rgba(255,255,255,.35); }
  .tsc-cur .tsc-desc { color:rgba(255,255,255,.85); }
  .tsc-cur .tsc-note { color:rgba(255,255,255,.7); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義。目次は通常OFF） -->
  <div class="sk-head" data-label="Contents"><span class="sk-head-ttl">本日の流れ</span></div>
  <!-- コンテンツエリア：KICKER ＋ 章カード3枚（現在章だけ塗り） -->
  <div class="content-area">
    <div class="tsc-kicker">Contents ／ 目次</div>
    <div class="tsc-grid">
      <div class="tsc-card tsc-cur">
        <div class="tsc-ck">01 ／ Section</div>
        <div class="tsc-name">制作フローの詰まり</div>
        <div class="tsc-rule"></div>
        <div class="tsc-desc">時間を取られる工程を見る</div>
        <div class="tsc-note">p.3 〜 p.8</div>
      </div>
      <div class="tsc-card">
        <div class="tsc-ck">02 ／ Section</div>
        <div class="tsc-name">AIと人の役割分担</div>
        <div class="tsc-rule"></div>
        <div class="tsc-desc">判断の主体を先に決める</div>
        <div class="tsc-note">p.9 〜 p.15</div>
      </div>
      <div class="tsc-card">
        <div class="tsc-ck">03 ／ Section</div>
        <div class="tsc-name">現場に入れる手順</div>
        <div class="tsc-rule"></div>
        <div class="tsc-desc">小さな案件で試して広げる</div>
        <div class="tsc-note">p.16 〜 p.22</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
