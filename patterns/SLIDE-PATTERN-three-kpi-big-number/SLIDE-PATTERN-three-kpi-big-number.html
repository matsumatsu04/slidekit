<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDE-PATTERN-three-kpi-big-number</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
    .slide {
      width: 960px;
      height: 540px;
      background: #FFFFFF;
      border: 1px solid var(--sk-accent,#CCCCCC);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* デザインの規律 v2: 文字の組み */
      color: var(--sk-ink,#3f4a52);
      font-feature-settings: "palt" 1;
      line-break: strict;
      letter-spacing: .06em;
      line-height: 1.8;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }
    /* コンテンツエリア（見出しON時は上76px以降。カード列は上下中央） */
    .content-area {
      flex: 1;
      padding: 24px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .kp-row { display: flex; gap: 16px; align-items: stretch; }
    /* KPIカード（等幅・等高）。既定は淡い地 */
    .kp-card {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 28px 24px;
      border-radius: 12px;
      background: var(--sk-soft,#F0F0F0);
      border: 1px solid var(--sk-line,#e2e2e2);
    }
    /* 主役の1枚だけアクセント塗り（塗りは1枚に1つ） */
    .kp-card-fill { background: var(--sk-accent,#555555); border-color: var(--sk-accent,#555555); color: #FFFFFF; }
    .kp-kicker {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      line-height: 1;
      color: var(--sk-accent,#555555);
      white-space: nowrap;
    }
    .kp-card-fill .kp-kicker { color: #FFFFFF; }
    /* 数字は大きく、単位は小さく */
    .kp-num-row { margin-top: 16px; display: flex; align-items: baseline; justify-content: center; gap: 4px; }
    .kp-num { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: .02em; color: var(--sk-accent,#555555); }
    .kp-unit { font-size: 16px; font-weight: 400; line-height: 1; }
    .kp-card-fill .kp-num, .kp-card-fill .kp-unit { color: #FFFFFF; }
    .kp-rule { margin-top: 16px; width: 100%; height: 1px; background: var(--sk-line,#e2e2e2); }
    .kp-card-fill .kp-rule { background: rgba(255,255,255,.35); }
    .kp-desc { margin-top: 12px; font-size: 16px; line-height: 1.8; }
    .kp-note { margin-top: 8px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }
    .kp-card-fill .kp-note { color: #FFFFFF; opacity: .85; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}
</style>
</head>
<body>
  <div class="slide">
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>

    <!-- コンテンツエリア -->
    <div class="content-area">
      <div class="kp-row">

        <!-- KPI 1 -->
        <div class="kp-card">
          <div class="kp-kicker">TIME ／ 制作日数</div>
          <div class="kp-num-row"><span class="kp-num">2</span><span class="kp-unit">日</span></div>
          <div class="kp-rule"></div>
          <div class="kp-desc">設計から公開までの日数</div>
          <div class="kp-note">例：従来は5日</div>
        </div>

        <!-- KPI 2（主役・塗り） -->
        <div class="kp-card kp-card-fill">
          <div class="kp-kicker">REVISIONS ／ 手直し回数</div>
          <div class="kp-num-row"><span class="kp-num">1</span><span class="kp-unit">回</span></div>
          <div class="kp-rule"></div>
          <div class="kp-desc">公開前の手直しの平均回数</div>
          <div class="kp-note">例：従来は3〜4回</div>
        </div>

        <!-- KPI 3 -->
        <div class="kp-card">
          <div class="kp-kicker">CHECK ／ 目視の網羅率</div>
          <div class="kp-num-row"><span class="kp-num">100</span><span class="kp-unit">%</span></div>
          <div class="kp-rule"></div>
          <div class="kp-desc">公開前に目視した割合</div>
          <div class="kp-note">例：チェック表で全ページ確認</div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
