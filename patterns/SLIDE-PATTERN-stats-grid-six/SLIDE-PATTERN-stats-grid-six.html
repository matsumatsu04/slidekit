<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-stats-grid-six</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。グリッドは上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 3列×2行の等高セル（淡い地・角丸11・gap16）。1枚だけ塗り ── */
  .sg-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 16px; height: 272px; }
  .sg-cell { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; padding: 20px 24px; border-radius: 11px;
             background: var(--sk-soft,#F0F0F0); }
  .sg-fill { background: var(--sk-accent,#555555); color: #FFFFFF; }
  /* セルの型: KICKER → 数字28px・太字・アクセント色＋単位14px → 1行の説明16px */
  .sg-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
  .sg-fill .sg-kicker { color: #FFFFFF; }
  .sg-num-row { margin-top: 12px; display: flex; align-items: baseline; gap: 4px; }
  .sg-num { font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: .02em; color: var(--sk-accent,#555555); }
  .sg-unit { font-size: 14px; font-weight: 400; line-height: 1; }
  .sg-fill .sg-num, .sg-fill .sg-unit { color: #FFFFFF; }
  .sg-desc { margin-top: 8px; font-size: 16px; line-height: 1.8; white-space: nowrap; }
  .sg-note { margin-top: 12px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：6つの統計を 3列×2行 の等高セルで。塗りは主役の1枚だけ -->
  <div class="content-area">
    <div class="sg-grid">
      <div class="sg-cell">
        <div class="sg-kicker">Founded ／ 設立</div>
        <div class="sg-num-row"><span class="sg-num">2019</span><span class="sg-unit">年</span></div>
        <div class="sg-desc">Web制作の受託から始めた</div>
      </div>
      <div class="sg-cell">
        <div class="sg-kicker">Members ／ 社員数</div>
        <div class="sg-num-row"><span class="sg-num">12</span><span class="sg-unit">名</span></div>
        <div class="sg-desc">デザインと開発が半々</div>
      </div>
      <div class="sg-cell">
        <div class="sg-kicker">Projects ／ 制作実績</div>
        <div class="sg-num-row"><span class="sg-num">300</span><span class="sg-unit">件</span></div>
        <div class="sg-desc">中小企業のサイトが中心</div>
      </div>
      <div class="sg-cell">
        <div class="sg-kicker">Clients ／ 取引社数</div>
        <div class="sg-num-row"><span class="sg-num">80</span><span class="sg-unit">社</span></div>
        <div class="sg-desc">半数が2年以上の継続</div>
      </div>
      <div class="sg-cell sg-fill">
        <div class="sg-kicker">Retention ／ 継続率</div>
        <div class="sg-num-row"><span class="sg-num">96</span><span class="sg-unit">%</span></div>
        <div class="sg-desc">月額プランの1年後の継続</div>
      </div>
      <div class="sg-cell">
        <div class="sg-kicker">Offices ／ 拠点</div>
        <div class="sg-num-row"><span class="sg-num">2</span><span class="sg-unit">拠点</span></div>
        <div class="sg-desc">本社と地方のサテライト</div>
      </div>
    </div>
    <div class="sg-note">例：数値は前期末時点。継続率は月額プランのみ</div>
  </div>
</div>
</body>
</html>
