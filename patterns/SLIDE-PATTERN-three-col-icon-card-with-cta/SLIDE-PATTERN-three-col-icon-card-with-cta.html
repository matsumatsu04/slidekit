<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-three-col-icon-card-with-cta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  /* デザインの規律 v2：文字の組みは .slide に集約（palt・禁則・字間.06em・行間1.8・インク色・太さは400/700のみ） */
  .slide { width:960px; height:540px; background:#FFFFFF; overflow:hidden; position:relative; box-sizing:border-box;
           color:var(--sk-ink,#3f4a52); font-size:16px; font-weight:400; line-height:1.8; letter-spacing:.06em;
           font-feature-settings:"palt" 1; line-break:strict; -webkit-font-smoothing:antialiased; }
  .slide p { margin:0; }
  /* 本文エリア：左右48px・見出しONで上76px・中身（カード群＋CTA帯の束）は上下中央 */
  .content-area { position:absolute; left:48px; right:48px; top:0; bottom:0; display:flex; align-items:center; }
  html[data-heading="on"] .content-area { top:76px; }
  .cc-wrap { width:100%; }

  /* 3カード：等高・soft地・gap16・角丸11。3枚とも淡い地（このスライドの塗りは下のCTA帯1つ） */
  .cc-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; height:288px; }
  .cc-card { box-sizing:border-box; border-radius:11px; padding:24px; background:var(--sk-soft,#F0F0F0); min-width:0;
             display:flex; flex-direction:column; align-items:flex-start; }
  /* アイコン：20px・白の丸地40px */
  .cc-icon { width:40px; height:40px; border-radius:50%; background:#FFFFFF; display:flex; align-items:center; justify-content:center;
             font-size:20px; line-height:1; color:var(--sk-accent,#666666); margin-bottom:16px; flex-shrink:0; }
  /* カードの型：KICKER → 見出し18px → 本文16px（2〜3行） → 例： */
  .cc-kicker { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-accent,#666666); }
  .cc-h { margin-top:8px; font-size:18px; font-weight:700; line-height:1.4; }
  .cc-body { margin-top:8px; font-size:16px; line-height:1.8; }
  .cc-note { margin-top:8px; font-size:11.5px; line-height:1.8; color:var(--sk-muted,#888888); }

  /* CTA帯：このスライドで唯一のアクセント塗り（白文字・角丸11px・高さ64px） */
  .cc-band { margin-top:24px; height:64px; box-sizing:border-box; background:var(--sk-accent,#555555); color:#FFFFFF; border-radius:11px; padding:0 28px;
             display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .cc-msg { font-size:18px; font-weight:700; line-height:1.4; min-width:0; }
  /* 右の小さな白枠ボタン風ラベル（塗らない・1.5pxの白枠） */
  .cc-btn { flex:none; display:inline-flex; align-items:center; height:32px; padding:0 16px; border:1.5px solid #FFFFFF; border-radius:16px;
            font-size:12px; font-weight:700; letter-spacing:.1em; line-height:1; white-space:nowrap; color:#FFFFFF; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：淡い地の3カード（アイコン→KICKER→見出し→本文→例：）＋ 全幅のCTA帯（このスライドで唯一の塗り） -->
  <div class="content-area">
    <div class="cc-wrap">

      <div class="cc-cards">
        <div class="cc-card">
          <div class="cc-icon"><i class="fa-solid fa-comments"></i></div>
          <div class="cc-kicker">Consult ／ 相談</div>
          <div class="cc-h">困りごとを言葉にする</div>
          <p class="cc-body">いま止まっている工程と、任せたい範囲を整理する。</p>
          <div class="cc-note">例：オンラインで30分</div>
        </div>
        <div class="cc-card">
          <div class="cc-icon"><i class="fa-solid fa-pen-ruler"></i></div>
          <div class="cc-kicker">Plan ／ 設計</div>
          <div class="cc-h">進め方を1枚にまとめる</div>
          <p class="cc-body">対象ページ・確認者・期限を先に決め、迷いを減らす。</p>
          <div class="cc-note">例：目的・対象・期限の3行</div>
        </div>
        <div class="cc-card">
          <div class="cc-icon"><i class="fa-solid fa-handshake"></i></div>
          <div class="cc-kicker">Support ／ 伴走</div>
          <div class="cc-h">公開後の直しを溜めない</div>
          <p class="cc-body">毎月の枠で小さな修正をまとめて片づける。</p>
          <div class="cc-note">例：月初に30分の定例</div>
        </div>
      </div>

      <div class="cc-band">
        <div class="cc-msg">まずは30分の個別相談で、いまの進め方を整理する</div>
        <div class="cc-btn">個別相談を予約する</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
