<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-two-feature-with-result</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。行は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 左：特徴カード2枚（縦積み・等高）／中央：三角矢印／右：結果パネル（塗り） ── */
  .fr-row { display: flex; align-items: stretch; height: 336px; }
  .fr-features { flex: none; width: 464px; display: flex; flex-direction: column; gap: 16px; }
  /* 特徴カード（淡い地・上ぞろえ）。型: KICKER → 見出し18px → 本文16px×2行 */
  .fr-card {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    padding: 20px 24px; border-radius: 12px;
    background: var(--sk-soft,#F0F0F0); border: 1px solid var(--sk-line,#e2e2e2);
  }
  .fr-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
  .fr-ttl { margin-top: 12px; font-size: 18px; font-weight: 700; line-height: 1.4; }
  .fr-body { margin-top: 8px; font-size: 16px; line-height: 1.8; }

  /* 中央コネクタ：SVG三角矢印（幅12px）を幅48pxの列の中央に置く */
  .fr-conn { flex: none; width: 48px; display: flex; align-items: center; justify-content: center; }
  .fr-arw { display: block; }

  /* 右：結果パネル（アクセント塗り・白文字。塗りは1枚に1つ）。型: KICKER → 数字28px＋単位 → 細罫線 → 説明 → 注記 */
  .fr-result {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    padding: 24px 28px; border-radius: 12px;
    background: var(--sk-accent,#555555); color: #FFFFFF;
  }
  .fr-result .fr-kicker { color: #FFFFFF; }
  .fr-num-row { margin-top: 16px; display: flex; align-items: baseline; gap: 4px; }
  .fr-num { font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: .02em; }
  .fr-unit { font-size: 16px; font-weight: 400; line-height: 1; }
  .fr-rule { margin-top: 16px; height: 1px; background: rgba(255,255,255,.35); }
  .fr-desc { margin-top: 12px; font-size: 16px; line-height: 1.8; }
  .fr-note { margin-top: auto; padding-top: 12px; font-size: 11.5px; line-height: 1.8; color: #FFFFFF; opacity: .85; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左＝特徴カード2枚（淡い地）→ 三角矢印 → 右＝結果パネル（塗り） -->
  <div class="content-area">
    <div class="fr-row">

      <!-- 左：特徴カード2枚（縦積み・等高） -->
      <div class="fr-features">
        <div class="fr-card">
          <div class="fr-kicker">FEATURE 1 ／ 型で作る</div>
          <div class="fr-ttl">ページの型を先に決める</div>
          <div class="fr-body">見出し・本文・ボタンの型を1枚にまとめ、<br>全ページを同じ型で組む。</div>
        </div>
        <div class="fr-card">
          <div class="fr-kicker">FEATURE 2 ／ 人が見る</div>
          <div class="fr-ttl">公開前に全ページを目視する</div>
          <div class="fr-body">チェック表で全ページを確認し、<br>直した箇所を記録に残す。</div>
        </div>
      </div>

      <!-- 中央：三角矢印（SVG・幅12px） -->
      <div class="fr-conn">
        <svg class="fr-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="var(--sk-accent,#555555)"/></svg>
      </div>

      <!-- 右：結果パネル（アクセント塗り・白文字） -->
      <div class="fr-result">
        <div class="fr-kicker">RESULT ／ 導入後3ヶ月</div>
        <div class="fr-num-row"><span class="fr-num">60</span><span class="fr-unit">%</span></div>
        <div class="fr-rule"></div>
        <div class="fr-desc">手直しにかかる時間の削減率</div>
        <div class="fr-note">例：月8時間 → 月3時間</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
