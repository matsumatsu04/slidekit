<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-day-timeline-single-bar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降・左右48px。バー一式は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 3段とも同じ flex 比率（＝時間の長さ）で並べ、時刻・区切り・見出しの x を揃える ── */
  /* 上段：開始時刻の KICKER（各セグメントの左端）。終業時刻は右端に絶対配置 */
  .dt-times { position: relative; display: flex; }
  .dt-time { font-size: 10px; font-weight: 700; letter-spacing: .18em; line-height: 1; color: var(--sk-muted,#888888); white-space: nowrap; }
  .dt-time-end { position: absolute; right: 0; top: 0; }
  /* 中段：バー1本（高さ40px・淡い地・角丸6px）。セグメントの区切りは白1.5pxの縦罫線（幅に影響しない擬似要素） */
  .dt-bar { margin-top: 8px; display: flex; height: 40px; border-radius: 6px; background: var(--sk-soft,#F0F0F0); overflow: hidden; }
  .dt-seg { position: relative; display: flex; align-items: center; justify-content: center; font-size: 11.5px; line-height: 1; color: var(--sk-muted,#888888); }
  .dt-seg + .dt-seg::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1.5px; background: #FFFFFF; }
  /* 「今ここ」の時間帯1つだけアクセント塗り（塗りは1枚に1つ） */
  .dt-seg-now { background: var(--sk-accent,#555555); color: #FFFFFF; }
  /* 下段：各セグメントの見出し16px太字＋説明14px muted（開始時刻と左をそろえる） */
  .dt-labels { margin-top: 12px; display: flex; }
  .dt-label { min-width: 0; padding-right: 8px; }
  .dt-ttl { font-size: 16px; font-weight: 700; line-height: 1.4; }
  .dt-body { margin-top: 4px; font-size: 14px; line-height: 1.8; color: var(--sk-muted,#888888); }
  .dt-note { margin-top: 24px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：時刻（KICKER）→ バー1本（塗りは1区分だけ）→ 見出し＋説明 → 注記。flex の値＝時間の長さ（1h = 2） -->
  <div class="content-area">

    <div class="dt-times">
      <div class="dt-time" style="flex:2;">09:00</div>
      <div class="dt-time" style="flex:6;">10:00</div>
      <div class="dt-time" style="flex:2;">13:00</div>
      <div class="dt-time" style="flex:4;">14:00</div>
      <div class="dt-time" style="flex:3;">16:00</div>
      <div class="dt-time dt-time-end">17:30</div>
    </div>

    <div class="dt-bar">
      <div class="dt-seg" style="flex:2;">1h</div>
      <div class="dt-seg dt-seg-now" style="flex:6;">3h</div>
      <div class="dt-seg" style="flex:2;">1h</div>
      <div class="dt-seg" style="flex:4;">2h</div>
      <div class="dt-seg" style="flex:3;">1.5h</div>
    </div>

    <div class="dt-labels">
      <div class="dt-label" style="flex:2;">
        <div class="dt-ttl">準備</div>
        <div class="dt-body">予定を共有</div>
      </div>
      <div class="dt-label" style="flex:6;">
        <div class="dt-ttl">集中作業</div>
        <div class="dt-body">通知を切って制作に集中する</div>
      </div>
      <div class="dt-label" style="flex:2;">
        <div class="dt-ttl">休憩</div>
        <div class="dt-body">食事と休息</div>
      </div>
      <div class="dt-label" style="flex:4;">
        <div class="dt-ttl">打合せ</div>
        <div class="dt-body">社内とお客様の定例</div>
      </div>
      <div class="dt-label" style="flex:3;">
        <div class="dt-ttl">振り返り</div>
        <div class="dt-body">翌日の段取り</div>
      </div>
    </div>

    <div class="dt-note">例：塗りは「今ここ」か、要になる時間帯1つだけ。区分の幅は時間の長さに比例させる</div>
  </div>
</div>
</body>
</html>
