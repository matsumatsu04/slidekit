<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-kpi-donut-chart-grid</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-size: 16px; font-weight: 400; font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。ドーナツ4つの行を上下中央・列同士は上ぞろえ） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }
  .dn-row { display: flex; align-items: flex-start; gap: 16px; }

  /* 1列（等幅）。リング → KICKER → ラベル → 注記 を中央ぞろえで縦積み */
  .dn-item { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }

  /* ドーナツ：SVG の circle 2本（下＝残り・罫線色／上＝達成分・アクセント色）。太さ10px・面塗りなし。
     半径55 → 円周 345.575。達成分は stroke-dasharray「達成長 345.575」を静的に書き、-90° 回して12時から始める */
  .dn-ring { position: relative; width: 120px; height: 120px; }
  .dn-svg { display: block; width: 120px; height: 120px; }
  .dn-svg .dn-track { fill: none; stroke: var(--sk-line,#e2e2e2); stroke-width: 10; }
  .dn-svg .dn-value { fill: none; stroke: var(--sk-accent,#555555); stroke-width: 10; transform: rotate(-90deg); transform-origin: 60px 60px; }
  /* 中央の数値：24px/700 tabular-nums。％は小さく添える */
  .dn-num { position: absolute; left: 0; top: 0; width: 120px; height: 120px; display: flex; align-items: baseline; justify-content: center; }
  .dn-num-main { font-size: 24px; font-weight: 700; line-height: 120px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .dn-num-unit { margin-left: 2px; font-size: 14px; font-weight: 400; line-height: 120px; }

  .dn-kicker { margin-top: 16px; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
  .dn-label { margin-top: 6px; font-size: 16px; font-weight: 700; line-height: 1.4; white-space: nowrap; }
  .dn-note { margin-top: 4px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); white-space: nowrap; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：ドーナツ4つを横一列・等幅・上ぞろえ（リングだけ。面塗りなし） -->
  <div class="content-area">
    <div class="dn-row">

      <!-- KPI 1（78% → 0.78 × 345.575 = 269.55） -->
      <div class="dn-item">
        <div class="dn-ring">
          <svg class="dn-svg" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="dn-track" cx="60" cy="60" r="55"/>
            <circle class="dn-value" cx="60" cy="60" r="55" stroke-dasharray="269.55 345.575"/>
          </svg>
          <div class="dn-num"><span class="dn-num-main">78</span><span class="dn-num-unit">%</span></div>
        </div>
        <div class="dn-kicker">Win rate</div>
        <div class="dn-label">受注率</div>
        <div class="dn-note">例：前回比 +6pt</div>
      </div>

      <!-- KPI 2（92% → 317.93） -->
      <div class="dn-item">
        <div class="dn-ring">
          <svg class="dn-svg" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="dn-track" cx="60" cy="60" r="55"/>
            <circle class="dn-value" cx="60" cy="60" r="55" stroke-dasharray="317.93 345.575"/>
          </svg>
          <div class="dn-num"><span class="dn-num-main">92</span><span class="dn-num-unit">%</span></div>
        </div>
        <div class="dn-kicker">Retention</div>
        <div class="dn-label">継続率</div>
        <div class="dn-note">例：前回比 +2pt</div>
      </div>

      <!-- KPI 3（65% → 224.62） -->
      <div class="dn-item">
        <div class="dn-ring">
          <svg class="dn-svg" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="dn-track" cx="60" cy="60" r="55"/>
            <circle class="dn-value" cx="60" cy="60" r="55" stroke-dasharray="224.62 345.575"/>
          </svg>
          <div class="dn-num"><span class="dn-num-main">65</span><span class="dn-num-unit">%</span></div>
        </div>
        <div class="dn-kicker">Utilization</div>
        <div class="dn-label">稼働率</div>
        <div class="dn-note">例：前回比 -3pt</div>
      </div>

      <!-- KPI 4（88% → 304.11） -->
      <div class="dn-item">
        <div class="dn-ring">
          <svg class="dn-svg" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="dn-track" cx="60" cy="60" r="55"/>
            <circle class="dn-value" cx="60" cy="60" r="55" stroke-dasharray="304.11 345.575"/>
          </svg>
          <div class="dn-num"><span class="dn-num-main">88</span><span class="dn-num-unit">%</span></div>
        </div>
        <div class="dn-kicker">Satisfaction</div>
        <div class="dn-label">満足度</div>
        <div class="dn-note">例：前回比 +4pt</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
