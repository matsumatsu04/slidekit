<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-faq-grid</title>
<style>
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  /* デザインの規律 v2：文字の組みは .slide に集約（palt・禁則・字間.06em・行間1.8・インク色・太さは400/700のみ） */
  .slide { width:960px; height:540px; background:#FFFFFF; overflow:hidden; position:relative; box-sizing:border-box;
           color:var(--sk-ink,#444444); font-size:16px; font-weight:400; line-height:1.8; letter-spacing:.06em;
           font-feature-settings:"palt" 1; line-break:strict; -webkit-font-smoothing:antialiased; }
  .slide p { margin:0; }
  /* 本文エリア：左右48px・見出しONで上76px・中身は上下中央 */
  .content-area { position:absolute; left:48px; right:48px; top:0; bottom:0; display:flex; align-items:center; }
  html[data-heading="on"] .content-area { top:76px; }

  /* 3×2カード：等高・soft地・角丸11・gap16。Q.01だけ塗り（1枚に塗りは1つ） */
  .fq-grid { width:100%; height:384px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:1fr 1fr; gap:16px; }
  .fq-card { box-sizing:border-box; border-radius:11px; padding:16px 20px; background:var(--sk-soft,#F0F0F0);
             display:flex; flex-direction:column; align-items:flex-start; }
  .fq-fill { background:var(--sk-accent,#555555); color:#FFFFFF; }
  /* カードの型：Q（KICKER風）→ 質問 → 細罫線 → 回答 */
  .fq-q { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-accent,#666666); }
  .fq-fill .fq-q { color:#FFFFFF; }
  .fq-h { margin-top:8px; font-size:16px; font-weight:700; line-height:1.5; }
  .fq-line { width:100%; height:1px; background:var(--sk-line,#E2E2E2); margin:10px 0; }
  .fq-fill .fq-line { background:rgba(255,255,255,.35); }
  .fq-a { font-size:16px; line-height:1.8; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:26px;width:4px;height:28px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：3列×2行のQ&A（Q.01＝いちばん多い質問を塗りで主役に） -->
  <div class="content-area">
    <div class="fq-grid">
      <div class="fq-card fq-fill">
        <div class="fq-q">Q.01</div>
        <div class="fq-h">何から始めればいい？</div>
        <div class="fq-line"></div>
        <p class="fq-a">小さな案件を1つ選び、1ページだけ試す。</p>
      </div>
      <div class="fq-card">
        <div class="fq-q">Q.02</div>
        <div class="fq-h">費用はどのくらい？</div>
        <div class="fq-line"></div>
        <p class="fq-a">案件の規模で変わる。先に見積もりの型を出す。</p>
      </div>
      <div class="fq-card">
        <div class="fq-q">Q.03</div>
        <div class="fq-h">期間はどのくらい？</div>
        <div class="fq-line"></div>
        <p class="fq-a">1ページなら数日。全体は段階ごとに区切る。</p>
      </div>
      <div class="fq-card">
        <div class="fq-q">Q.04</div>
        <div class="fq-h">途中で変更できる？</div>
        <div class="fq-line"></div>
        <p class="fq-a">できる。変更点は差分として記録に残す。</p>
      </div>
      <div class="fq-card">
        <div class="fq-q">Q.05</div>
        <div class="fq-h">誰が確認する？</div>
        <div class="fq-line"></div>
        <p class="fq-a">表記とリンクは人が見る。AIの判定を最終承認にしない。</p>
      </div>
      <div class="fq-card">
        <div class="fq-q">Q.06</div>
        <div class="fq-h">終わったあとは？</div>
        <div class="fq-line"></div>
        <p class="fq-a">手順を残し、次の案件で同じ型を使う。</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
