<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-six-card-2x3-grid</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  /* デザインの規律 v2：文字の組みは .slide に集約（palt・禁則・字間.06em・行間1.8・インク色・太さは400/700のみ） */
  .slide { width:960px; height:540px; background:#FFFFFF; overflow:hidden; position:relative; box-sizing:border-box;
           color:var(--sk-ink,#3f4a52); font-size:16px; font-weight:400; line-height:1.8; letter-spacing:.06em;
           font-feature-settings:"palt" 1; line-break:strict; -webkit-font-smoothing:antialiased; }
  .slide p { margin:0; }
  /* 本文エリア：左右48px・見出しONで上76px・中身は上下中央 */
  .content-area { position:absolute; left:48px; right:48px; top:0; bottom:0; display:flex; align-items:center; }
  html[data-heading="on"] .content-area { top:76px; }

  /* 左の縦書きラベル（KICKER型・muted）＋ 右の2行×3列グリッド。全体は等高ブロック */
  .sg-wrap { width:100%; height:408px; display:flex; gap:16px; align-items:stretch; }
  .sg-side { width:24px; flex-shrink:0; box-sizing:border-box; padding-top:16px; display:flex; justify-content:center; align-items:flex-start; }
  .sg-side-label { writing-mode:vertical-rl; text-orientation:mixed; font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
                   line-height:1; white-space:nowrap; color:var(--sk-muted,#888888); }
  .sg-grid { flex:1; min-width:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:1fr 1fr; gap:16px; }
  /* カード：等高・soft地・角丸11。02だけ塗り（1枚に塗りは1つ） */
  .sg-card { box-sizing:border-box; border-radius:11px; padding:16px 20px; background:var(--sk-soft,#F0F0F0); min-width:0;
             display:flex; flex-direction:column; align-items:flex-start; }
  .sg-fill { background:var(--sk-accent,#555555); color:#FFFFFF; }
  /* アイコン：20px・白の丸地（塗りカード内は白の半透明） */
  .sg-icon { width:40px; height:40px; border-radius:50%; background:#FFFFFF; display:flex; align-items:center; justify-content:center;
             font-size:20px; line-height:1; color:var(--sk-accent,#666666); margin-bottom:12px; flex-shrink:0; }
  .sg-fill .sg-icon { background:rgba(255,255,255,.2); color:#FFFFFF; }
  /* カードの型：KICKER → 見出し → 本文2行 */
  .sg-kicker { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-accent,#666666); }
  .sg-fill .sg-kicker { color:#FFFFFF; }
  .sg-h { margin-top:8px; font-size:16px; font-weight:700; line-height:1.4; }
  .sg-body { margin-top:6px; font-size:16px; line-height:1.8; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左に縦書きのカテゴリラベル、右に2行×3列のカード（02＝主役の塗り） -->
  <div class="content-area">
    <div class="sg-wrap">
      <div class="sg-side"><span class="sg-side-label">Services ／ 提供分野</span></div>
      <div class="sg-grid">
        <div class="sg-card">
          <div class="sg-icon"><i class="fa-solid fa-pen-ruler"></i></div>
          <div class="sg-kicker">Design ／ 設計</div>
          <div class="sg-h">サイト設計</div>
          <p class="sg-body">目的と導線を先に決め、構成を1枚にまとめる。</p>
        </div>
        <div class="sg-card sg-fill">
          <div class="sg-icon"><i class="fa-solid fa-code"></i></div>
          <div class="sg-kicker">Build ／ 実装</div>
          <div class="sg-h">ノーコード実装</div>
          <p class="sg-body">公開前に表示を確かめながら、設計どおりに組む。</p>
        </div>
        <div class="sg-card">
          <div class="sg-icon"><i class="fa-solid fa-file-lines"></i></div>
          <div class="sg-kicker">Content ／ 原稿</div>
          <div class="sg-h">原稿と写真の整理</div>
          <p class="sg-body">文章と写真を先に集め、不足を早めに洗い出す。</p>
        </div>
        <div class="sg-card">
          <div class="sg-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
          <div class="sg-kicker">Search ／ 検索</div>
          <div class="sg-h">検索対策の基本</div>
          <p class="sg-body">題名と見出しを整え、アクセス計測も設定する。</p>
        </div>
        <div class="sg-card">
          <div class="sg-icon"><i class="fa-solid fa-rotate"></i></div>
          <div class="sg-kicker">Operate ／ 運用</div>
          <div class="sg-h">公開後の更新</div>
          <p class="sg-body">月1回の更新枠を決め、小さな直しを溜めない。</p>
        </div>
        <div class="sg-card">
          <div class="sg-icon"><i class="fa-solid fa-comments"></i></div>
          <div class="sg-kicker">Support ／ 相談</div>
          <div class="sg-h">相談窓口</div>
          <p class="sg-body">質問は1か所に集め、翌営業日までに返す。</p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
