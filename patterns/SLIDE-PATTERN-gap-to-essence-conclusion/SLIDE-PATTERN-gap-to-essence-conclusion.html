<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-gap-to-essence-conclusion</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-size: 16px; font-weight: 400; font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。3箱＋結論バンドを上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 横流れ3箱（表面の課題 → 隠れたギャップ → 本質）。等幅・等高184px・中身は上ぞろえ ── */
  .ge-row { display: flex; align-items: stretch; height: 184px; }
  .ge-box { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 24px; border-radius: 11px; background: var(--sk-soft,#F0F0F0); }

  /* 箱の型: KICKER → 見出し18px/700 → 本文16px×2行 */
  .ge-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
  .ge-ttl { margin-top: 12px; font-size: 18px; font-weight: 700; line-height: 1.4; }
  .ge-body { margin-top: 12px; font-size: 16px; line-height: 1.8; }

  /* 箱の間の矢印: 幅48pxの列。1pxの線＋三角矢印（幅12px・アクセント色）で左の箱の右辺から右の箱の左辺まで */
  .ge-conn { flex: none; width: 48px; display: flex; align-items: center; justify-content: center; }
  .ge-conn svg { width: 48px; height: 16px; display: block; }
  .ge-conn path { fill: none; stroke: var(--sk-line,#e2e2e2); stroke-width: 1; shape-rendering: crispEdges; }
  .ge-conn .ge-arw { fill: var(--sk-accent,#555555); stroke: none; shape-rendering: auto; }

  /* 結論バンド: アクセント塗り・白文字・角丸11px（塗りは1枚でここだけ）。KICKER → 結論18px/700 */
  .ge-band { margin-top: 24px; padding: 20px 28px; border-radius: 11px; background: var(--sk-accent,#555555); color: #FFFFFF; }
  .ge-band .ge-kicker { color: #FFFFFF; }
  .ge-concl { margin-top: 8px; font-size: 18px; font-weight: 700; line-height: 1.4; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：表面の課題 → 隠れたギャップ → 本質 の3箱と、下の結論バンド（塗りはバンドだけ） -->
  <div class="content-area">
    <div class="ge-row">

      <!-- 表面の課題 -->
      <div class="ge-box">
        <div class="ge-kicker">SURFACE ／ 表面の課題</div>
        <div class="ge-ttl">問い合わせが来ない</div>
        <div class="ge-body">サイトはあるのに、月の問い合わせがほぼ無い</div>
      </div>

      <div class="ge-conn">
        <svg viewBox="0 0 48 16" aria-hidden="true">
          <path d="M0 8H36"/>
          <path class="ge-arw" d="M36 0L48 8 36 16Z"/>
        </svg>
      </div>

      <!-- 隠れたギャップ -->
      <div class="ge-box">
        <div class="ge-kicker">GAP ／ 隠れたギャップ</div>
        <div class="ge-ttl">誰向けか書いていない</div>
        <div class="ge-body">実績は載っているが、誰向けの何が強みか読めない</div>
      </div>

      <div class="ge-conn">
        <svg viewBox="0 0 48 16" aria-hidden="true">
          <path d="M0 8H36"/>
          <path class="ge-arw" d="M36 0L48 8 36 16Z"/>
        </svg>
      </div>

      <!-- 本質 -->
      <div class="ge-box">
        <div class="ge-kicker">ESSENCE ／ 本質</div>
        <div class="ge-ttl">訴求の設計が無い</div>
        <div class="ge-body">誰に何を約束するかが決まらないまま作っている</div>
      </div>

    </div>

    <!-- 結論バンド（アクセント塗り・白文字） -->
    <div class="ge-band">
      <div class="ge-kicker">CONCLUSION ／ 結論</div>
      <div class="ge-concl">先に決めるのは、誰に何を約束するか</div>
    </div>
  </div>
</div>
</body>
</html>
