<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDE-PATTERN-risk-matrix-2x2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
    .slide {
      width: 960px;
      height: 540px;
      background: #FFFFFF;
      border: 1px solid var(--sk-accent,#CCCCCC);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      /* デザインの規律 v2: 文字の組み */
      color: var(--sk-ink,#3f4a52);
      font-feature-settings: "palt" 1;
      line-break: strict;
      letter-spacing: .06em;
      line-height: 1.8;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }
    /* コンテンツエリア（見出しON時は上76px以降。マトリクスは上下中央） */
    .content-area {
      flex: 1;
      padding: 24px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ── マトリクス全体：左に縦軸ラベル列、下に横軸ラベル行 ── */
    .rm-wrap {
      display: grid;
      grid-template-columns: 32px 1fr;
      grid-template-rows: 1fr 24px;
      gap: 8px;
      height: 392px;
    }
    /* 軸ラベル（KICKER型・muted）。矢印は SVG の三角（幅12px）だけ */
    .rm-axis { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-muted,#888888); white-space: nowrap; }
    .rm-y { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    /* 縦軸は下から上に読む向き（全文字を横倒しにしてから180°回す。和文が逆さにならない） */
    .rm-y .rm-axis { writing-mode: vertical-rl; text-orientation: sideways; transform: rotate(180deg); }
    .rm-x { grid-column: 2; grid-row: 2; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .rm-arw { flex: none; display: block; }

    /* 2×2 グリッド（等高・gap 12px） */
    .rm-grid {
      grid-column: 2;
      grid-row: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
    }
    /* 象限：淡い地・角丸11px。右上（高影響×高確率）だけアクセント塗り（塗りは1枚に1つ） */
    .rm-cell {
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      border-radius: 11px;
      background: var(--sk-soft,#F0F0F0);
      border: 1px solid var(--sk-line,#e2e2e2);
    }
    .rm-cell-fill { background: var(--sk-accent,#555555); border-color: var(--sk-accent,#555555); color: #FFFFFF; }

    /* 象限の型: KICKER → 見出し16px太字 → 1行の説明 → 例：（該当リスク） */
    .rm-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
    .rm-cell-fill .rm-kicker { color: #FFFFFF; }
    .rm-ttl { margin-top: 10px; font-size: 16px; font-weight: 700; line-height: 1.4; }
    .rm-desc { margin-top: 4px; font-size: 16px; line-height: 1.8; }
    .rm-note { margin-top: auto; padding-top: 8px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }
    .rm-cell-fill .rm-note { color: #FFFFFF; opacity: .85; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
  <div class="slide">
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>

    <!-- コンテンツエリア：2×2 マトリクス（右上＝最優先の塗り）＋KICKER型の軸ラベル -->
    <div class="content-area">
      <div class="rm-wrap">

        <!-- 縦軸ラベル（上向きの三角＋影響度） -->
        <div class="rm-y">
          <svg class="rm-arw" width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M0 12L8 0 16 12Z" fill="var(--sk-muted,#888888)"/></svg>
          <span class="rm-axis">IMPACT ／ 影響度</span>
        </div>

        <!-- 2×2 グリッド -->
        <div class="rm-grid">
          <!-- 左上: 高影響・低確率 -->
          <div class="rm-cell">
            <div class="rm-kicker">HIGH IMPACT ／ 低確率</div>
            <div class="rm-ttl">重点管理</div>
            <div class="rm-desc">起きたときの手順を先に決めておく。</div>
            <div class="rm-note">例：システム障害・法規制の変更</div>
          </div>
          <!-- 右上: 高影響・高確率（最優先・塗り） -->
          <div class="rm-cell rm-cell-fill">
            <div class="rm-kicker">HIGH IMPACT ／ 高確率</div>
            <div class="rm-ttl">最優先対応</div>
            <div class="rm-desc">今週中に対策と担当を決める。</div>
            <div class="rm-note">例：人手不足・コスト超過</div>
          </div>
          <!-- 左下: 低影響・低確率 -->
          <div class="rm-cell">
            <div class="rm-kicker">LOW IMPACT ／ 低確率</div>
            <div class="rm-ttl">経過観察</div>
            <div class="rm-desc">月1回の確認だけにして、手を止めない。</div>
            <div class="rm-note">例：軽微な仕様変更</div>
          </div>
          <!-- 右下: 低影響・高確率 -->
          <div class="rm-cell">
            <div class="rm-kicker">LOW IMPACT ／ 高確率</div>
            <div class="rm-ttl">対応計画</div>
            <div class="rm-desc">まとめて処理する日を決めておく。</div>
            <div class="rm-note">例：日程のずれ・認識の食い違い</div>
          </div>
        </div>

        <!-- 横軸ラベル（発生確率＋右向きの三角） -->
        <div class="rm-x">
          <span class="rm-axis">PROBABILITY ／ 発生確率</span>
          <svg class="rm-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="var(--sk-muted,#888888)"/></svg>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
