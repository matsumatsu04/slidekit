<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDE-PATTERN: closing-curve-shape-footer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
    .slide { width:960px; height:540px; border:1px solid #CCCCCC; overflow:hidden; position:relative; font-weight:400; }
    /* 右下に大きな曲面が入る画像背景（この家族だけ画像を使う。色ティント対象外・差し替え可） */
    .cf-bg     { position:absolute; inset:0; background:url('/assets/covers/cover-bg-curved-shape.jpg') center/cover no-repeat; }
    /* v2（2026-09-04）: 左80pxに KICKER → 見出し32px → 64pxの細い罫線 を積み、連絡先だけは現行どおりフッターに横並びで置く。
       共通部品は使えないので、同じ数値を cf- 接頭辞で持つ */
    .cf-wrap   { position:absolute; left:80px; top:0; bottom:140px; width:420px; display:flex; flex-direction:column; justify-content:center; gap:20px; }
    .cf-kicker { font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; line-height:1; color:var(--sk-ink,#3f4a52); }
    .cf-msg    { font-size:32px; font-weight:700; letter-spacing:.06em; line-height:1.35; color:var(--sk-ink,#3f4a52); }
    .cf-rule   { width:64px; height:1px; background:var(--sk-muted,#888888); }
    /* フッター: ラベル（KICKER）と値の左端をそろえた組を横に並べる */
    .cf-foot   { position:absolute; left:80px; bottom:56px; display:flex; gap:36px; }
    .cf-item   { display:flex; flex-direction:column; gap:8px; }
    .cf-label  { font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; line-height:1; color:var(--sk-muted,#888888); }
    .cf-value  { font-size:16px; font-weight:400; letter-spacing:.06em; line-height:1; color:var(--sk-ink,#3f4a52); }

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
  <div class="slide">
    <div class="cf-bg"></div>
    <div class="cf-wrap">
      <div class="cf-kicker">Closing</div>
      <div class="cf-msg">お問い合わせは<br>こちらから</div>
      <div class="cf-rule"></div>
    </div>
    <div class="cf-foot">
      <div class="cf-item">
        <div class="cf-label">Company</div>
        <div class="cf-value">サンプル株式会社</div>
      </div>
      <div class="cf-item">
        <div class="cf-label">Mail</div>
        <div class="cf-value">info@example.com</div>
      </div>
      <div class="cf-item">
        <div class="cf-label">Web</div>
        <div class="cf-value">example.com</div>
      </div>
    </div>
  </div>
</body>
</html>
