<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-proposal-process-checkpoints</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。カード列＋注記は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 工程カード4枚（等幅・等高）を SVG の三角矢印でつなぐ ── */
  .pc-row { display: flex; align-items: stretch; gap: 8px; }
  .pc-card {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    padding: 20px 16px; border-radius: 11px;
    background: var(--sk-soft,#F0F0F0); border: 1px solid var(--sk-line,#e2e2e2);
  }
  /* 現在の工程1枚だけアクセント塗り・白文字（塗りは1枚に1つ） */
  .pc-card-now { background: var(--sk-accent,#555555); border-color: var(--sk-accent,#555555); color: #FFFFFF; }
  /* カードの中身の型：KICKER「STEP n ／ 期間」→ 見出し18px → 細い罫線 → チェックポイント3行 */
  .pc-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
  .pc-card-now .pc-kicker { color: #FFFFFF; }
  .pc-ttl { margin-top: 12px; font-size: 18px; font-weight: 700; line-height: 1.4; }
  .pc-rule { margin-top: 12px; height: 1px; background: var(--sk-line,#e2e2e2); }
  .pc-card-now .pc-rule { background: rgba(255,255,255,.35); }
  .pc-list { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
  .pc-ck { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 1.8; }
  /* チェック記号は SVG（12px・線2px）。行の高さ25pxの中で縦中央に置く */
  .pc-ck svg { flex: none; width: 12px; height: 12px; margin-top: 6px; display: block; }
  .pc-ck svg path { fill: none; stroke: var(--sk-accent,#555555); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pc-card-now .pc-ck svg path { stroke: #FFFFFF; }
  /* 三角矢印（SVG・幅12px） */
  .pc-arw { flex: none; align-self: center; display: block; }
  .pc-note { margin-top: 16px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：工程カード4枚（KICKER／見出し／罫線／チェックポイント3行）→ 三角矢印 → 注記 -->
  <div class="content-area">
    <div class="pc-row">

      <div class="pc-card">
        <div class="pc-kicker">STEP 1 ／ 1週目</div>
        <div class="pc-ttl">ヒアリング</div>
        <div class="pc-rule"></div>
        <div class="pc-list">
          <div class="pc-ck"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5L5 9.5 10 3"/></svg><span>目的とゴールの確認</span></div>
          <div class="pc-ck"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5L5 9.5 10 3"/></svg><span>現状の課題の整理</span></div>
          <div class="pc-ck"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5L5 9.5 10 3"/></svg><span>予算と納期の目安</span></div>
        </div>
      </div>
      <svg class="pc-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="var(--sk-accent,#555555)"/></svg>

      <div class="pc-card pc-card-now">
        <div class="pc-kicker">STEP 2 ／ 2週目</div>
        <div class="pc-ttl">提案・見積</div>
        <div class="pc-rule"></div>
        <div class="pc-list">
          <div class="pc-ck"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5L5 9.5 10 3"/></svg><span>構成案と参考例</span></div>
          <div class="pc-ck"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5L5 9.5 10 3"/></svg><span>見積と契約条件</span></div>
          <div class="pc-ck"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5L5 9.5 10 3"/></svg><span>進め方の合意</span></div>
        </div>
      </div>
      <svg class="pc-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="var(--sk-accent,#555555)"/></svg>

      <div class="pc-card">
        <div class="pc-kicker">STEP 3 ／ 3〜6週目</div>
        <div class="pc-ttl">制作</div>
        <div class="pc-rule"></div>
        <div class="pc-list">
          <div class="pc-ck"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5L5 9.5 10 3"/></svg><span>初稿デザインの確認</span></div>
          <div class="pc-ck"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5L5 9.5 10 3"/></svg><span>修正は2回まで</span></div>
          <div class="pc-ck"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5L5 9.5 10 3"/></svg><span>原稿と写真の受領</span></div>
        </div>
      </div>
      <svg class="pc-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="var(--sk-accent,#555555)"/></svg>

      <div class="pc-card">
        <div class="pc-kicker">STEP 4 ／ 7週目</div>
        <div class="pc-ttl">公開・引き渡し</div>
        <div class="pc-rule"></div>
        <div class="pc-list">
          <div class="pc-ck"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5L5 9.5 10 3"/></svg><span>公開前の最終確認</span></div>
          <div class="pc-ck"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5L5 9.5 10 3"/></svg><span>操作説明の実施</span></div>
          <div class="pc-ck"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5L5 9.5 10 3"/></svg><span>保守範囲の確認</span></div>
        </div>
      </div>

    </div>
    <div class="pc-note">例：✓ はお客様に確認いただく項目。塗りは現在の工程（今ここ）</div>
  </div>
</div>
</body>
</html>
