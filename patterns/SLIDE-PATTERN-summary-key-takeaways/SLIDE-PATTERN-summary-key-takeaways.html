<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-summary-key-takeaways</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-size: 16px; font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。一覧＋ピルの束は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; align-items: center; }

  /* ── 上段: KICKER。下に細罫線 ── */
  .kt-top { width: 100%; padding: 0 16px 12px; border-bottom: 1px solid var(--sk-line,#e2e2e2); }
  .kt-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }

  /* ── 行: 番号（24px・400・アクセント色）＋ 見出し18px → 本文16px。行は細罫線で区切る。塗りなし ── */
  .kt-list { width: 100%; display: flex; flex-direction: column; }
  .kt-row { display: grid; grid-template-columns: 40px 1fr; gap: 16px; align-items: start; padding: 16px 16px; border-top: 1px solid var(--sk-line,#e2e2e2); }
  .kt-row:first-child { border-top: none; }
  .kt-no { font-size: 24px; font-weight: 400; line-height: 1; letter-spacing: 0; color: var(--sk-accent,#555555); padding-top: 1px; }
  .kt-text { min-width: 0; }
  .kt-ttl { font-size: 18px; font-weight: 700; line-height: 1.4; }
  .kt-body { margin-top: 4px; font-size: 16px; font-weight: 400; line-height: 1.8; }

  /* ── 結論ピル（このスライドで唯一のアクセント塗り） ── */
  .kt-pill { display: inline-flex; align-items: center; justify-content: center; margin-top: 24px; height: 34px; padding: 0 28px; border-radius: 17px;
             background: var(--sk-accent,#666666); color: #FFFFFF; font-size: 14px; font-weight: 400; letter-spacing: .2em; line-height: 1; white-space: nowrap; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：KICKER ／ 持ち帰り3行（番号＋見出し＋本文・細罫線区切り）／ 結論ピル -->
  <div class="content-area">

    <div class="kt-top">
      <div class="kt-kicker">KEY TAKEAWAYS ／ 持ち帰り3点</div>
    </div>

    <div class="kt-list">
      <div class="kt-row">
        <div class="kt-no">1</div>
        <div class="kt-text">
          <div class="kt-ttl">任せる範囲と確認する範囲を、先に線引きする</div>
          <div class="kt-body">AIの出力を毎回ゼロから読み直さないために、着手前に1枚で決めておく。</div>
        </div>
      </div>
      <div class="kt-row">
        <div class="kt-no">2</div>
        <div class="kt-text">
          <div class="kt-ttl">小さく試して、崩れなければ次の工程へ広げる</div>
          <div class="kt-body">ページ単位の試作から始めると、戻りが出ても直す範囲が小さく済む。</div>
        </div>
      </div>
      <div class="kt-row">
        <div class="kt-no">3</div>
        <div class="kt-text">
          <div class="kt-ttl">確認の手順を型にして、誰が見ても同じ品質で通す</div>
          <div class="kt-body">数字・固有名詞・リンクの3点を見る順番まで決めておけば、担当が変わってもぶれない。</div>
        </div>
      </div>
    </div>

    <div class="kt-pill">線引きしてから、小さく試す</div>

  </div>
</div>
</body>
</html>
