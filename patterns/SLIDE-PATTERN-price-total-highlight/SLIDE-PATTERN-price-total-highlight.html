<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-price-total-highlight</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。内訳表＋合計パネルの行は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 左：内訳の表（罫線だけ）／ 右：合計パネル（唯一の塗り）。等高 ── */
  .pt-row { display: flex; gap: 16px; align-items: stretch; height: 280px; }
  .pt-left { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pt-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  /* 列見出しは KICKER 型（塗らない・下罫線だけ） */
  .pt-table th {
    font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1;
    color: var(--sk-accent,#555555); text-align: left; vertical-align: middle; height: 32px; padding: 0 12px;
    border-bottom: 1px solid var(--sk-line,#e2e2e2);
  }
  .pt-table td {
    font-size: 16px; line-height: 1.8; text-align: left; vertical-align: middle;
    height: 48px; padding: 8px 12px; border-bottom: 1px solid var(--sk-line,#e2e2e2);
  }
  .pt-table th.pt-price, .pt-table td.pt-price { text-align: right; }
  .pt-table td.pt-item { font-weight: 700; }
  /* 合計行だけ淡い地・金額28px・太字・アクセント色 */
  .pt-table tr.pt-total td { background: var(--sk-soft,#F0F0F0); height: 56px; border-bottom: none; }
  .pt-table tr.pt-total td.pt-item { border-radius: 10px 0 0 10px; }
  .pt-table tr.pt-total td.pt-price { border-radius: 0 10px 10px 0; font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: .02em; color: var(--sk-accent,#555555); }
  .pt-table tr.pt-total td.pt-scope { font-size: 11.5px; color: var(--sk-muted,#888888); }
  .pt-note { margin-top: auto; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

  /* 合計パネル（アクセント塗り・白文字。塗りは1枚に1つ） */
  .pt-panel { flex: none; width: 280px; display: flex; flex-direction: column; padding: 24px 28px; border-radius: 12px;
              background: var(--sk-accent,#555555); color: #FFFFFF; }
  .pt-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: #FFFFFF; white-space: nowrap; }
  .pt-num-row { margin-top: 16px; display: flex; align-items: baseline; gap: 6px; }
  .pt-num { font-size: 32px; font-weight: 700; line-height: 1; letter-spacing: .02em; color: #FFFFFF; }
  .pt-unit { font-size: 14px; font-weight: 400; line-height: 1; color: #FFFFFF; }
  .pt-rule { margin-top: 16px; height: 1px; background: rgba(255,255,255,.35); }
  .pt-lines { margin-top: 12px; font-size: 16px; line-height: 1.8; }
  .pt-panel .pt-note { color: #FFFFFF; opacity: .85; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左＝内訳の表（罫線だけ）／右＝合計パネル（唯一の塗り） -->
  <div class="content-area">
    <div class="pt-row">

      <!-- 左：内訳の表 -->
      <div class="pt-left">
        <table class="pt-table">
          <thead>
            <tr>
              <th style="width:144px;">Item ／ 項目</th>
              <th>Scope ／ 範囲</th>
              <th class="pt-price" style="width:184px;">Price ／ 金額</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="pt-item">デザイン</td>
              <td class="pt-scope">TOP＋下層4ページの制作</td>
              <td class="pt-price">320,000円</td>
            </tr>
            <tr>
              <td class="pt-item">実装</td>
              <td class="pt-scope">スマホ対応・フォーム設置</td>
              <td class="pt-price">240,000円</td>
            </tr>
            <tr>
              <td class="pt-item">ディレクション</td>
              <td class="pt-scope">進行管理・公開前の確認</td>
              <td class="pt-price">80,000円</td>
            </tr>
            <tr class="pt-total">
              <td class="pt-item">合計</td>
              <td class="pt-scope">税別・素材はご支給の場合</td>
              <td class="pt-price">640,000円</td>
            </tr>
          </tbody>
        </table>
        <div class="pt-note">例：ページの追加は1枚あたり4万円で見積もる</div>
      </div>

      <!-- 右：合計パネル（アクセント塗り・白文字） -->
      <div class="pt-panel">
        <div class="pt-kicker">TOTAL ／ 合計</div>
        <div class="pt-num-row"><span class="pt-num">64</span><span class="pt-unit">万円（税別）</span></div>
        <div class="pt-rule"></div>
        <div class="pt-lines">発行から1ヶ月まで有効<br>着手時50%・納品時50%<br>公開後の更新は月額で別途</div>
        <div class="pt-note">例：初回のお支払いは32万円</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
