<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-estimate-base-plus-options</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。基本＋オプションの行と合計行を上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 上段：左＝基本プランのカード（淡い地）／中央＝＋／右＝オプション3枚（罫線枠）。等高 ── */
  .bo-row { display: flex; align-items: stretch; height: 280px; }
  .bo-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#666666); white-space: nowrap; }

  /* 左：基本プラン（--sk-soft 地・角丸11px・上ぞろえ）。型: KICKER → プラン名18px → 内容3行 → 細罫線 → 金額20px */
  .bo-base { flex: none; width: 400px; display: flex; flex-direction: column; padding: 24px 28px; border-radius: 11px; background: var(--sk-soft,#F0F0F0); }
  .bo-name { margin-top: 12px; font-size: 18px; font-weight: 700; line-height: 1.4; }
  .bo-lines { margin-top: 8px; font-size: 16px; line-height: 1.8; }
  .bo-rule { margin-top: auto; height: 1px; background: var(--sk-line,#e2e2e2); }
  .bo-amount-row { margin-top: 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .bo-amount-label { font-size: 11.5px; line-height: 1; color: var(--sk-muted,#888888); }
  .bo-amount { font-size: 20px; font-weight: 700; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 中央：＋（24px・muted。図形ではなく文字1つ） */
  .bo-op { flex: none; width: 64px; display: flex; align-items: center; justify-content: center; font-size: 24px; line-height: 1; color: var(--sk-muted,#888888); }

  /* 右：オプション3枚を縦積み（1.5px の罫線枠・角丸8px・等高）。型: KICKER → 名前16px、右に金額 */
  .bo-opts { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .bo-opt { flex: 1; min-height: 0; display: flex; align-items: center; gap: 16px; padding: 0 24px; border: 1.5px solid var(--sk-line,#e2e2e2); border-radius: 8px; }
  .bo-opt-body { flex: 1; min-width: 0; }
  .bo-opt-name { margin-top: 6px; font-size: 16px; font-weight: 700; line-height: 1.4; }
  .bo-opt-price { flex: none; font-size: 16px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ── 下段：合計行（アクセント塗り・白文字・角丸8px）。1枚で塗るのはここだけ ── */
  .bo-total { margin-top: 16px; height: 56px; display: flex; align-items: center; padding: 0 28px; border-radius: 8px; background: var(--sk-accent,#555555); color: #FFFFFF; }
  .bo-total .bo-kicker { color: #FFFFFF; }
  .bo-total-tax { margin-left: auto; font-size: 11.5px; line-height: 1; color: #FFFFFF; opacity: .85; }
  .bo-total-sum { margin-left: 16px; font-size: 20px; font-weight: 700; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 注記：11.5px・muted */
  .bo-note { margin-top: 12px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左＝基本プラン（淡い地）＋ 右＝オプション3枚（罫線枠）→ 下に合計行（唯一の塗り） -->
  <div class="content-area">
    <div class="bo-row">

      <!-- 左：基本プランのカード -->
      <div class="bo-base">
        <div class="bo-kicker">BASE ／ 基本</div>
        <div class="bo-name">コーポレートサイト制作（5ページ）</div>
        <div class="bo-lines">TOP＋下層4ページのデザイン<br>スマホ対応・お問い合わせフォーム<br>公開までの進行管理</div>
        <div class="bo-rule"></div>
        <div class="bo-amount-row"><span class="bo-amount-label">基本料金（税別）</span><span class="bo-amount">¥640,000</span></div>
      </div>

      <!-- 中央：＋ -->
      <div class="bo-op">＋</div>

      <!-- 右：オプション3枚（縦積み・等高） -->
      <div class="bo-opts">
        <div class="bo-opt">
          <div class="bo-opt-body"><div class="bo-kicker">OPTION 1 ／ 任意</div><div class="bo-opt-name">下層ページの追加（1ページ）</div></div>
          <div class="bo-opt-price">+¥40,000</div>
        </div>
        <div class="bo-opt">
          <div class="bo-opt-body"><div class="bo-kicker">OPTION 2 ／ 任意</div><div class="bo-opt-name">写真撮影（半日・20カット）</div></div>
          <div class="bo-opt-price">+¥80,000</div>
        </div>
        <div class="bo-opt">
          <div class="bo-opt-body"><div class="bo-kicker">OPTION 3 ／ 任意</div><div class="bo-opt-name">英語ページの制作</div></div>
          <div class="bo-opt-price">+¥60,000</div>
        </div>
      </div>

    </div>

    <!-- 下段：合計行（アクセント塗り・白文字） -->
    <div class="bo-total">
      <div class="bo-kicker">TOTAL ／ 基本＋オプション3件</div>
      <div class="bo-total-tax">税別</div>
      <div class="bo-total-sum">¥820,000</div>
    </div>
    <div class="bo-note">例：オプションは必要な分だけ選べる。選ばない場合の合計は基本料金と同じ</div>
  </div>
</div>
</body>
</html>
