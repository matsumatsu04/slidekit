<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDE-PATTERN-summary-three-points</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
    .slide {
      width: 960px;
      height: 540px;
      background: #FFFFFF;
      border: 1px solid var(--sk-accent,#CCCCCC);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--sk-ink,#3f4a52);
      font-weight: 400;
      font-feature-settings: "palt" 1;
      line-break: strict;
      letter-spacing: .06em;
      line-height: 1.8;
    }
    /* v2（2026-09-02）: 3枚の淡いカード（KICKER→見出し→罫線→本文）＋下に結論ピル。塗りはピルだけ。
       共通部品は使えないので、同じ数値を sp- 接頭辞で持つ */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      padding: 0 48px;
    }
    .sp-cards  { display:flex; gap:16px; width:100%; align-items:stretch; }
    .sp-card   { flex:1; background:var(--sk-soft,#F0F0F0); border-radius:12px; padding:24px; display:flex; flex-direction:column; gap:8px; }
    .sp-kicker { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--sk-accent,#666666); line-height:1; }
    .sp-head   { font-size:16px; font-weight:700; letter-spacing:.06em; line-height:1.5; }
    .sp-rule   { height:1px; background:var(--sk-line,#e2e2e2); margin:4px 0; }
    .sp-body   { font-size:16px; font-weight:400; letter-spacing:.06em; line-height:1.8; }
    .sp-pill   { display:inline-flex; align-items:center; justify-content:center; height:34px; padding:0 28px; border-radius:17px;
                 background:var(--sk-accent,#666666); color:#FFFFFF; font-size:14px; font-weight:400; letter-spacing:.2em; line-height:1; white-space:nowrap; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}
</style>
</head>
<body>
  <div class="slide">
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>

    <!-- コンテンツエリア -->
    <div class="content-area">
      <div class="sp-cards">
        <!-- ポイント 1 -->
        <div class="sp-card">
          <div class="sp-kicker">Point 1 ／ 前提</div>
          <div class="sp-head">判断の基準を先に決める</div>
          <div class="sp-rule"></div>
          <div class="sp-body">AIに任せる範囲と、人が最後に決める範囲を、着手前に線引きしておく。</div>
        </div>
        <!-- ポイント 2 -->
        <div class="sp-card">
          <div class="sp-kicker">Point 2 ／ 進め方</div>
          <div class="sp-head">小さく試して段階で広げる</div>
          <div class="sp-rule"></div>
          <div class="sp-body">ページ単位の試作から始め、崩れなければ次の工程へ広げていく。</div>
        </div>
        <!-- ポイント 3 -->
        <div class="sp-card">
          <div class="sp-kicker">Point 3 ／ 運用</div>
          <div class="sp-head">確認の手順を型にする</div>
          <div class="sp-rule"></div>
          <div class="sp-body">見る順番と確認項目を決めておけば、誰が見ても同じ品質で通せる。</div>
        </div>
      </div>
      <div class="sp-pill">線引きしてから、小さく試す</div>
    </div>
  </div>
</body>
</html>
