<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-vertical-timeline-label-list</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。タイムラインは幅720pxで上下中央） */
  .content-area { flex: 1; padding: 24px 120px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 縦タイムライン：行の高さは固定（幹線の端点をノードの中心で止めるため） ── */
  .vl-list { position: relative; }
  /* 幹線（1px・罫線色）：最初のノードの中心（top 14px）から最後のノードの中心（bottom 88-14px）まで。左=日付列104px＋ノード列の中心20px */
  .vl-list::before { content: ""; position: absolute; left: 124px; margin-left: -0.5px; top: 14px; bottom: 74px; width: 1px; background: var(--sk-line,#e2e2e2); }
  .vl-row { position: relative; display: flex; align-items: flex-start; height: 88px; }
  /* 左：日付ラベル（KICKER型・muted）。見出し行と垂直中心を合わせる */
  .vl-date { flex: none; width: 104px; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 28px; color: var(--sk-muted,#888888); white-space: nowrap; }
  /* 中央：小さな丸ノード（白・1.5px 罫線色の枠）。幹線の上に載る */
  .vl-axis { flex: none; width: 40px; display: flex; justify-content: center; padding-top: 8px; }
  .vl-node { position: relative; z-index: 1; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--sk-line,#e2e2e2); background: #FFFFFF; }
  /* 最新の1件だけノードを塗り、見出しをアクセント色に（塗りは1枚に1つ） */
  .vl-row-now .vl-node { background: var(--sk-accent,#555555); border-color: var(--sk-accent,#555555); }
  .vl-row-now .vl-ttl { color: var(--sk-accent,#555555); }
  /* 右：見出し16px太字 → 本文16px → 例： */
  .vl-text { flex: 1; min-width: 0; padding-left: 16px; }
  .vl-ttl { font-size: 16px; font-weight: 700; line-height: 28px; }
  .vl-body { margin-top: 2px; font-size: 16px; line-height: 1.8; }
  .vl-note { font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左に日付ラベル・中央に幹線＋丸ノード・右に見出しと本文（最新の1件だけ塗り） -->
  <div class="content-area">
    <div class="vl-list">

      <div class="vl-row">
        <div class="vl-date">2026.04</div>
        <div class="vl-axis"><div class="vl-node"></div></div>
        <div class="vl-text">
          <div class="vl-ttl">申込と初回面談</div>
          <div class="vl-body">いまの業務の流れと、詰まっている所を30分で聞き取る。</div>
          <div class="vl-note">例：オンライン。資料の準備は不要</div>
        </div>
      </div>

      <div class="vl-row">
        <div class="vl-date">2026.05</div>
        <div class="vl-axis"><div class="vl-node"></div></div>
        <div class="vl-text">
          <div class="vl-ttl">範囲と期間を決めて契約</div>
          <div class="vl-body">見積と契約書を確認し、開始日と担当を決める。</div>
          <div class="vl-note">例：開始の1週間前まで</div>
        </div>
      </div>

      <div class="vl-row">
        <div class="vl-date">2026.06</div>
        <div class="vl-axis"><div class="vl-node"></div></div>
        <div class="vl-text">
          <div class="vl-ttl">1業務を組んで試す</div>
          <div class="vl-body">手直しの量を測り、通った手順を手順書に直す。</div>
          <div class="vl-note">例：2週間で1業務</div>
        </div>
      </div>

      <div class="vl-row vl-row-now">
        <div class="vl-date">2026.07 ／ 現在</div>
        <div class="vl-axis"><div class="vl-node"></div></div>
        <div class="vl-text">
          <div class="vl-ttl">運用に移す</div>
          <div class="vl-body">使う人に手順を渡し、月1回の見直しで対象を増やす。</div>
          <div class="vl-note">例：月次レビュー30分</div>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
