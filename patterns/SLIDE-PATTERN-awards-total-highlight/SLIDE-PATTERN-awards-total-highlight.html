<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-awards-total-highlight</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。ブロックは上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 左：合計（大きな数字）｜縦1px罫線｜右：内訳3つの横並び（細罫線で区切る）。面の塗りなし ── */
  .aw-wrap { display: flex; align-items: stretch; }
  .aw-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }

  /* 左：合計。型: KICKER → 数字48px・400・アクセント色＋単位16px → 説明14px（muted）→ 注記 */
  .aw-total { flex: none; width: 304px; padding-right: 40px; display: flex; flex-direction: column; justify-content: center; }
  .aw-total-row { margin-top: 16px; display: flex; align-items: baseline; gap: 4px; }
  .aw-total-num { font-size: 48px; font-weight: 400; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; color: var(--sk-accent,#555555); }
  .aw-total-unit { font-size: 16px; font-weight: 400; line-height: 1; }
  .aw-total-desc { margin-top: 12px; font-size: 16px; line-height: 1.8; color: var(--sk-muted,#888888); }
  .aw-note { margin-top: 4px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

  /* 中央：縦1px罫線（左ブロックの高さに合わせて伸びる） */
  .aw-vrule { flex: none; width: 1px; background: var(--sk-line,#e2e2e2); }

  /* 右：内訳3つ（等幅・上下中央）。型: KICKER → 数字24px・700＋単位14px → ラベル14px。列は細罫線で区切る */
  .aw-break { flex: 1; min-width: 0; padding-left: 40px; display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; }
  .aw-item { min-width: 0; padding: 0 20px; border-left: 1px solid var(--sk-line,#e2e2e2); }
  .aw-item:first-child { padding-left: 0; border-left: none; }
  .aw-num-row { margin-top: 12px; display: flex; align-items: baseline; gap: 4px; }
  .aw-num { font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .aw-unit { font-size: 16px; font-weight: 400; line-height: 1; }
  .aw-label { margin-top: 8px; font-size: 16px; line-height: 1.8; white-space: nowrap; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左＝合計（大きな数字）｜縦罫線｜右＝内訳3つ。塗りは置かない -->
  <div class="content-area">
    <div class="aw-wrap">

      <!-- 左：合計 -->
      <div class="aw-total">
        <div class="aw-kicker">TOTAL ／ 累計</div>
        <div class="aw-total-row"><span class="aw-total-num">45</span><span class="aw-total-unit">件</span></div>
        <div class="aw-total-desc">受賞・認定・掲載の合計</div>
        <div class="aw-note">例：前期末時点・同一案件は1件と数える</div>
      </div>

      <!-- 中央：縦1px罫線 -->
      <div class="aw-vrule"></div>

      <!-- 右：内訳3つ（細罫線で区切る） -->
      <div class="aw-break">
        <div class="aw-item">
          <div class="aw-kicker">AWARDS ／ 受賞</div>
          <div class="aw-num-row"><span class="aw-num">12</span><span class="aw-unit">件</span></div>
          <div class="aw-label">デザイン賞・入選</div>
        </div>
        <div class="aw-item">
          <div class="aw-kicker">CERTIFIED ／ 認定</div>
          <div class="aw-num-row"><span class="aw-num">8</span><span class="aw-unit">件</span></div>
          <div class="aw-label">公的機関の認定</div>
        </div>
        <div class="aw-item">
          <div class="aw-kicker">MEDIA ／ 掲載</div>
          <div class="aw-num-row"><span class="aw-num">25</span><span class="aw-unit">件</span></div>
          <div class="aw-label">業界誌・Web記事</div>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
