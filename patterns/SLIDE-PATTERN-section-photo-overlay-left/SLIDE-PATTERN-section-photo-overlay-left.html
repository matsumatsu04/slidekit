<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-section-photo-overlay-left</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide { width:960px; height:540px; background:#FFFFFF; border:1px solid #CCCCCC; overflow:hidden; position:relative;
           font-weight:400; font-feature-settings:"palt" 1; line-break:strict; letter-spacing:.06em; line-height:1.8; }
  /* v2（2026-09-04）: 実写写真＋暗色オーバーレイの上に、左80pxから
     KICKER「SECTION 03」（10px・白82%）→ 章タイトル（32px・700・白）→ 64px の白罫線 → 補足1行 を縦積みし、上下中央に置く。
     背景画像はこの家族の識別子なので残す（色ティント対象外）。オーバーレイの rgba(15,18,24,.45) は写真に合わせた固有色。
     旧版の4px縦バーは v2 の「装飾は1つまで」に合わせて外し、罫線1本に絞った。中扉なので共通見出し（sk-head）は持たない。
     共通部品は使えないので、同じ数値を spo- 接頭辞で持つ */
  .spo-bg      { position:absolute; inset:0; background:url('/assets/covers/cover-bg-photo-architecture.jpg') center/cover no-repeat; }
  .spo-overlay { position:absolute; inset:0; background:rgba(15,18,24,.45); }
  .spo-block   { position:absolute; left:80px; top:50%; transform:translateY(-50%); max-width:640px; }
  .spo-kicker  { font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; line-height:1; color:rgba(255,255,255,.82); }
  .spo-title   { margin-top:20px; font-size:32px; font-weight:700; letter-spacing:.06em; line-height:1.35; color:#FFFFFF; }
  .spo-rule    { width:64px; height:1px; background:rgba(255,255,255,.4); margin:24px 0 20px; }
  .spo-sub     { font-size:16px; font-weight:400; letter-spacing:.06em; line-height:1.8; color:rgba(255,255,255,.85); }

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <div class="spo-bg"></div>
  <div class="spo-overlay"></div>
  <div class="spo-block">
    <div class="spo-kicker">Section 03</div>
    <div class="spo-title">導入前に決めておく<br>判断基準と承認の体制</div>
    <div class="spo-rule"></div>
    <div class="spo-sub">誰が何を承認するかを先に決め、後戻りが起きる工程を減らす</div>
  </div>
</div>
</body>
</html>
