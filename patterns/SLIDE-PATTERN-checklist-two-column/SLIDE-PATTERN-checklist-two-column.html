<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-checklist-two-column</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-size: 16px; font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。2列の束は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 左右2列（等幅・等高・上ぞろえ）＋中央の1px縦罫線。アクセント塗りなし ── */
  .cl-row { display: flex; align-items: stretch; }
  .cl-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .cl-col:first-child { padding-right: 32px; }
  .cl-col:last-child { padding-left: 32px; }
  .cl-divider { flex: none; width: 1px; background: var(--sk-line,#e2e2e2); }

  /* 列の型: KICKER（列名）→ 項目（チェック記号＋16px）。項目は細罫線で区切る */
  .cl-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; padding: 0 0 12px; border-bottom: 1px solid var(--sk-line,#e2e2e2); }
  .cl-item { display: grid; grid-template-columns: 14px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--sk-line,#e2e2e2); }
  .cl-kicker + .cl-item { border-top: none; }
  .cl-text { font-size: 16px; font-weight: 400; line-height: 1.8; min-width: 0; }
  /* チェック記号: アクセント色 1.5px 枠の小さな四角（本文1行の縦中央に合わせる） */
  .cl-check { position: relative; width: 14px; height: 14px; margin-top: 7px; border: 1.5px solid var(--sk-accent,#555555); border-radius: 2px; }
  /* 済み: アクセント塗りの四角＋白のチェック（CSSで描く。塗りはこの小さな記号だけ） */
  .cl-check.is-done { background: var(--sk-accent,#555555); }
  .cl-check.is-done::after { content: ""; position: absolute; left: 3px; top: 0px; width: 4px; height: 7px; border: solid #FFFFFF; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
  /* 注記（例：〜）。2列の下に1行 */
  .cl-note { margin-top: 16px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左右2列のチェックリスト（KICKER → 項目×4）。中央に1pxの縦罫線。先頭1項目だけ済み -->
  <div class="content-area">
    <div class="cl-row">

      <!-- 左列 -->
      <div class="cl-col">
        <div class="cl-kicker">BEFORE ／ 着手前に</div>
        <div class="cl-item"><div class="cl-check is-done"></div><div class="cl-text">任せる範囲と確認する範囲を1枚に書く</div></div>
        <div class="cl-item"><div class="cl-check"></div><div class="cl-text">確認項目（数字・固有名詞・リンク）を決める</div></div>
        <div class="cl-item"><div class="cl-check"></div><div class="cl-text">試作するページを1つ選ぶ</div></div>
        <div class="cl-item"><div class="cl-check"></div><div class="cl-text">確認する人と回数を決める</div></div>
      </div>

      <!-- 中央の縦罫線 -->
      <div class="cl-divider"></div>

      <!-- 右列 -->
      <div class="cl-col">
        <div class="cl-kicker">RELEASE ／ 公開前に</div>
        <div class="cl-item"><div class="cl-check"></div><div class="cl-text">数字と固有名詞を出典と突き合わせる</div></div>
        <div class="cl-item"><div class="cl-check"></div><div class="cl-text">リンク先を実際に開いて確かめる</div></div>
        <div class="cl-item"><div class="cl-check"></div><div class="cl-text">表記ゆれを用語集で直す</div></div>
        <div class="cl-item"><div class="cl-check"></div><div class="cl-text">承認者の確認を記録に残す</div></div>
      </div>

    </div>
    <div class="cl-note">例：済んだ項目は □ を塗りの ✓ に変える。列は「時期」や「担当」で分ける</div>
  </div>
</div>
</body>
</html>
