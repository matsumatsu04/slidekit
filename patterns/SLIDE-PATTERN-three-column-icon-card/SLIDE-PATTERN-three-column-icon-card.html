<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-three-column-icon-card</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  /* デザインの規律 v2：文字の組みは .slide に集約（palt・禁則・字間.06em・行間1.8・インク色・太さは400/700のみ） */
  .slide { width:960px; height:540px; background:#FFFFFF; overflow:hidden; position:relative; box-sizing:border-box;
           color:var(--sk-ink,#444444); font-size:16px; font-weight:400; line-height:1.8; letter-spacing:.06em;
           font-feature-settings:"palt" 1; line-break:strict; -webkit-font-smoothing:antialiased; }
  .slide p { margin:0; }
  /* 本文エリア：左右48px・見出しONで上76px・中身は上下中央 */
  .content-area { position:absolute; left:48px; right:48px; top:0; bottom:0; display:flex; align-items:center; }
  html[data-heading="on"] .content-area { top:76px; }

  /* 3カード：等高・gap16・角丸11。中央だけ塗り（1枚に塗りは1つ） */
  .tc-cards { width:100%; height:336px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .tc-card { box-sizing:border-box; border-radius:11px; padding:28px 24px; background:#FFFFFF; border:1px solid var(--sk-line,#E2E2E2);
             display:flex; flex-direction:column; align-items:flex-start; }
  .tc-fill { background:var(--sk-accent,#555555); border-color:var(--sk-accent,#555555); color:#FFFFFF; }
  /* アイコン：20px・丸地は soft（塗りカード内は白の半透明） */
  .tc-icon { width:40px; height:40px; border-radius:50%; background:var(--sk-soft,#F0F0F0); display:flex; align-items:center; justify-content:center;
             font-size:20px; line-height:1; color:var(--sk-accent,#666666); margin-bottom:20px; }
  .tc-fill .tc-icon { background:rgba(255,255,255,.2); color:#FFFFFF; }
  /* カードの型：KICKER → 見出し → 細罫線 → 本文 → 例： */
  .tc-kicker { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-accent,#666666); }
  .tc-fill .tc-kicker { color:#FFFFFF; }
  .tc-h { margin-top:8px; font-size:18px; font-weight:700; line-height:1.4; }
  .tc-line { width:100%; height:1px; background:var(--sk-line,#E2E2E2); margin:12px 0; }
  .tc-fill .tc-line { background:rgba(255,255,255,.35); }
  .tc-body { font-size:16px; line-height:1.8; }
  .tc-note { margin-top:12px; font-size:11.5px; line-height:1.8; color:var(--sk-muted,#8A8A8A); }
  .tc-fill .tc-note { color:#FFFFFF; opacity:.8; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：3カード（中央が主役＝塗り） -->
  <div class="content-area">
    <div class="tc-cards">
      <div class="tc-card">
        <div class="tc-icon"><i class="fa-solid fa-comments"></i></div>
        <div class="tc-kicker">Support ／ 伴走</div>
        <div class="tc-h">週1回の定例</div>
        <div class="tc-line"></div>
        <p class="tc-body">進捗と詰まりを30分で確認する。</p>
        <div class="tc-note">例：火曜10時に固定</div>
      </div>
      <div class="tc-card tc-fill">
        <div class="tc-icon"><i class="fa-solid fa-pen-ruler"></i></div>
        <div class="tc-kicker">Build ／ 制作</div>
        <div class="tc-h">型で組み立てる</div>
        <div class="tc-line"></div>
        <p class="tc-body">構図と文言を先に決め、装飾は最後に足す。</p>
        <div class="tc-note">例：設計書を1枚にまとめる</div>
      </div>
      <div class="tc-card">
        <div class="tc-icon"><i class="fa-solid fa-rotate"></i></div>
        <div class="tc-kicker">Review ／ 見直し</div>
        <div class="tc-h">月1回の振り返り</div>
        <div class="tc-line"></div>
        <p class="tc-body">数字と手順を見て、翌月の直し方を決める。</p>
        <div class="tc-note">例：月末の30分を確保する</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
