<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-section-geo-texture-left</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide { width:960px; height:540px; background:#FFFFFF; border:1px solid #CCCCCC; overflow:hidden; position:relative;
           color:var(--sk-ink,#3f4a52); font-weight:400; font-feature-settings:"palt" 1; line-break:strict; letter-spacing:.06em; line-height:1.8; }
  /* v2（2026-09-04）: 紙質感の幾何テクスチャ背景の左に、左80pxから
     KICKER「SECTION 02」（10px・accent2）→ 章タイトル（32px・700・インク色）→ 64px の罫線 → 補足1行 を縦積みし、上下中央に置く。
     背景画像はこの家族の識別子なので残す（色ティント対象外）。罫線の #CCC6BA は背景の砂色に合わせた固有色。
     旧版の88pxの特大章番号は、中扉4種の文字の組みに合わせて英字KICKERへ組み替えた。中扉なので共通見出し（sk-head）は持たない。
     共通部品は使えないので、同じ数値を sgt- 接頭辞で持つ */
  .sgt-bg     { position:absolute; inset:0; background:url('/assets/covers/cover-bg-geometric-paper.jpg') center/cover no-repeat; }
  .sgt-block  { position:absolute; left:80px; top:50%; transform:translateY(-50%); max-width:560px; }
  .sgt-kicker { font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; line-height:1; color:var(--sk-accent2,#999999); }
  .sgt-title  { margin-top:20px; font-size:32px; font-weight:700; letter-spacing:.06em; line-height:1.35; color:var(--sk-ink,#3f4a52); }
  .sgt-rule   { width:64px; height:1px; background:#CCC6BA; margin:24px 0 20px; }
  .sgt-sub    { font-size:16px; font-weight:400; letter-spacing:.06em; line-height:1.8; color:var(--sk-muted,#888888); }

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <div class="sgt-bg"></div>
  <div class="sgt-block">
    <div class="sgt-kicker">Section 02</div>
    <div class="sgt-title">制作から公開までの<br>工程と担当の分け方</div>
    <div class="sgt-rule"></div>
    <div class="sgt-sub">工程ごとに担当と締切を置き、待ちの時間を短くする</div>
  </div>
</div>
</body>
</html>
