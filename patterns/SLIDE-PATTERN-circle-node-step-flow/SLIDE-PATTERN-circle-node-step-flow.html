<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-circle-node-step-flow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。ノード列は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── ノード列（5列等幅・上ぞろえ） ── */
  .cn-row { display: flex; align-items: flex-start; }
  .cn-col { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 8px; }
  /* 幹線（1px・罫線色）：各列の左半分・右半分に分けて引く → 端点がノードの中心で止まる。先頭列の左半分・末尾列の右半分は引かない */
  .cn-col::before, .cn-col::after { content: ""; position: absolute; top: 28px; height: 1px; margin-top: -0.5px; background: var(--sk-line,#e2e2e2); }
  .cn-col::before { left: 0; right: 50%; }
  .cn-col::after { left: 50%; right: 0; }
  .cn-col:first-child::before, .cn-col:last-child::after { display: none; }
  /* ノード：白丸（1.5px 罫線色の枠）＋番号（アクセント色）。幹線の上に載る */
  .cn-node {
    position: relative; z-index: 1; width: 56px; height: 56px; border-radius: 50%;
    border: 1.5px solid var(--sk-line,#e2e2e2); background: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 400; line-height: 1; letter-spacing: .04em; color: var(--sk-accent,#555555);
  }
  /* 「今ここ」の1つだけアクセント塗り（白数字）。塗りは1枚に1つ */
  .cn-col-fill .cn-node { background: var(--sk-accent,#555555); border-color: var(--sk-accent,#555555); color: #FFFFFF; }
  /* 最終工程（運用など）は塗らず 1.5px のアクセント枠線＋見出しをアクセント色 */
  .cn-col-last .cn-node { border-color: var(--sk-accent,#555555); }
  .cn-col-last .cn-ttl { color: var(--sk-accent,#555555); }
  /* ノードの下：KICKER → 見出し16px → 説明16px → 例： */
  .cn-kicker { margin-top: 16px; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
  .cn-ttl { margin-top: 8px; font-size: 16px; font-weight: 700; line-height: 1.4; }
  .cn-body { margin-top: 8px; font-size: 16px; line-height: 1.8; }
  .cn-note { margin-top: 4px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：円ノード5つを幹線でつなぐ横フロー（「今ここ」だけ塗り・最後だけアクセント枠線） -->
  <div class="content-area">
    <div class="cn-row">

      <div class="cn-col">
        <div class="cn-node">01</div>
        <div class="cn-kicker">STEP 1</div>
        <div class="cn-ttl">現状の棚卸し</div>
        <div class="cn-body">業務の流れを<br>書き出す</div>
        <div class="cn-note">例：面談2回</div>
      </div>

      <div class="cn-col">
        <div class="cn-node">02</div>
        <div class="cn-kicker">STEP 2</div>
        <div class="cn-ttl">試作</div>
        <div class="cn-body">1業務だけ組み<br>手直しを測る</div>
        <div class="cn-note">例：2週間で1業務</div>
      </div>

      <div class="cn-col cn-col-fill">
        <div class="cn-node">03</div>
        <div class="cn-kicker">STEP 3 ／ 今ここ</div>
        <div class="cn-ttl">確認必須</div>
        <div class="cn-body">公開前に人が<br>全件を見る</div>
        <div class="cn-note">例：目視チェック表</div>
      </div>

      <div class="cn-col">
        <div class="cn-node">04</div>
        <div class="cn-kicker">STEP 4</div>
        <div class="cn-ttl">限定導入</div>
        <div class="cn-body">小さな案件で<br>同じ手順を回す</div>
        <div class="cn-note">例：月2件まで</div>
      </div>

      <div class="cn-col cn-col-last">
        <div class="cn-node">05</div>
        <div class="cn-kicker">STEP 5 ／ 最終</div>
        <div class="cn-ttl">運用</div>
        <div class="cn-body">合意した基準で<br>回し続ける</div>
        <div class="cn-note">例：基準は3項目</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
