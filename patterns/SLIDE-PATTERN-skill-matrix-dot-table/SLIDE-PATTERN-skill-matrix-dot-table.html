<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-skill-matrix-dot-table</title>
<style>
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  /* デザインの規律 v2：文字の組みは .slide に集約（palt・禁則・字間.06em・行間1.8・インク色・太さは400/700のみ） */
  .slide { width:960px; height:540px; background:#FFFFFF; overflow:hidden; position:relative; box-sizing:border-box;
           color:var(--sk-ink,#3f4a52); font-size:16px; font-weight:400; line-height:1.8; letter-spacing:.06em;
           font-feature-settings:"palt" 1; line-break:strict; -webkit-font-smoothing:antialiased; }
  .slide p { margin:0; }
  /* 本文エリア：左右48px・見出しONで上76px・中身は上下中央 */
  .content-area { position:absolute; left:48px; right:48px; top:0; bottom:0; display:flex; align-items:center; }
  html[data-heading="on"] .content-area { top:76px; }

  /* ドット表：罫線は横1px（--sk-line）だけ。縦罫線・面の塗りなし。表＋凡例を上下中央に */
  .sm-block { width:100%; }
  .sm-table { width:100%; border-collapse:collapse; table-layout:fixed; }
  .sm-table th, .sm-table td { border-bottom:1px solid var(--sk-line,#e2e2e2); vertical-align:middle; padding:0 16px; }
  /* ヘッダー行：KICKER英字（10px）＋日本語（16px・700）。1列目は左ぞろえ、担当列は中央ぞろえ */
  .sm-table th { text-align:center; padding-bottom:12px; font-weight:400; }
  .sm-table th.sm-skill { text-align:left; }
  .sm-k { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-accent,#666666); }
  .sm-th { margin-top:6px; font-size:16px; font-weight:700; line-height:1.4; }
  /* 行：行見出し16px/700・高さ52px。ドットは中央 */
  .sm-table td { height:52px; }
  .sm-table td.sm-row { font-size:16px; font-weight:700; line-height:1.4; }
  .sm-table td.sm-cell { text-align:center; }
  /* ドット3段階（CSSのみ）：● アクセント塗り／◐ 左半分だけ塗り／○ 1.5pxの罫線色の枠。ドットは面の塗りに数えない */
  .sm-dot { display:inline-block; width:16px; height:16px; box-sizing:border-box; border-radius:50%; vertical-align:middle; position:relative; overflow:hidden; }
  .sm-full { background:var(--sk-accent,#555555); }
  .sm-half { border:1.5px solid var(--sk-accent,#555555); }
  .sm-half::before { content:""; position:absolute; left:0; top:0; bottom:0; width:50%; background:var(--sk-accent,#555555); }
  .sm-none { border:1.5px solid var(--sk-line,#e2e2e2); }
  /* 凡例：11.5px・muted。ドットは12px */
  .sm-legend { margin-top:12px; font-size:11.5px; line-height:1.8; color:var(--sk-muted,#888888); display:flex; align-items:center; gap:20px; }
  .sm-legend .sm-dot { width:12px; height:12px; margin-right:6px; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：スキル（行）×担当（列）のドット表。ヘッダーはKICKER英字＋日本語、セルは3段階のドット、下に凡例 -->
  <div class="content-area">
    <div class="sm-block">
      <table class="sm-table">
        <thead>
          <tr>
            <th class="sm-skill" style="width:240px;"><div class="sm-k">Skill</div><div class="sm-th">スキル</div></th>
            <th><div class="sm-k">Director</div><div class="sm-th">Aさん</div></th>
            <th><div class="sm-k">Designer</div><div class="sm-th">Bさん</div></th>
            <th><div class="sm-k">Builder</div><div class="sm-th">Cさん</div></th>
            <th><div class="sm-k">Operator</div><div class="sm-th">Dさん</div></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="sm-row">要件の整理</td>
            <td class="sm-cell"><span class="sm-dot sm-full"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-half"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-none"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-half"></span></td>
          </tr>
          <tr>
            <td class="sm-row">ワイヤーフレーム</td>
            <td class="sm-cell"><span class="sm-dot sm-full"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-full"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-half"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-none"></span></td>
          </tr>
          <tr>
            <td class="sm-row">デザイン</td>
            <td class="sm-cell"><span class="sm-dot sm-half"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-full"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-full"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-none"></span></td>
          </tr>
          <tr>
            <td class="sm-row">ノーコード実装</td>
            <td class="sm-cell"><span class="sm-dot sm-none"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-half"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-full"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-full"></span></td>
          </tr>
          <tr>
            <td class="sm-row">公開後の運用</td>
            <td class="sm-cell"><span class="sm-dot sm-half"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-none"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-half"></span></td>
            <td class="sm-cell"><span class="sm-dot sm-full"></span></td>
          </tr>
        </tbody>
      </table>
      <div class="sm-legend">
        <span><span class="sm-dot sm-full"></span>ひとりで担当できる</span>
        <span><span class="sm-dot sm-half"></span>補助があればできる</span>
        <span><span class="sm-dot sm-none"></span>これから習得する</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
