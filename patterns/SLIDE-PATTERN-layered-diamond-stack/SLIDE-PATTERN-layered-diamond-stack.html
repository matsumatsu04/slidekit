<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-layered-diamond-stack</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-size: 16px; font-weight: 400; font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。左右2カラムの組を上下中央・カラム同士は上ぞろえ） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }
  .ds-wrap { display: flex; align-items: flex-start; gap: 48px; }

  .ds-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }

  /* ── 左：説明3ブロック（KICKER → 見出し18px/700 → 本文16px）。横罫線で区切る。地色なし ── */
  .ds-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ds-block { padding: 12px 0; border-bottom: 1px solid var(--sk-line,#e2e2e2); }
  .ds-block:first-child { padding-top: 0; }
  .ds-block:last-of-type { border-bottom: none; }
  .ds-ttl { margin-top: 6px; font-size: 18px; font-weight: 700; line-height: 1.4; }
  .ds-body { margin-top: 4px; font-size: 16px; line-height: 1.8; }
  .ds-note { margin-top: 8px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

  /* ── 右：ステージ 400×352。縦軸（1px細線＋矢じり＋英字KICKER）と5段のダイヤ積層は1枚のSVG。ラベルは右横に絶対配置 ── */
  .ds-stage { position: relative; flex: none; width: 400px; height: 352px; }
  .ds-svg { position: absolute; left: 0; top: 0; width: 400px; height: 352px; display: block; }
  /* 縦軸：x=32。矢じり（SVG三角 12px）の底辺 y=30 から y=332 まで。上下の KICKER との間は 8px */
  .ds-svg .ds-axis { fill: none; stroke: var(--sk-line,#e2e2e2); stroke-width: 1; shape-rendering: crispEdges; }
  .ds-svg .ds-head { fill: var(--sk-line,#e2e2e2); }
  /* ダイヤ：幅192・高さ72・ピッチ56（16px ずつ重ねる）。頂点の1段だけアクセント塗り、残り4段は淡い地に罫線色の枠 */
  .ds-svg .ds-dia { fill: var(--sk-soft,#F0F0F0); stroke: var(--sk-line,#e2e2e2); stroke-width: 1; stroke-linejoin: round; }
  .ds-svg .ds-dia-top { fill: var(--sk-accent,#555555); stroke: var(--sk-accent,#555555); }
  .ds-axis-kicker { position: absolute; left: 0; width: 64px; text-align: center; }
  .ds-axis-top { top: 0; }
  .ds-axis-bottom { top: 342px; }
  /* 段のラベル：各ダイヤの右横（x=288）。高さ36pxのブロックをダイヤの中心に垂直センター。型: KICKER → 名前16px/700 */
  .ds-layer { position: absolute; left: 288px; width: 112px; height: 36px; }
  .ds-layer-1 { top: 46px; }
  .ds-layer-2 { top: 102px; }
  .ds-layer-3 { top: 158px; }
  .ds-layer-4 { top: 214px; }
  .ds-layer-5 { top: 270px; }
  .ds-name { margin-top: 4px; font-size: 16px; font-weight: 700; line-height: 1.4; white-space: nowrap; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左＝説明3ブロック（横罫線区切り）／右＝5段のダイヤ積層＋具体・抽象の縦軸（塗りは頂点の1段だけ） -->
  <div class="content-area">
    <div class="ds-wrap">

      <!-- 左：説明3ブロック -->
      <div class="ds-text">
        <div class="ds-block">
          <div class="ds-kicker">MODEL ／ 前提</div>
          <div class="ds-ttl">上ほど抽象、下ほど具体</div>
          <div class="ds-body">理念から行動までを5つの層でとらえると、いま話しているのがどの層の話かをそろえられる</div>
        </div>
        <div class="ds-block">
          <div class="ds-kicker">RULE ／ 関係</div>
          <div class="ds-ttl">上の層が下の層を決める</div>
          <div class="ds-body">理念が戦略を決め、戦略が方針を決める。下の層の都合で上の層を書き換えない</div>
        </div>
        <div class="ds-block">
          <div class="ds-kicker">USE ／ 使い方</div>
          <div class="ds-ttl">迷ったら一段上に戻る</div>
          <div class="ds-body">施策で迷ったら方針に、方針で迷ったら戦略に戻って判断する</div>
        </div>
        <div class="ds-note">例：会議の冒頭で「今日はどの層の話か」を決めてから始める</div>
      </div>

      <!-- 右：縦軸＋ダイヤ積層（下の段から描き、上の段が下の段の頂点に 16px かぶさる） -->
      <div class="ds-stage">
        <svg class="ds-svg" viewBox="0 0 400 352" aria-hidden="true">
          <!-- 縦軸（x=32）と矢じり（幅12px・上向き） -->
          <path class="ds-axis" d="M32 30V332"/>
          <polygon class="ds-head" points="32,18 26,30 38,30"/>
          <!-- ダイヤ5段（中心 x=176。各段の上端 y=252 / 196 / 140 / 84 / 28） -->
          <polygon class="ds-dia" points="176,252 272,288 176,324 80,288"/>
          <polygon class="ds-dia" points="176,196 272,232 176,268 80,232"/>
          <polygon class="ds-dia" points="176,140 272,176 176,212 80,176"/>
          <polygon class="ds-dia" points="176,84 272,120 176,156 80,120"/>
          <polygon class="ds-dia ds-dia-top" points="176,28 272,64 176,100 80,64"/>
        </svg>
        <div class="ds-kicker ds-axis-kicker ds-axis-top">Abstract</div>
        <div class="ds-kicker ds-axis-kicker ds-axis-bottom">Concrete</div>

        <!-- 段のラベル（各ダイヤの中心 y=64 / 120 / 176 / 232 / 288 に垂直センター） -->
        <div class="ds-layer ds-layer-1"><div class="ds-kicker">Layer 1</div><div class="ds-name">理念</div></div>
        <div class="ds-layer ds-layer-2"><div class="ds-kicker">Layer 2</div><div class="ds-name">戦略</div></div>
        <div class="ds-layer ds-layer-3"><div class="ds-kicker">Layer 3</div><div class="ds-name">方針</div></div>
        <div class="ds-layer ds-layer-4"><div class="ds-kicker">Layer 4</div><div class="ds-name">施策</div></div>
        <div class="ds-layer ds-layer-5"><div class="ds-kicker">Layer 5</div><div class="ds-name">日々の行動</div></div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
