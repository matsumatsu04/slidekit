<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-profile-bio</title>
<style>
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  /* デザインの規律 v2：文字の組みは .slide に集約（palt・禁則・字間.06em・行間1.8・インク色・太さは400/700のみ） */
  .slide { width:960px; height:540px; background:#FFFFFF; overflow:hidden; position:relative; box-sizing:border-box;
           color:var(--sk-ink,#3f4a52); font-size:16px; font-weight:400; line-height:1.8; letter-spacing:.06em;
           font-feature-settings:"palt" 1; line-break:strict; -webkit-font-smoothing:antialiased; }
  .slide p { margin:0; }
  /* 本文エリア：左右48px・見出しONで上76px・中身は上下中央 */
  .content-area { position:absolute; left:48px; right:48px; top:0; bottom:0; display:flex; align-items:center; }
  html[data-heading="on"] .content-area { top:76px; }

  /* 左：写真プレースホルダ（240×300・soft地）＋氏名キャプション。右：氏名24px→肩書→経歴テーブル。両列とも上ぞろえ。塗りは置かない */
  .pb-wrap { width:100%; height:360px; display:flex; gap:40px; align-items:flex-start; }
  .pb-left { width:240px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; }
  /* 写真枠：外部画像を使わず soft 地のプレースホルダ。実装時は <img> を object-fit:cover で差し替える（縦長 4:5） */
  .pb-photo { width:240px; height:300px; background:var(--sk-soft,#F0F0F0); display:flex; align-items:center; justify-content:center; }
  .pb-photo-label { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-muted,#888888); }
  .pb-cap { margin-top:8px; font-size:11.5px; line-height:1.8; color:var(--sk-muted,#888888); text-align:center; }
  .pb-right { flex:1; min-width:0; display:flex; flex-direction:column; }
  .pb-name { font-size:24px; font-weight:700; line-height:1.2; }
  .pb-role { margin-top:8px; font-size:16px; line-height:1.8; color:var(--sk-muted,#888888); }
  /* 経歴テーブル：横罫線のみ（上端と各行の下）。ラベル列は KICKER（英字＋日本語）、値は16px */
  .pb-table { width:100%; margin-top:16px; border-collapse:collapse; border-top:1px solid var(--sk-line,#e2e2e2); }
  .pb-table td { padding:12px 0; border-bottom:1px solid var(--sk-line,#e2e2e2); vertical-align:top; }
  .pb-table td.pb-label { width:120px; padding-right:16px; }
  .pb-kicker { display:block; padding-top:8px; font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; white-space:nowrap; color:var(--sk-accent,#666666); }
  .pb-val { font-size:16px; line-height:1.8; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左＝写真プレースホルダ＋キャプション、右＝氏名・肩書・経歴テーブル（横罫線のみ） -->
  <div class="content-area">
    <div class="pb-wrap">
      <div class="pb-left">
        <div class="pb-photo"><span class="pb-photo-label">Photo ／ 4:5</span></div>
        <div class="pb-cap">山田 太郎（やまだ たろう）</div>
      </div>
      <div class="pb-right">
        <div class="pb-name">山田 太郎</div>
        <div class="pb-role">株式会社〇〇 代表取締役 ／ Web制作講座 講師</div>
        <table class="pb-table">
          <tr>
            <td class="pb-label"><span class="pb-kicker">Origin ／ 出身</span></td>
            <td><div class="pb-val">北海道札幌市。2010年に上京</div></td>
          </tr>
          <tr>
            <td class="pb-label"><span class="pb-kicker">Career ／ 経歴</span></td>
            <td><div class="pb-val">2012年 制作会社にデザイナーとして入社<br>2016年 独立。中小企業のサイトを年20件制作<br>2020年 制作会社を設立し、講座を開講</div></td>
          </tr>
          <tr>
            <td class="pb-label"><span class="pb-kicker">Field ／ 専門</span></td>
            <td><div class="pb-val">ノーコードでのサイト設計と、公開後の運用設計</div></td>
          </tr>
          <tr>
            <td class="pb-label"><span class="pb-kicker">Now ／ 現在</span></td>
            <td><div class="pb-val">年間30件の制作と、受講生60名の講座を運営</div></td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
