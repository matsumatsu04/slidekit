<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-three-col-icon-card-header-band</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  /* デザインの規律 v2：文字の組みは .slide に集約（palt・禁則・字間.06em・行間1.8・インク色・太さは400/700のみ） */
  .slide { width:960px; height:540px; background:#FFFFFF; overflow:hidden; position:relative; box-sizing:border-box;
           color:var(--sk-ink,#3f4a52); font-size:16px; font-weight:400; line-height:1.8; letter-spacing:.06em;
           font-feature-settings:"palt" 1; line-break:strict; -webkit-font-smoothing:antialiased; }
  .slide p { margin:0; }
  /* 本文エリア：左右48px・見出しONで上76px・中身は上下中央 */
  .content-area { position:absolute; left:48px; right:48px; top:0; bottom:0; display:flex; align-items:center; }
  html[data-heading="on"] .content-area { top:76px; }

  /* 3列カード：等高・soft地・gap16・角丸11・上ぞろえ。帯の代わりにカード上辺3pxのアクセント線（面でなく線） */
  .hb-wrap { width:100%; }
  .hb-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; height:304px; }
  .hb-card { min-width:0; border-radius:11px; background:var(--sk-soft,#F0F0F0); overflow:hidden; display:flex; flex-direction:column; }
  .hb-bar { height:3px; background:var(--sk-accent,#666666); flex-shrink:0; }
  .hb-in { flex:1; padding:20px 24px 24px; display:flex; flex-direction:column; align-items:flex-start; }
  /* カードの型：KICKER「01 ／ 英字」→ 見出し18px → 細罫線 → 箇条書き16px（先頭4pxの角ドット）→ CTA */
  .hb-kicker { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-accent,#666666); }
  .hb-h { margin-top:8px; font-size:18px; font-weight:700; line-height:1.4; }
  .hb-line { width:100%; height:1px; background:var(--sk-line,#e2e2e2); margin:12px 0; flex-shrink:0; }
  .hb-list { display:flex; flex-direction:column; gap:4px; }
  .hb-li { position:relative; padding-left:16px; font-size:16px; line-height:1.8; }
  .hb-li::before { content:""; position:absolute; left:0; top:12px; width:4px; height:4px; background:var(--sk-accent,#666666); }
  /* CTA：カード最下部。1枚目だけアクセント塗り・白文字（塗りは1枚に1つ）。他は白地＋1.5pxのアクセント枠 */
  .hb-cta { align-self:stretch; margin-top:auto; padding-top:20px; }
  .hb-btn { display:block; padding:8px 12px; border-radius:6px; border:1.5px solid var(--sk-accent,#666666); background:#FFFFFF; color:var(--sk-accent,#666666);
            font-size:14px; font-weight:700; line-height:1.6; letter-spacing:.08em; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hb-btn-fill { background:var(--sk-accent,#555555); border-color:var(--sk-accent,#555555); color:#FFFFFF; }
  .hb-note { margin-top:12px; font-size:11.5px; line-height:1.8; color:var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：3列カード（上辺3pxのアクセント線・KICKER＋番号・見出し・箇条書き・CTA）。塗りは1枚目のCTAだけ -->
  <div class="content-area">
    <div class="hb-wrap">
      <div class="hb-cards">
        <div class="hb-card">
          <div class="hb-bar"></div>
          <div class="hb-in">
            <div class="hb-kicker">01 ／ Attract</div>
            <div class="hb-h">入口を増やす</div>
            <div class="hb-line"></div>
            <div class="hb-list">
              <div class="hb-li">検索からの流入を増やす</div>
              <div class="hb-li">SNSの発信を型にする</div>
              <div class="hb-li">紹介の導線をつくる</div>
            </div>
            <div class="hb-cta"><span class="hb-btn hb-btn-fill">目標 ／ 問い合わせの増加</span></div>
          </div>
        </div>
        <div class="hb-card">
          <div class="hb-bar"></div>
          <div class="hb-in">
            <div class="hb-kicker">02 ／ Convert</div>
            <div class="hb-h">初回の体験を整える</div>
            <div class="hb-line"></div>
            <div class="hb-list">
              <div class="hb-li">返信までの流れを決める</div>
              <div class="hb-li">初回相談の台本を作る</div>
              <div class="hb-li">見積の書式をそろえる</div>
            </div>
            <div class="hb-cta"><span class="hb-btn">目標 ／ 相談から受注へ</span></div>
          </div>
        </div>
        <div class="hb-card">
          <div class="hb-bar"></div>
          <div class="hb-in">
            <div class="hb-kicker">03 ／ Retain</div>
            <div class="hb-h">また頼まれる仕組み</div>
            <div class="hb-line"></div>
            <div class="hb-list">
              <div class="hb-li">納品後の定例を設ける</div>
              <div class="hb-li">月次の報告を1枚にする</div>
              <div class="hb-li">追加提案の型をつくる</div>
            </div>
            <div class="hb-cta"><span class="hb-btn">目標 ／ 継続と紹介</span></div>
          </div>
        </div>
      </div>
      <div class="hb-note">例：塗りは重点施策の1つだけ。ボタンには各施策の目標を書く</div>
    </div>
  </div>
</div>
</body>
</html>
