<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-axis-labeled-shift-comparison</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-size: 16px; font-weight: 400; font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。パネル列は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 左＝従来（塗りなし）／右＝これから（淡い地）の等幅・等高2パネル＋中央の矢印。中身は上ぞろえ ── */
  .sc-row { display: flex; align-items: stretch; }
  .sc-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 20px 28px; border-radius: 11px; border: 1px solid var(--sk-line,#e2e2e2); }
  .sc-before { background: #FFFFFF; }
  /* 塗りは右の淡い地だけ（濃い塗りは置かない） */
  .sc-after { background: var(--sk-soft,#F0F0F0); }

  /* パネルの型: 軸ラベルKICKER → 見出し18px/700 → 細罫線 → 行×3（項目KICKER → 本文16px×2行） */
  .sc-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
  .sc-ttl { margin-top: 12px; font-size: 18px; font-weight: 700; line-height: 1.4; }
  .sc-rule { margin-top: 12px; height: 1px; background: var(--sk-line,#e2e2e2); }
  /* 行は高さ96px固定（左右で同じ軸が同じ高さに並ぶ）。2行目以降は上に細罫線 */
  .sc-item { height: 96px; padding-top: 16px; }
  .sc-item + .sc-item { border-top: 1px solid var(--sk-line,#e2e2e2); }
  .sc-body { margin-top: 8px; font-size: 16px; line-height: 1.8; }

  /* 中央の矢印: 幅48pxの列。1pxの線＋三角矢印（幅12px・アクセント色）で左パネルの右辺から右パネルの左辺まで */
  .sc-conn { flex: none; width: 48px; display: flex; align-items: center; justify-content: center; }
  .sc-conn svg { width: 48px; height: 16px; display: block; }
  .sc-conn path { fill: none; stroke: var(--sk-line,#e2e2e2); stroke-width: 1; shape-rendering: crispEdges; }
  .sc-conn .sc-arw { fill: var(--sk-accent,#555555); stroke: none; shape-rendering: auto; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：BEFORE（塗りなし）→ AFTER（淡い地）。3つの軸を左右で同じ行に対応させる -->
  <div class="content-area">
    <div class="sc-row">

      <!-- 左：従来（塗りなし） -->
      <div class="sc-panel sc-before">
        <div class="sc-kicker">BEFORE ／ 従来</div>
        <div class="sc-ttl">制作会社に都度依頼する運用</div>
        <div class="sc-rule"></div>
        <div class="sc-item">
          <div class="sc-kicker">SPEED ／ 更新の速さ</div>
          <div class="sc-body">修正のたびに制作会社へ依頼し、反映まで1〜2週間かかる</div>
        </div>
        <div class="sc-item">
          <div class="sc-kicker">COST ／ 費用</div>
          <div class="sc-body">修正1件ごとに見積と請求が発生し、小さな直しほど割高になる</div>
        </div>
        <div class="sc-item">
          <div class="sc-kicker">OWNER ／ 担当</div>
          <div class="sc-body">外注先の担当者1人に頼り、不在のときは更新が止まる</div>
        </div>
      </div>

      <!-- 中央の矢印（左パネルの右辺 → 右パネルの左辺） -->
      <div class="sc-conn">
        <svg viewBox="0 0 48 16" aria-hidden="true">
          <path d="M0 8H36"/>
          <path class="sc-arw" d="M36 0L48 8 36 16Z"/>
        </svg>
      </div>

      <!-- 右：これから（淡い地） -->
      <div class="sc-panel sc-after">
        <div class="sc-kicker">AFTER ／ これから</div>
        <div class="sc-ttl">自社で手順どおりに回す運用</div>
        <div class="sc-rule"></div>
        <div class="sc-item">
          <div class="sc-kicker">SPEED ／ 更新の速さ</div>
          <div class="sc-body">担当者がその日のうちに直し、確認してそのまま公開できる</div>
        </div>
        <div class="sc-item">
          <div class="sc-kicker">COST ／ 費用</div>
          <div class="sc-body">月額の範囲で回数を気にせず直せる</div>
        </div>
        <div class="sc-item">
          <div class="sc-kicker">OWNER ／ 担当</div>
          <div class="sc-body">手順書があり、社内の誰でも同じ手順で回せる</div>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
