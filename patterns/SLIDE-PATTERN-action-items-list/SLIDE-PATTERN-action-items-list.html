<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDE-PATTERN-action-items-list</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
    .slide {
      width: 960px;
      height: 540px;
      background: #FFFFFF;
      border: 1px solid var(--sk-accent,#CCCCCC);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* デザインの規律 v2: 文字の組み */
      color: var(--sk-ink,#3f4a52);
      font-size: 16px;
      font-weight: 400;
      font-feature-settings: "palt" 1;
      line-break: strict;
      letter-spacing: .06em;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }
    /* コンテンツエリア（見出しON時は上76px以降。本文ブロックは上下中央） */
    .content-area { flex:1; padding:24px 48px; display:flex; flex-direction:column; justify-content:center; }
    /* 上段: KICKER（左）＋ 凡例の注記（右）。下に細罫線 */
    .ai-top { display:flex; align-items:baseline; justify-content:space-between; padding:0 16px 12px; border-bottom:1px solid var(--sk-line,#e2e2e2); }
    .ai-kicker { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-accent,#555555); white-space:nowrap; }
    .ai-legend { font-size:11.5px; line-height:1; color:var(--sk-muted,#888888); white-space:nowrap; }
    /* 行: チェック記号 ／ やること（16px・700）／ OWNER ／ DUE。行は細罫線で区切る */
    .ai-list { display:flex; flex-direction:column; }
    .ai-row { display:grid; grid-template-columns:16px 1fr 168px 104px; gap:16px; align-items:center; padding:16px 16px; border-top:1px solid var(--sk-line,#e2e2e2); }
    .ai-row:first-child { border-top:none; }
    /* 「今週」の1行だけ淡い地（塗りは使わない）。上下の罫線は箱の縁に任せる */
    .ai-now { background:var(--sk-soft,#F0F0F0); border-radius:8px; border-top-color:transparent; }
    .ai-now + .ai-row { border-top-color:transparent; }
    /* チェック記号: アクセント色 1.5px 枠の小さな四角 */
    .ai-check { width:14px; height:14px; border:1.5px solid var(--sk-accent,#555555); border-radius:2px; }
    .ai-task { font-size:16px; font-weight:700; line-height:1.5; min-width:0; }
    /* 担当・期限は KICKER 風の小さなラベル（muted） */
    .ai-tag { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-muted,#888888); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* 注記（例：〜） */
    .ai-note { margin-top:12px; padding:0 16px; font-size:11.5px; line-height:1.8; color:var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
  <div class="slide">
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>

    <!-- コンテンツエリア -->
    <div class="content-area">
      <div class="ai-top">
        <div class="ai-kicker">ACTION ITEMS ／ 次回までに</div>
        <div class="ai-legend">淡い地の行＝今週やること</div>
      </div>

      <div class="ai-list">
        <!-- 今週の行（淡い地） -->
        <div class="ai-row ai-now">
          <div class="ai-check"></div>
          <div class="ai-task">要件の最終確認と承認をもらう</div>
          <div class="ai-tag">OWNER ／ 営業担当</div>
          <div class="ai-tag">DUE ／ 6/10</div>
        </div>
        <div class="ai-row">
          <div class="ai-check"></div>
          <div class="ai-task">画面の下書きを3枚つくる</div>
          <div class="ai-tag">OWNER ／ 制作担当</div>
          <div class="ai-tag">DUE ／ 6/12</div>
        </div>
        <div class="ai-row">
          <div class="ai-check"></div>
          <div class="ai-task">接続仕様書の下書きを書く</div>
          <div class="ai-tag">OWNER ／ 開発担当</div>
          <div class="ai-tag">DUE ／ 6/12</div>
        </div>
        <div class="ai-row">
          <div class="ai-check"></div>
          <div class="ai-task">関係者へ進捗を共有する</div>
          <div class="ai-tag">OWNER ／ 営業担当</div>
          <div class="ai-tag">DUE ／ 6/14</div>
        </div>
        <div class="ai-row">
          <div class="ai-check"></div>
          <div class="ai-task">検証環境の準備を確認する</div>
          <div class="ai-tag">OWNER ／ 開発チーム</div>
          <div class="ai-tag">DUE ／ 6/15</div>
        </div>
      </div>

      <div class="ai-note">例：終わった行は □ を ✓ に変え、翌週は淡い地を次の行へ移す</div>
    </div>
  </div>
</body>
</html>
