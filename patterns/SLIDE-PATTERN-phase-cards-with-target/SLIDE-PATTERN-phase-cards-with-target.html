<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-phase-cards-with-target</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。カード列は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── フェーズカード3枚（等幅・等高）＋カード間の三角矢印 ── */
  .ph-row { display: flex; align-items: stretch; gap: 8px; height: 256px; }
  /* カード（淡い地・上ぞろえ）。型: KICKER → 見出し18px → 細罫線 → 本文16px×2行 → 目標行（下端） */
  .ph-card {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    padding: 20px 20px; border-radius: 12px;
    background: var(--sk-soft,#F0F0F0); border: 1px solid var(--sk-line,#e2e2e2);
  }
  /* 中央の1枚だけアクセント塗り（塗りは1枚に1つ） */
  .ph-card-fill { background: var(--sk-accent,#555555); border-color: var(--sk-accent,#555555); color: #FFFFFF; }
  .ph-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
  .ph-card-fill .ph-kicker { color: #FFFFFF; }
  .ph-ttl { margin-top: 12px; font-size: 18px; font-weight: 700; line-height: 1.4; }
  .ph-rule { margin-top: 12px; height: 1px; background: var(--sk-line,#e2e2e2); }
  .ph-card-fill .ph-rule { background: rgba(255,255,255,.35); }
  .ph-body { margin-top: 12px; font-size: 16px; line-height: 1.8; }
  /* 目標行：カード下端に寄せ、細罫線の下に KICKER「TARGET」＋数値16px太字を横並び */
  .ph-target { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--sk-line,#e2e2e2); display: flex; align-items: baseline; gap: 12px; }
  .ph-card-fill .ph-target { border-top-color: rgba(255,255,255,.35); }
  .ph-target-val { font-size: 16px; font-weight: 700; line-height: 1.4; }
  /* 三角矢印（SVG・幅12px） */
  .ph-arw { flex: none; align-self: center; display: block; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：フェーズカード3枚（中央だけ塗り）を三角矢印でつなぎ、各カード下端に目標行 -->
  <div class="content-area">
    <div class="ph-row">

      <div class="ph-card">
        <div class="ph-kicker">PHASE 1 ／ 1〜2ヶ月目</div>
        <div class="ph-ttl">1業務を組む</div>
        <div class="ph-rule"></div>
        <div class="ph-body">手直しの量を測り、<br>通った手順だけ残す。</div>
        <div class="ph-target"><span class="ph-kicker">TARGET</span><span class="ph-target-val">手直し1回以内</span></div>
      </div>

      <svg class="ph-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="var(--sk-accent,#555555)"/></svg>

      <div class="ph-card ph-card-fill">
        <div class="ph-kicker">PHASE 2 ／ 3〜4ヶ月目</div>
        <div class="ph-ttl">対象を広げる</div>
        <div class="ph-rule"></div>
        <div class="ph-body">同じ型で3業務に広げ、<br>担当者に手順を渡す。</div>
        <div class="ph-target"><span class="ph-kicker">TARGET</span><span class="ph-target-val">3業務を自走</span></div>
      </div>

      <svg class="ph-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="var(--sk-accent,#555555)"/></svg>

      <div class="ph-card">
        <div class="ph-kicker">PHASE 3 ／ 5〜6ヶ月目</div>
        <div class="ph-ttl">見直しを回す</div>
        <div class="ph-rule"></div>
        <div class="ph-body">月1回の見直しで<br>対象と基準を更新する。</div>
        <div class="ph-target"><span class="ph-kicker">TARGET</span><span class="ph-target-val">月次30分で運用</span></div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
