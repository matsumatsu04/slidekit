<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-grouped-pill-badge-cluster</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-size: 16px; font-weight: 400; font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。グループの束は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── グループ（縦積み・3つ）。左に KICKER（幅120px）→ 右にピルを折り返し。グループ間は細罫線 ── */
  .pg-group { display: flex; align-items: flex-start; padding: 20px 0; }
  .pg-group:first-child { padding-top: 0; }
  .pg-group:last-child { padding-bottom: 0; }
  .pg-group + .pg-group { border-top: 1px solid var(--sk-line,#e2e2e2); }
  /* KICKER はピル1行目の縦中央に合わせる（ピル高さ32px → 上11px） */
  .pg-kicker { flex: none; width: 120px; padding-top: 11px; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
  .pg-pills { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  /* ピル: 14px・1.5px の罫線色の枠・角丸999px・padding 4px 14px */
  .pg-pill { padding: 4px 14px; border: 1.5px solid var(--sk-line,#e2e2e2); border-radius: 999px; font-size: 14px; line-height: 1.5; white-space: nowrap; }
  /* 主役の1つだけアクセント塗り・白文字（塗りは1枚に1つ） */
  .pg-pill-fill { background: var(--sk-accent,#555555); border-color: var(--sk-accent,#555555); color: #FFFFFF; }
  /* 注記（例：〜）。グループの束の下に1行 */
  .pg-note { margin-top: 16px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：グループ別ピル（3グループ縦積み・左KICKER・右に折り返し）。塗りは全体で1つ -->
  <div class="content-area">

    <!-- グループ1（8個・2行に折り返す） -->
    <div class="pg-group">
      <div class="pg-kicker">DESIGN ／ 設計</div>
      <div class="pg-pills">
        <div class="pg-pill">情報設計</div>
        <div class="pg-pill pg-pill-fill">ワイヤーフレーム</div>
        <div class="pg-pill">デザインカンプ</div>
        <div class="pg-pill">配色・書体</div>
        <div class="pg-pill">UIパーツ</div>
        <div class="pg-pill">画像・図版</div>
        <div class="pg-pill">アイコン</div>
        <div class="pg-pill">写真の選定</div>
      </div>
    </div>

    <!-- グループ2（5個） -->
    <div class="pg-group">
      <div class="pg-kicker">BUILD ／ 実装</div>
      <div class="pg-pills">
        <div class="pg-pill">ノーコード実装</div>
        <div class="pg-pill">レスポンシブ対応</div>
        <div class="pg-pill">フォーム設定</div>
        <div class="pg-pill">アニメーション</div>
        <div class="pg-pill">SEOの基本設定</div>
      </div>
    </div>

    <!-- グループ3（4個） -->
    <div class="pg-group">
      <div class="pg-kicker">OPERATE ／ 運用</div>
      <div class="pg-pills">
        <div class="pg-pill">更新の手順書</div>
        <div class="pg-pill">月次レポート</div>
        <div class="pg-pill">改善の提案</div>
        <div class="pg-pill">問い合わせ対応</div>
      </div>
    </div>

    <div class="pg-note">例：色のついた項目が今回の範囲。ほかは追加で相談する</div>
  </div>
</div>
</body>
</html>
