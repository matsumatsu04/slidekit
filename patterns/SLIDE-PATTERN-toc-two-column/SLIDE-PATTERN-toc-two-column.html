<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-toc-two-column</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide { width:960px; height:540px; background:#FFFFFF; border:1px solid var(--sk-accent,#CCCCCC); overflow:hidden; display:flex; flex-direction:column;
           color:var(--sk-ink,#3f4a52); font-weight:400; font-feature-settings:"palt" 1; line-break:strict; letter-spacing:.06em; line-height:1.8; }
  /* v2（2026-09-02）: 左に contents ラベル、右に 番号｜細い縦罫線｜項目名。上下中央。
     共通部品は使えないので、同じ数値を tt- 接頭辞で持つ */
  .tt-area  { flex:1; position:relative; }
  .tt-label { position:absolute; left:72px; top:0; bottom:0; display:flex; align-items:center;
              font-size:15px; font-weight:700; letter-spacing:.3em; color:var(--sk-accent,#666666); line-height:1; }
  .tt-list  { position:absolute; left:476px; right:48px; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center; gap:32px; }
  .tt-item  { display:flex; align-items:center; height:28px; }
  .tt-no    { width:48px; flex-shrink:0; font-size:24px; font-weight:700; letter-spacing:.04em; color:var(--sk-accent,#666666); line-height:1; }
  .tt-vline { width:1px; height:22px; flex-shrink:0; background:var(--sk-line,#e2e2e2); margin:0 20px 0 12px; }
  .tt-txt   { font-size:16px; font-weight:400; letter-spacing:.2em; line-height:1; white-space:nowrap; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:26px;width:4px;height:28px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}
</style>
</head>
<body>
<div class="slide">
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <div class="tt-area">
    <div class="tt-label">contents</div>
    <div class="tt-list">
      <div class="tt-item"><span class="tt-no">01</span><span class="tt-vline"></span><span class="tt-txt">人が全部つくる制作で詰まりやすい工程</span></div>
      <div class="tt-item"><span class="tt-no">02</span><span class="tt-vline"></span><span class="tt-txt">AIに任せる工程と、人が決める工程</span></div>
      <div class="tt-item"><span class="tt-no">03</span><span class="tt-vline"></span><span class="tt-txt">試作から段階的に現場へ入れる手順</span></div>
    </div>
  </div>
</div>
</body>
</html>
