<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDE-PATTERN: cover-art-brush-left</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
    .slide { width:960px; height:540px; border:1px solid #CCCCCC; overflow:hidden; position:relative; font-weight:400; }
    /* 背景は画像アセット（表紙の画像背景系だけに認められた例外）。色ティントの対象外 */
    .ab-bg     { position:absolute; inset:0; background:url('/assets/covers/cover-bg-handdrawn-art.jpg') center/cover no-repeat; }
    /* v2（2026-09-04）: 絵柄が薄い左側に、KICKER → タイトル2行 → 64pxの区切り線 → 補足1行 を縦に組み、上下中央にそろえる。
       画材モチーフが中央寄りまで来るので、文字ブロックの幅は5種のなかで最も狭い340px */
    .ab-text   { position:absolute; left:80px; top:50%; transform:translateY(-50%); width:340px; }
    .ab-kicker { font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; line-height:1; color:var(--sk-ink,#3f4a52); }
    .ab-title  { margin-top:20px; font-size:40px; font-weight:700; letter-spacing:.06em; line-height:1.35; color:#1A1A1A; }
    .ab-rule   { margin-top:28px; width:64px; height:1px; background:#AAAAAA; }
    .ab-meta   { margin-top:24px; font-size:16px; font-weight:400; letter-spacing:.06em; line-height:1; color:#555555; }

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
  <div class="slide">
    <div class="ab-bg"></div>
    <div class="ab-text">
      <div class="ab-kicker">Creative Works ／ 制作事例</div>
      <h1 class="ab-title">デザイン制作の<br>事例と進め方</h1>
      <div class="ab-rule"></div>
      <div class="ab-meta">Macminol ／ 2026.04</div>
    </div>
  </div>
</body>
</html>
