<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-estimate-formula-sum</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide { width:960px; height:540px; background:#FFFFFF; border:1px solid var(--sk-accent,#CCCCCC); overflow:hidden; display:flex; flex-direction:column; }
  .content-area { flex:1; display:flex; flex-direction:column; justify-content:center; gap:20px; padding:32px 64px; }

  /* 上段: 足し算の式（項目カード＋演算子＋合計カード） */
  .formula { display:flex; align-items:center; gap:10px; }
  .fs-card { flex:1; height:176px; background:#FFFFFF; border:1px solid var(--sk-soft,#DDDDDD); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:12px; }
  .fs-label { font-size:11px; font-weight:bold; color:#333333; padding-bottom:6px; border-bottom:2px solid var(--sk-accent,#888888); }
  .fs-unit { font-size:9px; color:#888888; }
  .fs-amount { font-size:20px; font-weight:bold; color:#333333; line-height:1; }
  .fs-amount .yen { font-size:11px; font-weight:bold; margin-left:2px; }
  .fs-inc { font-size:8.5px; color:#888888; }
  .fs-op { flex-shrink:0; width:32px; height:32px; border-radius:50%; background:var(--sk-accent,#555555); color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:bold; }
  .fs-total { flex:1.25; height:176px; background:var(--sk-accent,#555555); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:12px; }
  .fs-total-label { font-size:11px; font-weight:bold; color:#FFFFFF; letter-spacing:.12em; }
  .fs-total-amount { font-size:28px; font-weight:bold; color:#FFFFFF; line-height:1; }
  .fs-total-amount .yen { font-size:14px; font-weight:bold; margin-left:2px; }
  .fs-total-note { font-size:8.5px; color:rgba(255,255,255,.8); }

  /* 中段: 注記 */
  .notes { display:flex; flex-direction:column; gap:4px; }
  .note-line { font-size:9.5px; color:#888888; }

  /* 下段: ご利用イメージ帯（規模別シミュレーション） */
  .sim-band { background:var(--sk-soft,#F2F2F2); border-radius:12px; padding:14px 24px; display:flex; flex-direction:column; gap:10px; }
  .sim-head { font-size:10px; font-weight:bold; color:#666666; letter-spacing:.08em; }
  .sim-row { display:flex; }
  .sim-cell { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .sim-cell + .sim-cell { border-left:1px solid #DDDDDD; }
  .sim-cond { font-size:9.5px; color:#888888; }
  .sim-total { font-size:15px; font-weight:bold; color:var(--sk-accent,#333333); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:26px;width:4px;height:28px;border-radius:2px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}
</style>
</head>
<body>
<div class="slide">
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <div class="content-area">

    <!-- 上段: 足し算の式 -->
    <div class="formula">
      <div class="fs-card">
        <div class="fs-label">項目名が入ります</div>
        <div class="fs-unit">一式</div>
        <div class="fs-amount">000,000<span class="yen">円</span></div>
        <div class="fs-inc">含まれる内容が入ります</div>
      </div>
      <div class="fs-op">+</div>
      <div class="fs-card">
        <div class="fs-label">項目名が入ります</div>
        <div class="fs-unit">一式</div>
        <div class="fs-amount">000,000<span class="yen">円</span></div>
        <div class="fs-inc">含まれる内容が入ります</div>
      </div>
      <div class="fs-op">+</div>
      <div class="fs-card">
        <div class="fs-label">項目名が入ります</div>
        <div class="fs-unit">月額</div>
        <div class="fs-amount">000,000<span class="yen">円</span></div>
        <div class="fs-inc">含まれる内容が入ります</div>
      </div>
      <div class="fs-op">=</div>
      <div class="fs-total">
        <div class="fs-total-label">合計</div>
        <div class="fs-total-amount">000,000<span class="yen">円</span></div>
        <div class="fs-total-note">税注記が入ります</div>
      </div>
    </div>

    <!-- 中段: 注記 -->
    <div class="notes">
      <div class="note-line">※ 注記が入ります（お支払い条件・有効期限など）</div>
      <div class="note-line">※ 注記が入ります（別途費用・前提条件など）</div>
    </div>

    <!-- 下段: ご利用イメージ帯 -->
    <div class="sim-band">
      <div class="sim-head">ご利用イメージ</div>
      <div class="sim-row">
        <div class="sim-cell">
          <div class="sim-cond">条件Aの場合が入ります</div>
          <div class="sim-total">000,000円</div>
        </div>
        <div class="sim-cell">
          <div class="sim-cond">条件Bの場合が入ります</div>
          <div class="sim-total">000,000円</div>
        </div>
        <div class="sim-cell">
          <div class="sim-cond">条件Cの場合が入ります</div>
          <div class="sim-total">000,000円</div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
