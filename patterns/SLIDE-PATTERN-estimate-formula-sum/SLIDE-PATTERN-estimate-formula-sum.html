<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-estimate-formula-sum</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-size: 16px; font-weight: 400; font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。式の行＋規模別シミュレーションを上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  .ef-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }

  /* ── 上段：内訳カード3枚 ＋ ＋ ＋ ＝ 合計カード。等高（168px）・上ぞろえ。幅 168×3 + 40×3 + 240 = 864 ── */
  .ef-row { display: flex; align-items: stretch; height: 168px; }
  /* 内訳カード：1.5px の罫線枠・角丸10px。型: KICKER → 項目名16px/700 → （細罫線）→ 金額20px/700 → 例： */
  .ef-card { flex: none; width: 168px; display: flex; flex-direction: column; padding: 20px; border: 1.5px solid var(--sk-line,#e2e2e2); border-radius: 10px; }
  .ef-name { margin-top: 8px; font-size: 16px; font-weight: 700; line-height: 1.4; white-space: nowrap; }
  .ef-rule { margin-top: auto; height: 1px; background: var(--sk-line,#e2e2e2); }
  .ef-amount { margin-top: 12px; font-size: 20px; font-weight: 700; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ef-note { margin-top: 6px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); white-space: nowrap; }
  /* 演算子：＋／＝（24px・muted のテキスト。図形にしない） */
  .ef-op { flex: none; width: 40px; display: flex; align-items: center; justify-content: center; font-size: 24px; line-height: 1; color: var(--sk-muted,#888888); }
  /* 合計カード：アクセント塗り・白文字・金額28px。1枚で塗るのはここだけ */
  .ef-total { flex: none; width: 240px; display: flex; flex-direction: column; padding: 20px 24px; border-radius: 10px; background: var(--sk-accent,#555555); color: #FFFFFF; }
  .ef-total .ef-kicker { color: #FFFFFF; }
  .ef-total .ef-rule { background: rgba(255,255,255,.35); }
  .ef-total .ef-amount { font-size: 28px; }
  .ef-total .ef-note { color: #FFFFFF; opacity: .85; }

  /* ── 下段：規模別シミュレーション（3列・横罫線のみ・縦線なし）── */
  .ef-sim { margin-top: 24px; }
  .ef-sim-row { margin-top: 8px; display: flex; border-top: 1px solid var(--sk-line,#e2e2e2); border-bottom: 1px solid var(--sk-line,#e2e2e2); }
  .ef-sim-col { flex: 1; min-width: 0; padding: 12px 16px 12px 0; }
  .ef-sim-ttl { font-size: 16px; font-weight: 700; line-height: 1.4; white-space: nowrap; }
  .ef-sim-amount { margin-top: 2px; font-size: 16px; line-height: 1.8; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ef-sim-note { font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); white-space: nowrap; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：上段＝内訳カード3枚 ＋ ＝ 合計カード（唯一の塗り）／下段＝規模別シミュレーション（横罫線のみ） -->
  <div class="content-area">

    <!-- 上段：足し算の式 -->
    <div class="ef-row">
      <div class="ef-card">
        <div class="ef-kicker">DESIGN ／ 一式</div>
        <div class="ef-name">デザイン</div>
        <div class="ef-rule"></div>
        <div class="ef-amount">¥300,000</div>
        <div class="ef-note">例：TOP＋下層4ページ</div>
      </div>
      <div class="ef-op">＋</div>
      <div class="ef-card">
        <div class="ef-kicker">BUILD ／ 一式</div>
        <div class="ef-name">実装</div>
        <div class="ef-rule"></div>
        <div class="ef-amount">¥360,000</div>
        <div class="ef-note">例：スマホ対応・フォーム</div>
      </div>
      <div class="ef-op">＋</div>
      <div class="ef-card">
        <div class="ef-kicker">DIRECTION ／ 一式</div>
        <div class="ef-name">進行管理</div>
        <div class="ef-rule"></div>
        <div class="ef-amount">¥80,000</div>
        <div class="ef-note">例：公開前の確認まで</div>
      </div>
      <div class="ef-op">＝</div>
      <div class="ef-total">
        <div class="ef-kicker">TOTAL ／ 合計</div>
        <div class="ef-name">初期費用（税別）</div>
        <div class="ef-rule"></div>
        <div class="ef-amount">¥740,000</div>
        <div class="ef-note">例：着手時50%・納品時50%</div>
      </div>
    </div>

    <!-- 下段：規模別シミュレーション -->
    <div class="ef-sim">
      <div class="ef-kicker">SIMULATION ／ 規模別の目安</div>
      <div class="ef-sim-row">
        <div class="ef-sim-col">
          <div class="ef-sim-ttl">5ページ・撮影なし</div>
          <div class="ef-sim-amount">¥740,000</div>
          <div class="ef-sim-note">例：会社案内サイト</div>
        </div>
        <div class="ef-sim-col">
          <div class="ef-sim-ttl">10ページ・撮影あり</div>
          <div class="ef-sim-amount">¥1,020,000</div>
          <div class="ef-sim-note">例：採用ページ付きのサイト</div>
        </div>
        <div class="ef-sim-col">
          <div class="ef-sim-ttl">15ページ・英語版あり</div>
          <div class="ef-sim-amount">¥1,400,000</div>
          <div class="ef-sim-note">例：海外取引先向けの2言語サイト</div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
