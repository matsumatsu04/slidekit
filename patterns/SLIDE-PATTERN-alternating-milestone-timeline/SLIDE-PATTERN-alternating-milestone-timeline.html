<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-alternating-milestone-timeline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide { width:960px; height:540px; background:#FFFFFF; border:1px solid var(--sk-accent,#CCCCCC); overflow:hidden; display:flex; flex-direction:column; }
  .content-area { flex:1; display:flex; align-items:center; padding:0 48px; }

  .tl { position:relative; width:100%; height:384px; }
  /* 幹線は最初と最後のドット中心まで */
  .tl-line { position:absolute; top:50%; margin-top:-1px; height:2px; left:5%; right:5%; background:#CCCCCC; }
  .tl-dot { position:absolute; top:50%; width:12px; height:12px; border-radius:50%; background:var(--sk-accent,#888888); border:2px solid #FFFFFF; transform:translate(-50%,-50%); z-index:2; }
  .tl-stem { position:absolute; width:2px; margin-left:-1px; background:#CCCCCC; }
  .stem-up { bottom:50%; }
  .stem-dn { top:50%; }
  .blk { position:absolute; width:104px; transform:translateX(-50%); text-align:center; display:flex; flex-direction:column; gap:2px; }
  .blk-up { flex-direction:column-reverse; }
  .yr { font-size:12px; font-weight:bold; color:#333333; line-height:1.3; }
  .ev { font-size:9px; color:#888888; line-height:1.5; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <div class="content-area">
    <div class="tl">
      <div class="tl-line"></div>

      <div class="tl-stem stem-up" style="left:5%;  height:56px;"></div>
      <div class="tl-stem stem-dn" style="left:15%; height:72px;"></div>
      <div class="tl-stem stem-up" style="left:25%; height:88px;"></div>
      <div class="tl-stem stem-dn" style="left:35%; height:44px;"></div>
      <div class="tl-stem stem-up" style="left:45%; height:56px;"></div>
      <div class="tl-stem stem-dn" style="left:55%; height:72px;"></div>
      <div class="tl-stem stem-up" style="left:65%; height:88px;"></div>
      <div class="tl-stem stem-dn" style="left:75%; height:44px;"></div>
      <div class="tl-stem stem-up" style="left:85%; height:56px;"></div>
      <div class="tl-stem stem-dn" style="left:95%; height:72px;"></div>

      <div class="blk blk-up" style="left:5%;  bottom:calc(50% + 56px);"><div class="yr">2015</div><div class="ev">出来事の説明が入ります</div></div>
      <div class="blk"        style="left:15%; top:calc(50% + 72px);"><div class="yr">2016</div><div class="ev">出来事の説明が2行で入ります</div></div>
      <div class="blk blk-up" style="left:25%; bottom:calc(50% + 88px);"><div class="yr">2017</div><div class="ev">出来事の説明が入ります</div></div>
      <div class="blk"        style="left:35%; top:calc(50% + 44px);"><div class="yr">2018</div><div class="ev">出来事の説明が入ります</div></div>
      <div class="blk blk-up" style="left:45%; bottom:calc(50% + 56px);"><div class="yr">2019</div><div class="ev">出来事の説明が2行で入ります</div></div>
      <div class="blk"        style="left:55%; top:calc(50% + 72px);"><div class="yr">2020</div><div class="ev">出来事の説明が入ります</div></div>
      <div class="blk blk-up" style="left:65%; bottom:calc(50% + 88px);"><div class="yr">2021</div><div class="ev">出来事の説明が入ります</div></div>
      <div class="blk"        style="left:75%; top:calc(50% + 44px);"><div class="yr">2022</div><div class="ev">出来事の説明が2行で入ります</div></div>
      <div class="blk blk-up" style="left:85%; bottom:calc(50% + 56px);"><div class="yr">2023</div><div class="ev">出来事の説明が入ります</div></div>
      <div class="blk"        style="left:95%; top:calc(50% + 72px);"><div class="yr">2024</div><div class="ev">出来事の説明が入ります</div></div>

      <div class="tl-dot" style="left:5%;"></div>
      <div class="tl-dot" style="left:15%;"></div>
      <div class="tl-dot" style="left:25%;"></div>
      <div class="tl-dot" style="left:35%;"></div>
      <div class="tl-dot" style="left:45%;"></div>
      <div class="tl-dot" style="left:55%;"></div>
      <div class="tl-dot" style="left:65%;"></div>
      <div class="tl-dot" style="left:75%;"></div>
      <div class="tl-dot" style="left:85%;"></div>
      <div class="tl-dot" style="left:95%;"></div>
    </div>
  </div>
</div>
</body>
</html>
