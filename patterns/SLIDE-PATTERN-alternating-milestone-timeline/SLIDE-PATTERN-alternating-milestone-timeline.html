<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-alternating-milestone-timeline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。タイムライン一式は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── タイムライン：高さ固定（288px）。幹線の高さは中央（144px） ── */
  .am-tl { position: relative; width: 100%; height: 288px; }
  /* 幹線＋ステムは1枚のSVGで引く（端点＝最初と最後のノードの中心。文言の長さで動かない） */
  .am-lines { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .am-lines line { stroke: var(--sk-line,#e2e2e2); stroke-width: 1; shape-rendering: crispEdges; }
  /* ノード：12pxの白丸・1.5px 罫線色の枠。幹線の上に載る（中心を幹線に合わせる） */
  .am-node { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
             background: #FFFFFF; border: 1.5px solid var(--sk-line,#e2e2e2); z-index: 1; }
  /* 最新（今ここ）のノードだけアクセント塗り。塗りは1枚に1つ */
  .am-node-now { background: var(--sk-accent,#555555); border-color: var(--sk-accent,#555555); }
  /* テキストブロック：ノードの上か下（交互）。KICKER（日付）→ 見出し16px太字 → 説明14px muted */
  .am-item { position: absolute; width: 168px; margin-left: -84px; text-align: center; }
  .am-item-up { bottom: calc(50% + 32px); }
  .am-item-dn { top: calc(50% + 32px); }
  .am-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-muted,#888888); white-space: nowrap; }
  .am-item-now .am-kicker { color: var(--sk-accent,#555555); }
  .am-ttl { margin-top: 8px; font-size: 16px; font-weight: 700; line-height: 1.4; }
  .am-body { margin-top: 4px; font-size: 14px; line-height: 1.8; color: var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：横の幹線（1px）＋ノード5つ。テキストは上下交互。塗りは「今ここ」のノード1つだけ -->
  <div class="content-area">
    <div class="am-tl">

      <!-- 幹線（10%→90%）とステム（各ノードから上下へ28px）。ノードの位置と同じ % で引く -->
      <svg class="am-lines" aria-hidden="true">
        <line x1="10%" y1="144" x2="90%" y2="144"/>
        <line x1="10%" y1="144" x2="10%" y2="116"/>
        <line x1="30%" y1="144" x2="30%" y2="172"/>
        <line x1="50%" y1="144" x2="50%" y2="116"/>
        <line x1="70%" y1="144" x2="70%" y2="172"/>
        <line x1="90%" y1="144" x2="90%" y2="116"/>
      </svg>

      <div class="am-node" style="left:10%;"></div>
      <div class="am-node" style="left:30%;"></div>
      <div class="am-node" style="left:50%;"></div>
      <div class="am-node am-node-now" style="left:70%;"></div>
      <div class="am-node" style="left:90%;"></div>

      <div class="am-item am-item-up" style="left:10%;">
        <div class="am-kicker">2026.04</div>
        <div class="am-ttl">キックオフ</div>
        <div class="am-body">体制と進め方を決める</div>
      </div>
      <div class="am-item am-item-dn" style="left:30%;">
        <div class="am-kicker">2026.06</div>
        <div class="am-ttl">要件確定</div>
        <div class="am-body">対象業務を3つに絞る</div>
      </div>
      <div class="am-item am-item-up" style="left:50%;">
        <div class="am-kicker">2026.08</div>
        <div class="am-ttl">試作の完成</div>
        <div class="am-body">現場で1週間試す</div>
      </div>
      <div class="am-item am-item-dn am-item-now" style="left:70%;">
        <div class="am-kicker">2026.10 ／ 今ここ</div>
        <div class="am-ttl">本番導入</div>
        <div class="am-body">全社に展開する</div>
      </div>
      <div class="am-item am-item-up" style="left:90%;">
        <div class="am-kicker">2027.01</div>
        <div class="am-ttl">効果測定</div>
        <div class="am-body">工数の変化を見る</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
