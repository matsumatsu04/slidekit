<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-goal-kgi-kpi-dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。目標ブロック＋カード列の束を上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }

  /* 英字ラベル（KICKER）。塗りカードの中は白 */
  .gk-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }

  /* ── 上段：目標（KICKER → 大見出し22px → 1行説明）。塗りなし ── */
  .gk-goal-ttl { margin-top: 12px; font-size: 22px; font-weight: 700; line-height: 1.4; }
  .gk-goal-desc { margin-top: 8px; font-size: 16px; line-height: 1.8; }

  /* ── 下段：KGI 1枚（塗り）＋ KPI 3枚（淡い地）。等高・上ぞろえ ── */
  .gk-row { display: flex; gap: 16px; align-items: stretch; }
  .gk-card { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 24px 20px; border-radius: 12px;
             background: var(--sk-soft,#F0F0F0); border: 1px solid var(--sk-line,#e2e2e2); }
  /* KGI だけアクセント塗り（塗りは1枚に1つ） */
  .gk-kgi { flex: none; width: 240px; background: var(--sk-accent,#555555); border-color: var(--sk-accent,#555555); color: #FFFFFF; }
  .gk-kgi .gk-kicker { color: #FFFFFF; }

  /* 数字は大きく、単位は小さく（14px） */
  .gk-num-row { margin-top: 16px; display: flex; align-items: baseline; gap: 4px; }
  .gk-num { font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: .02em; color: var(--sk-accent,#555555); }
  .gk-kgi .gk-num { font-size: 32px; color: #FFFFFF; }
  .gk-unit { font-size: 14px; font-weight: 400; line-height: 1; }
  .gk-rule { margin-top: 16px; height: 1px; background: var(--sk-line,#e2e2e2); }
  .gk-kgi .gk-rule { background: rgba(255,255,255,.35); }
  .gk-desc { margin-top: 12px; font-size: 16px; line-height: 1.8; }
  .gk-note { margin-top: auto; padding-top: 8px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }
  .gk-kgi .gk-note { color: #FFFFFF; opacity: .85; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：上＝目標（GOAL）／下＝KGI 1枚（塗り）＋ KPI 3枚（淡い地） -->
  <div class="content-area">

    <!-- 上段：目標 -->
    <div class="gk-goal">
      <div class="gk-kicker">GOAL ／ 今期の目標</div>
      <div class="gk-goal-ttl">紹介に頼らず、毎月の新規受注を安定させる</div>
      <div class="gk-goal-desc">問い合わせから受注までの各段階に数値目標を置き、月1回の会議で見直す。</div>
    </div>

    <!-- 下段：KGI 1枚 ＋ KPI 3枚 -->
    <div class="gk-row">

      <!-- KGI（塗り） -->
      <div class="gk-card gk-kgi">
        <div class="gk-kicker">KGI ／ 年間売上</div>
        <div class="gk-num-row"><span class="gk-num">1.2</span><span class="gk-unit">億円</span></div>
        <div class="gk-rule"></div>
        <div class="gk-desc">今期末までの売上目標</div>
        <div class="gk-note">例：前年は0.9億円</div>
      </div>

      <!-- KPI 1 -->
      <div class="gk-card">
        <div class="gk-kicker">KPI 1 ／ 集客</div>
        <div class="gk-num-row"><span class="gk-num">30</span><span class="gk-unit">件／月</span></div>
        <div class="gk-rule"></div>
        <div class="gk-desc">月の問い合わせ数</div>
        <div class="gk-note">例：現状は12件</div>
      </div>

      <!-- KPI 2 -->
      <div class="gk-card">
        <div class="gk-kicker">KPI 2 ／ 提案</div>
        <div class="gk-num-row"><span class="gk-num">60</span><span class="gk-unit">%</span></div>
        <div class="gk-rule"></div>
        <div class="gk-desc">提案まで進む割合</div>
        <div class="gk-note">例：現状は40%</div>
      </div>

      <!-- KPI 3 -->
      <div class="gk-card">
        <div class="gk-kicker">KPI 3 ／ 受注</div>
        <div class="gk-num-row"><span class="gk-num">5</span><span class="gk-unit">件／月</span></div>
        <div class="gk-rule"></div>
        <div class="gk-desc">月の新規受注数</div>
        <div class="gk-note">例：現状は2件</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
