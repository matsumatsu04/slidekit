<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDE-PATTERN-three-stage-circle-flow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }

    /* スライド本体 960×540px */
    .slide {
      width: 960px;
      height: 540px;
      background: #FFFFFF;
      border: 1px solid var(--sk-accent,#CCCCCC);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* デザインの規律 v2: 文字の組み */
      color: var(--sk-ink,#3f4a52);
      font-feature-settings: "palt" 1;
      line-break: strict;
      letter-spacing: .06em;
      line-height: 1.8;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    /* コンテンツエリア（見出しON時は上76px以降。ステージ列は上下中央） */
    .content-area {
      flex: 1;
      padding: 24px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ── ステージ列（3枚等幅・等高。カードの間は三角矢印） ── */
    .tc-row { display: flex; align-items: stretch; gap: 8px; height: 280px; }

    /* ステージカード。既定は淡い地 */
    .tc-card {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 20px 20px;
      border-radius: 12px;
      background: var(--sk-soft,#F0F0F0);
      border: 1px solid var(--sk-line,#e2e2e2);
    }
    /* 中央の1枚だけアクセント塗り（塗りは1枚に1つ） */
    .tc-card-fill { background: var(--sk-accent,#555555); border-color: var(--sk-accent,#555555); color: #FFFFFF; }
    /* 最終工程が「結果」（公開・運用）のときの任意形: 塗らず 1.5px のアクセント枠線 */
    .tc-card-last { background: #FFFFFF; border: 1.5px solid var(--sk-accent,#555555); }

    /* カードの型: KICKER → 見出し → 細罫線 → 本文2行 → 例： */
    .tc-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
    .tc-card-fill .tc-kicker { color: #FFFFFF; }
    .tc-ttl { margin-top: 12px; font-size: 18px; font-weight: 700; line-height: 1.4; }
    .tc-card-last .tc-ttl { color: var(--sk-accent,#555555); }
    .tc-rule { margin-top: 12px; height: 1px; background: var(--sk-line,#e2e2e2); }
    .tc-card-fill .tc-rule { background: rgba(255,255,255,.35); }
    .tc-body { margin-top: 12px; font-size: 16px; line-height: 1.8; }
    .tc-note { margin-top: auto; padding-top: 12px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }
    .tc-card-fill .tc-note { color: #FFFFFF; opacity: .85; }

    /* 三角矢印（SVG・幅12px） */
    .tc-arw { flex: none; align-self: center; display: block; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>

  <div class="slide">
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>

    <!-- コンテンツエリア：3ステージのカードを三角矢印でつなぐ（中央＝主役の塗り） -->
    <div class="content-area">
      <div class="tc-row">

        <!-- ステージ1 -->
        <div class="tc-card">
          <div class="tc-kicker">STEP 1 ／ 現状把握</div>
          <div class="tc-ttl">聞き取りと棚卸し</div>
          <div class="tc-rule"></div>
          <div class="tc-body">業務の流れを聞き取り<br>詰まる所を書き出す</div>
          <div class="tc-note">例：面談2回・棚卸し表1枚</div>
        </div>

        <svg class="tc-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="var(--sk-accent,#555555)"/></svg>

        <!-- ステージ2（主役・塗り） -->
        <div class="tc-card tc-card-fill">
          <div class="tc-kicker">STEP 2 ／ 設計・構築</div>
          <div class="tc-ttl">小さく組んで試す</div>
          <div class="tc-rule"></div>
          <div class="tc-body">1つの業務だけ組み<br>手直しの量を測る</div>
          <div class="tc-note">例：1業務を2週間で</div>
        </div>

        <svg class="tc-arw" width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="var(--sk-accent,#555555)"/></svg>

        <!-- ステージ3 -->
        <div class="tc-card">
          <div class="tc-kicker">STEP 3 ／ 運用・改善</div>
          <div class="tc-ttl">手順を渡して回す</div>
          <div class="tc-rule"></div>
          <div class="tc-body">使う人に手順を渡し<br>月1回で見直す</div>
          <div class="tc-note">例：月次レビュー30分</div>
        </div>

      </div>
    </div><!-- /content-area -->

  </div><!-- /slide -->

</body>
</html>
