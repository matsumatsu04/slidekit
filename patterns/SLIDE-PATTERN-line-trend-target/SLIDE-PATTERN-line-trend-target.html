<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-line-trend-target</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-size: 16px; font-weight: 400; font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; -webkit-font-smoothing: antialiased;
  }
  .slide p { margin: 0; }
  /* コンテンツエリア（見出しON時は上76px以降。グラフ＋説明の行を上下中央・列同士は上ぞろえ） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }
  .lt-row { display: flex; align-items: flex-start; gap: 32px; }

  /* ── 左：折れ線グラフ（SVG 1枚・560×300・座標は静的計算）──
     プロット範囲 x 48→492（7点・間隔74）／ y 28（100）→252（0）。y = 252 − 2.24 × 値 */
  .lt-chart { flex: none; width: 560px; }
  .lt-svg { display: block; width: 560px; height: 300px; }
  .lt-axis { fill: none; stroke: var(--sk-line,#e2e2e2); stroke-width: 1; shape-rendering: crispEdges; }
  .lt-target { fill: none; stroke: var(--sk-muted,#888888); stroke-width: 1; stroke-dasharray: 4 4; shape-rendering: crispEdges; }
  .lt-line { fill: none; stroke: var(--sk-accent,#555555); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .lt-pt { fill: #FFFFFF; stroke: var(--sk-accent,#555555); stroke-width: 1.5; }
  .lt-end { fill: var(--sk-accent,#555555); }
  /* 目盛り値・目標ラベル：KICKER 10px/700/.18em・muted */
  .lt-tick { font-size: 10px; font-weight: 700; letter-spacing: .18em; fill: var(--sk-muted,#888888); font-variant-numeric: tabular-nums; }
  /* 期ラベル：16px・インク色 */
  .lt-period { font-size: 16px; font-weight: 400; letter-spacing: .06em; fill: var(--sk-ink,#3f4a52); }
  /* 終点の数値：24px/700 tabular-nums（％は14px）。アクセント色（塗りの終点ドットと同じ強調点） */
  .lt-num { font-size: 24px; font-weight: 700; letter-spacing: .02em; fill: var(--sk-accent,#555555); font-variant-numeric: tabular-nums; }
  .lt-num-unit { font-size: 14px; font-weight: 400; letter-spacing: .02em; }

  /* ── 右：説明（型: KICKER → 見出し18px/700 → 細罫線 → 本文16px → 例：注記）── */
  .lt-desc { flex: 1; min-width: 0; padding-top: 24px; }
  .lt-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
  .lt-ttl { margin-top: 12px; font-size: 18px; font-weight: 700; line-height: 1.4; }
  .lt-rule { margin-top: 12px; height: 1px; background: var(--sk-line,#e2e2e2); }
  .lt-body { margin-top: 12px; font-size: 16px; line-height: 1.8; }
  .lt-note { margin-top: 8px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左＝折れ線（7点・目標ライン）／右＝説明。塗りは終点ドット1つだけ -->
  <div class="content-area">
    <div class="lt-row">

      <!-- 左：折れ線グラフ。値 52/58/61/67/72/78/82（%）・目標 90 -->
      <div class="lt-chart">
        <svg class="lt-svg" viewBox="0 0 560 300" aria-hidden="true">
          <!-- 軸線：縦 x=48.5（y 28→252）・横 y=252.5（x 48→492） -->
          <path class="lt-axis" d="M48.5 28V252.5H492"/>
          <!-- 目盛り値（0〜100・25刻み） -->
          <text class="lt-tick" x="36" y="252" dy=".35em" text-anchor="end">0</text>
          <text class="lt-tick" x="36" y="196" dy=".35em" text-anchor="end">25</text>
          <text class="lt-tick" x="36" y="140" dy=".35em" text-anchor="end">50</text>
          <text class="lt-tick" x="36" y="84" dy=".35em" text-anchor="end">75</text>
          <text class="lt-tick" x="36" y="28" dy=".35em" text-anchor="end">100</text>
          <!-- 目標ライン：90% → y=50.5・1px破線・muted。KICKER は線の左上 -->
          <path class="lt-target" d="M48 50.5H492"/>
          <text class="lt-tick" x="48" y="42">TARGET ／ 目標 90%</text>
          <!-- 折れ線：2px アクセント色 -->
          <polyline class="lt-line" points="48,135.5 122,122.1 196,115.4 270,101.9 344,90.7 418,77.3 492,68.3"/>
          <!-- 途中の点：白地に1.5pxアクセント枠の8pxドット -->
          <circle class="lt-pt" cx="48" cy="135.5" r="4"/>
          <circle class="lt-pt" cx="122" cy="122.1" r="4"/>
          <circle class="lt-pt" cx="196" cy="115.4" r="4"/>
          <circle class="lt-pt" cx="270" cy="101.9" r="4"/>
          <circle class="lt-pt" cx="344" cy="90.7" r="4"/>
          <circle class="lt-pt" cx="418" cy="77.3" r="4"/>
          <!-- 終点：12pxアクセント塗り（塗りはここだけ）＋数値24px/700 -->
          <circle class="lt-end" cx="492" cy="68.3" r="6"/>
          <text class="lt-num" x="506" y="68.3" dy=".35em">82<tspan class="lt-num-unit">%</tspan></text>
          <!-- 期ラベル：16px -->
          <text class="lt-period" x="48" y="284" text-anchor="middle">4月</text>
          <text class="lt-period" x="122" y="284" text-anchor="middle">5月</text>
          <text class="lt-period" x="196" y="284" text-anchor="middle">6月</text>
          <text class="lt-period" x="270" y="284" text-anchor="middle">7月</text>
          <text class="lt-period" x="344" y="284" text-anchor="middle">8月</text>
          <text class="lt-period" x="418" y="284" text-anchor="middle">9月</text>
          <text class="lt-period" x="492" y="284" text-anchor="middle">10月</text>
        </svg>
      </div>

      <!-- 右：説明 -->
      <div class="lt-desc">
        <div class="lt-kicker">RESULT ／ 直近の到達点</div>
        <div class="lt-ttl">目標90%まで、残り8pt</div>
        <div class="lt-rule"></div>
        <div class="lt-body">4月の52%から半年で30pt改善した。紹介経由の案件が増え、年内の到達が見えている。</div>
        <div class="lt-note">例：達成率＝受注件数÷目標件数</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
