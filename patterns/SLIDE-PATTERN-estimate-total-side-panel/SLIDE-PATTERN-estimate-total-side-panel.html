<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-estimate-total-side-panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。明細表＋合計パネルの行は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 左：明細表（罫線だけ）／ 右：合計パネル（唯一の塗り）。等高 ── */
  .ts-row { display: flex; gap: 16px; align-items: stretch; height: 312px; }
  .ts-left { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ts-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  /* 列見出しは KICKER 型（10px・アクセント色）。塗らない・下罫線だけ */
  .ts-table th {
    font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1;
    color: var(--sk-accent,#666666); text-align: left; vertical-align: middle; height: 32px; padding: 0 12px;
    border-bottom: 1px solid var(--sk-line,#e2e2e2); white-space: nowrap;
  }
  /* 行：高さ48px・本文16px・区切りは横罫線だけ */
  .ts-table td { font-size: 16px; line-height: 1.8; text-align: left; vertical-align: middle; height: 48px; padding: 8px 12px; border-bottom: 1px solid var(--sk-line,#e2e2e2); }
  .ts-table td.ts-item { font-weight: 700; }
  .ts-table th.ts-price, .ts-table td.ts-price { text-align: right; }
  .ts-table td.ts-price { font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 注記：表の下端に寄せる（11.5px・muted） */
  .ts-note { margin-top: auto; padding-top: 12px; font-size: 11.5px; line-height: 1.8; color: var(--sk-muted,#888888); }

  /* 右：合計パネル（幅280px・アクセント塗り・白文字・角丸11px）。型: KICKER → 金額28px＋単位 → 白35%の罫線 → 内訳3行 → 注記 */
  .ts-panel { flex: none; width: 280px; display: flex; flex-direction: column; padding: 24px 28px; border-radius: 11px; background: var(--sk-accent,#555555); color: #FFFFFF; }
  .ts-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: #FFFFFF; white-space: nowrap; }
  .ts-num-row { margin-top: 16px; display: flex; align-items: baseline; gap: 8px; }
  .ts-num { font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ts-unit { font-size: 14px; font-weight: 400; line-height: 1; }
  .ts-rule { margin-top: 16px; height: 1px; background: rgba(255,255,255,.35); }
  .ts-lines { margin-top: 12px; font-size: 16px; line-height: 1.8; color: rgba(255,255,255,.8); }
  .ts-line { display: flex; justify-content: space-between; gap: 12px; white-space: nowrap; }
  .ts-panel .ts-note { color: #FFFFFF; opacity: .85; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左＝明細表（罫線だけ・5行）／右＝合計パネル（唯一の塗り） -->
  <div class="content-area">
    <div class="ts-row">

      <!-- 左：明細表（合計行は持たない。合計は右パネルに） -->
      <div class="ts-left">
        <table class="ts-table">
          <thead>
            <tr>
              <th style="width:152px;">Item ／ 項目</th>
              <th>Scope ／ 内容</th>
              <th class="ts-price" style="width:136px;">Price ／ 金額</th>
            </tr>
          </thead>
          <tbody>
            <tr><td class="ts-item">サイト設計</td><td>ページ構成・ワイヤーフレーム</td><td class="ts-price">¥120,000</td></tr>
            <tr><td class="ts-item">デザイン</td><td>TOP＋下層4ページ</td><td class="ts-price">¥280,000</td></tr>
            <tr><td class="ts-item">実装</td><td>ノーコード構築・フォーム設置</td><td class="ts-price">¥200,000</td></tr>
            <tr><td class="ts-item">写真撮影</td><td>半日・20カット納品</td><td class="ts-price">¥60,000</td></tr>
            <tr><td class="ts-item">ディレクション</td><td>進行管理・公開前の確認</td><td class="ts-price">¥40,000</td></tr>
          </tbody>
        </table>
        <div class="ts-note">例：ページの追加は1枚あたり ¥40,000 で見積もる</div>
      </div>

      <!-- 右：合計パネル（アクセント塗り・白文字） -->
      <div class="ts-panel">
        <div class="ts-kicker">TOTAL ／ 合計</div>
        <div class="ts-num-row"><span class="ts-num">¥700,000</span><span class="ts-unit">税別</span></div>
        <div class="ts-rule"></div>
        <div class="ts-lines">
          <div class="ts-line"><span>税区分</span><span>税別</span></div>
          <div class="ts-line"><span>有効期限</span><span>発行から1ヶ月</span></div>
          <div class="ts-line"><span>支払</span><span>着手50%・納品50%</span></div>
        </div>
        <div class="ts-note">例：初回のお支払いは ¥350,000</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
