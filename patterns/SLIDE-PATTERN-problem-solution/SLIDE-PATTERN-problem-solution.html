<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDE-PATTERN-problem-solution</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
    .slide {
      width: 960px;
      height: 540px;
      background: #FFFFFF;
      border: 1px solid var(--sk-accent,#CCCCCC);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* デザインの規律 v2: 文字の組み */
      color: var(--sk-ink,#3f4a52);
      font-size: 16px;
      font-weight: 400;
      font-feature-settings: "palt" 1;
      line-break: strict;
      letter-spacing: .06em;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }
    /* コンテンツエリア（見出しON時は上76px以降）。左右のパネルは等高で本文エリアを埋め、中身は上ぞろえ */
    .content-area { flex:1; padding:24px 48px; display:flex; flex-direction:column; }
    .ps-row { flex:1; display:flex; gap:12px; align-items:stretch; }
    /* パネル: 左＝淡い地（課題）、右＝アクセント塗り（解決策・白文字）。塗りは1枚に1つ */
    .ps-panel { flex:1; min-width:0; border-radius:12px; padding:24px; display:flex; flex-direction:column; }
    .ps-problem  { background:var(--sk-soft,#F0F0F0); border:1px solid var(--sk-line,#e2e2e2); }
    .ps-solution { background:var(--sk-accent,#555555); color:#FFFFFF; }
    /* カードの型: KICKER → 見出し18px → 罫線で区切った「番号＋本文」の行 → 注記 */
    .ps-kicker { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-accent,#555555); white-space:nowrap; }
    .ps-solution .ps-kicker { color:#FFFFFF; }
    .ps-head { margin-top:8px; font-size:18px; font-weight:700; line-height:1.5; margin-bottom:12px; }
    .ps-list { display:flex; flex-direction:column; }
    .ps-item { display:grid; grid-template-columns:32px 1fr; gap:12px; align-items:start; padding:12px 0; border-top:1px solid var(--sk-line,#e2e2e2); }
    .ps-solution .ps-item { border-top-color:rgba(255,255,255,.35); }
    .ps-num  { font-size:16px; font-weight:700; line-height:1.8; color:var(--sk-accent,#555555); }
    .ps-solution .ps-num { color:#FFFFFF; }
    .ps-text { font-size:16px; line-height:1.8; }
    /* 注記（例：〜）はパネル最下に寄せる */
    .ps-note { margin-top:auto; padding-top:16px; font-size:11.5px; line-height:1.8; color:var(--sk-muted,#888888); }
    .ps-solution .ps-note { color:#FFFFFF; opacity:.85; }
    /* 中央の矢印（SVG の三角・幅12px のみ） */
    .ps-arrow { flex:none; width:24px; display:flex; align-items:center; justify-content:center; }
    .ps-arrow svg { display:block; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
  <div class="slide">
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>

    <!-- コンテンツエリア -->
    <div class="content-area">
      <div class="ps-row">

        <!-- 課題パネル（淡い地） -->
        <div class="ps-panel ps-problem">
          <div class="ps-kicker">PROBLEM ／ いま起きていること</div>
          <div class="ps-head">課題</div>
          <div class="ps-list">
            <div class="ps-item"><span class="ps-num">01</span><span class="ps-text">顧客の情報が複数の台帳に分かれ、横断して見られない</span></div>
            <div class="ps-item"><span class="ps-num">02</span><span class="ps-text">営業と制作で優先順位がずれ、手戻りが出る</span></div>
            <div class="ps-item"><span class="ps-num">03</span><span class="ps-text">月次の報告づくりに数日かかり、判断が遅れる</span></div>
          </div>
          <div class="ps-note">例：同じ問い合わせが営業と制作で別々に記録されている</div>
        </div>

        <!-- 中央矢印（SVG 三角） -->
        <div class="ps-arrow">
          <svg width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M0 0L12 8 0 16Z" fill="var(--sk-accent,#555555)"/></svg>
        </div>

        <!-- 解決策パネル（アクセント塗り・白文字） -->
        <div class="ps-panel ps-solution">
          <div class="ps-kicker">SOLUTION ／ こう変える</div>
          <div class="ps-head">解決策</div>
          <div class="ps-list">
            <div class="ps-item"><span class="ps-num">01</span><span class="ps-text">台帳を1つに統合し、全員が同じ画面を見る</span></div>
            <div class="ps-item"><span class="ps-num">02</span><span class="ps-text">週1回の合同確認と共有ボードで順位を合わせる</span></div>
            <div class="ps-item"><span class="ps-num">03</span><span class="ps-text">報告を自動生成に切り替え、当日中に判断する</span></div>
          </div>
          <div class="ps-note">例：記録は1か所に寄せ、更新は担当者がその日のうちに行う</div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
