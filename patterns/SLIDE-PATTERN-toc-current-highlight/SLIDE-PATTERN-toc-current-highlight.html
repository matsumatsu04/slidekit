<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-toc-current-highlight</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide { width:960px; height:540px; background:#FFFFFF; border:1px solid var(--sk-accent,#CCCCCC); overflow:hidden; display:flex; flex-direction:column;
           color:var(--sk-ink,#3f4a52); font-weight:400; font-feature-settings:"palt" 1; line-break:strict; letter-spacing:.06em; line-height:1.8; }
  /* v2（2026-09-02）: toc-two-column と同じ「左 contents ラベル／右 番号｜縦罫線｜項目名」。
     現在の章の行だけ soft 地の帯（角丸8px）にし、番号をアクセント塗りの丸（白文字）にする。塗りはこの丸1つだけ。
     共通部品は使えないので、同じ数値を tch- 接頭辞で持つ */
  .tch-area  { flex:1; position:relative; }
  .tch-label { position:absolute; left:72px; top:0; bottom:0; display:flex; align-items:center;
               font-size:15px; font-weight:700; letter-spacing:.3em; color:var(--sk-accent,#666666); line-height:1; }
  .tch-list  { position:absolute; left:460px; right:48px; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center; gap:16px; }
  .tch-item  { display:flex; align-items:center; height:44px; padding:0 16px; border-radius:8px; }
  .tch-cur   { background:var(--sk-soft,#F0F0F0); }
  .tch-no    { width:48px; flex-shrink:0; display:flex; align-items:center; font-size:24px; font-weight:700; letter-spacing:.04em; color:var(--sk-accent,#666666); line-height:1; }
  .tch-dot   { width:36px; height:36px; border-radius:50%; background:var(--sk-accent,#555555); color:#FFFFFF; display:flex; align-items:center; justify-content:center;
               font-size:16px; font-weight:700; letter-spacing:.04em; line-height:1; }
  .tch-vline { width:1px; height:22px; flex-shrink:0; background:var(--sk-line,#e2e2e2); margin:0 20px 0 12px; }
  .tch-txt   { font-size:16px; font-weight:400; letter-spacing:.2em; line-height:1; white-space:nowrap; }
  .tch-cur .tch-txt { font-weight:700; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <div class="tch-area">
    <div class="tch-label">contents</div>
    <div class="tch-list">
      <div class="tch-item"><span class="tch-no">01</span><span class="tch-vline"></span><span class="tch-txt">制作の現場で起きている詰まり</span></div>
      <div class="tch-item"><span class="tch-no">02</span><span class="tch-vline"></span><span class="tch-txt">AIに任せる工程と人が決める工程</span></div>
      <div class="tch-item tch-cur"><span class="tch-no"><span class="tch-dot">03</span></span><span class="tch-vline"></span><span class="tch-txt">試作から現場へ入れる手順</span></div>
      <div class="tch-item"><span class="tch-no">04</span><span class="tch-vline"></span><span class="tch-txt">運用で見る数字と直し方</span></div>
      <div class="tch-item"><span class="tch-no">05</span><span class="tch-vline"></span><span class="tch-txt">体制と役割の分け方</span></div>
    </div>
  </div>
</div>
</body>
</html>
