<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-feature-metrics-four-cells</title>
<style>
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  /* デザインの規律 v2：文字の組みは .slide に集約（palt・禁則・字間.06em・行間1.8・インク色・太さは400/700のみ） */
  .slide { width:960px; height:540px; background:#FFFFFF; overflow:hidden; position:relative; box-sizing:border-box;
           color:var(--sk-ink,#3f4a52); font-size:16px; font-weight:400; line-height:1.8; letter-spacing:.06em;
           font-feature-settings:"palt" 1; line-break:strict; -webkit-font-smoothing:antialiased; }
  .slide p { margin:0; }
  /* 本文エリア：左右48px・見出しONで上76px・中身は上下中央 */
  .content-area { position:absolute; left:48px; right:48px; top:0; bottom:0; display:flex; align-items:center; }
  html[data-heading="on"] .content-area { top:76px; }

  /* 2×2セル：等高・soft地・角丸11・gap16。02だけ塗り、04（右下＝最終）だけ1.5px枠線 */
  .fm-grid { width:100%; height:408px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:16px; }
  .fm-cell { box-sizing:border-box; border-radius:11px; padding:16px 24px; background:var(--sk-soft,#F0F0F0); min-width:0;
             display:flex; flex-direction:column; align-items:flex-start; }
  .fm-fill { background:var(--sk-accent,#555555); color:#FFFFFF; }
  .fm-outline { background:#FFFFFF; border:1.5px solid var(--sk-accent,#666666); }
  /* セルの型：KICKER → 数字（32px・太字・アクセント色）＋単位（14px） → 細罫線 → 説明 → 例： */
  .fm-kicker { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-accent,#666666); }
  .fm-fill .fm-kicker { color:#FFFFFF; }
  .fm-num-row { margin-top:8px; display:flex; align-items:baseline; gap:4px; }
  .fm-num { font-size:32px; font-weight:700; line-height:1; letter-spacing:.02em; color:var(--sk-accent,#666666); }
  .fm-unit { font-size:14px; font-weight:400; line-height:1; }
  .fm-fill .fm-num, .fm-fill .fm-unit { color:#FFFFFF; }
  .fm-line { width:100%; height:1px; background:var(--sk-line,#e2e2e2); margin:10px 0 8px; }
  .fm-fill .fm-line { background:rgba(255,255,255,.35); }
  .fm-desc { font-size:16px; line-height:1.8; }
  .fm-note { margin-top:4px; font-size:11.5px; line-height:1.8; color:var(--sk-muted,#888888); }
  .fm-fill .fm-note { color:#FFFFFF; opacity:.8; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：2×2セル（02＝主役の塗り、04＝最終項目の枠線） -->
  <div class="content-area">
    <div class="fm-grid">
      <div class="fm-cell">
        <div class="fm-kicker">Pages ／ 初期ページ数</div>
        <div class="fm-num-row"><span class="fm-num">5</span><span class="fm-unit">ページ</span></div>
        <div class="fm-line"></div>
        <p class="fm-desc">初期制作に含むページ数。TOPと下層4枚を型で組み立てる。</p>
        <div class="fm-note">例：TOP・サービス・実績・会社概要・問い合わせ</div>
      </div>
      <div class="fm-cell fm-fill">
        <div class="fm-kicker">Delivery ／ 納期</div>
        <div class="fm-num-row"><span class="fm-num">14</span><span class="fm-unit">日</span></div>
        <div class="fm-line"></div>
        <p class="fm-desc">素材がそろってから公開までの日数。確認は画面で済ませる。</p>
        <div class="fm-note">例：素材待ちの日数は含まない</div>
      </div>
      <div class="fm-cell">
        <div class="fm-kicker">Revisions ／ 修正回数</div>
        <div class="fm-num-row"><span class="fm-num">2</span><span class="fm-unit">回</span></div>
        <div class="fm-line"></div>
        <p class="fm-desc">初期制作に含む修正の回数。超えた分は別料金にする。</p>
        <div class="fm-note">例：文言の差し替えは回数に数えない</div>
      </div>
      <div class="fm-cell fm-outline">
        <div class="fm-kicker">Update ／ 月次更新</div>
        <div class="fm-num-row"><span class="fm-num">30</span><span class="fm-unit">分</span></div>
        <div class="fm-line"></div>
        <p class="fm-desc">公開後の更新に毎月使える時間。小さな直しを溜めない。</p>
        <div class="fm-note">例：月初の定例で片づける</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
