<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-pyramid-tier-callout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-size: 16px; font-weight: 400; font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。図は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 3段ピラミッド（左 360×288）＋ 右の説明3行。ステージ 864×288 に絶対配置 ── */
  .py-stage { position: relative; width: 864px; height: 288px; }
  /* 台形3枚と引き出し線は1枚のSVG。段の間は白2pxの隙間（y=95〜97・191〜193） */
  .py-svg { position: absolute; left: 0; top: 0; width: 864px; height: 288px; display: block; }
  .py-svg .py-t1 { fill: var(--sk-accent,#555555); }   /* 頂点だけアクセント塗り（塗りは1枚に1つ） */
  .py-svg .py-t2 { fill: var(--sk-line,#e2e2e2); }
  .py-svg .py-t3 { fill: var(--sk-soft,#F0F0F0); }
  /* 引き出し線: 1px 罫線色。段の右辺（各段の垂直中心）から説明の左端 x=480 まで。台形の下に描き、段の側は台形で受ける */
  .py-svg .py-lead { fill: none; stroke: var(--sk-line,#e2e2e2); stroke-width: 1; shape-rendering: crispEdges; }

  /* 段のラベル（各段の中心に KICKER → 見出し16px/700。高さ40pxのブロックを段の中心に置く） */
  .py-tier { position: absolute; left: 80px; width: 200px; height: 40px; text-align: center; }
  .py-tier-1 { top: 28px; color: #FFFFFF; }
  .py-tier-2 { top: 124px; }
  .py-tier-3 { top: 220px; }
  .py-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
  .py-tier-1 .py-kicker { color: #FFFFFF; }
  .py-ttl { margin-top: 8px; font-size: 16px; font-weight: 700; line-height: 1.4; white-space: nowrap; }

  /* 右の説明（段と同じ高さの行。見出し16px/700 → 説明14px muted。左端 x=480 が引き出し線の終点） */
  .py-row { position: absolute; left: 480px; width: 384px; padding-left: 16px; display: flex; flex-direction: column; justify-content: center; }
  .py-row-1 { top: 0;     height: 95px; }
  .py-row-2 { top: 97px;  height: 94px; }
  .py-row-3 { top: 193px; height: 95px; }
  .py-desc { margin-top: 4px; font-size: 14px; line-height: 1.6; color: var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左＝3段ピラミッド（頂点だけ塗り）／右＝各段の説明3行。段の中心から引き出し線 -->
  <div class="content-area">
    <div class="py-stage">

      <!-- 台形3枚＋引き出し線（上辺120px・底辺360px。引き出し線は台形の下に描き、段の右辺で止まる） -->
      <svg class="py-svg" viewBox="0 0 864 288" aria-hidden="true">
        <path class="py-lead" d="M252 48H480"/>
        <path class="py-lead" d="M292 144H480"/>
        <path class="py-lead" d="M332 240H480"/>
        <polygon class="py-t1" points="120,0 240,0 279.6,95 80.4,95"/>
        <polygon class="py-t2" points="79.6,97 280.4,97 319.6,191 40.4,191"/>
        <polygon class="py-t3" points="39.6,193 320.4,193 360,288 0,288"/>
      </svg>

      <!-- 段のラベル -->
      <div class="py-tier py-tier-1"><div class="py-kicker">TIER 1</div><div class="py-ttl">経営層</div></div>
      <div class="py-tier py-tier-2"><div class="py-kicker">TIER 2</div><div class="py-ttl">管理層</div></div>
      <div class="py-tier py-tier-3"><div class="py-kicker">TIER 3</div><div class="py-ttl">実行層</div></div>

      <!-- 右の説明（各段と同じ高さ） -->
      <div class="py-row py-row-1">
        <div class="py-ttl">方針を決める</div>
        <div class="py-desc">年度の目標と予算を決め、優先順位を示す</div>
      </div>
      <div class="py-row py-row-2">
        <div class="py-ttl">計画に落とす</div>
        <div class="py-desc">目標を部門の計画に分け、進み具合を見る</div>
      </div>
      <div class="py-row py-row-3">
        <div class="py-ttl">日々の業務を回す</div>
        <div class="py-desc">計画どおりに手を動かし、結果を報告する</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
