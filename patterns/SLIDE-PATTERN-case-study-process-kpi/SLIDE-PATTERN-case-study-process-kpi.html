<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-case-study-process-kpi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  .slide {
    width: 960px; height: 540px; background: #FFFFFF; border: 1px solid var(--sk-accent,#CCCCCC); overflow: hidden;
    display: flex; flex-direction: column;
    /* デザインの規律 v2: 文字の組み */
    color: var(--sk-ink,#3f4a52); font-feature-settings: "palt" 1; line-break: strict;
    letter-spacing: .06em; line-height: 1.8; font-weight: 400; -webkit-font-smoothing: antialiased;
  }
  /* コンテンツエリア（見出しON時は上76px以降。行は上下中央） */
  .content-area { flex: 1; padding: 24px 48px; display: flex; flex-direction: column; justify-content: center; }

  /* ── 左：事例の概要＋工程3ステップ（塗りなし）／右：成果KPIパネル（塗り・幅300px）。等高 ── */
  .cs-row { display: flex; align-items: stretch; gap: 24px; height: 352px; }
  .cs-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .cs-kicker { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; line-height: 1; color: var(--sk-accent,#555555); white-space: nowrap; }
  .cs-name { margin-top: 12px; font-size: 18px; font-weight: 700; line-height: 1.4; }
  .cs-rule { margin-top: 16px; height: 1px; background: var(--sk-line,#e2e2e2); }
  /* 工程：縦積み3段（等高・上ぞろえ）。各段＝左に番号KICKER、右に見出し16px＋説明14px。段は細罫線で区切る */
  .cs-steps { flex: 1; min-height: 0; display: grid; grid-auto-rows: 1fr; }
  .cs-step { display: grid; grid-template-columns: 72px 1fr; column-gap: 16px; align-items: start; padding: 12px 0; border-top: 1px solid var(--sk-line,#e2e2e2); }
  .cs-step:first-child { border-top: none; }
  .cs-step-no { padding-top: 8px; }
  .cs-step-ttl { font-size: 16px; font-weight: 700; line-height: 1.4; }
  .cs-step-desc { margin-top: 4px; font-size: 16px; line-height: 1.8; }

  /* 右：成果KPIパネル（アクセント塗り・白文字。塗りは1枚に1つ）。型: KICKER → 数字28px＋単位 → 説明 → 白35%罫線 → 指標2行 → 注記 */
  .cs-result {
    flex: none; width: 300px; display: flex; flex-direction: column;
    padding: 24px 28px; border-radius: 11px;
    background: var(--sk-accent,#555555); color: #FFFFFF;
  }
  .cs-result .cs-kicker { color: #FFFFFF; }
  .cs-num-row { margin-top: 16px; display: flex; align-items: baseline; gap: 4px; }
  .cs-num { font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .cs-unit { font-size: 16px; font-weight: 400; line-height: 1; }
  .cs-desc { margin-top: 12px; font-size: 16px; line-height: 1.8; }
  .cs-wrule { margin-top: 16px; height: 1px; background: rgba(255,255,255,.35); }
  .cs-metrics { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .cs-metric { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; line-height: 1.8; color: rgba(255,255,255,.8); }
  .cs-metric-v { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cs-note { margin-top: auto; padding-top: 12px; font-size: 11.5px; line-height: 1.8; color: #FFFFFF; opacity: .85; }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：左＝事例の概要と工程3ステップ（塗りなし）／右＝成果KPIパネル（塗り） -->
  <div class="content-area">
    <div class="cs-row">

      <!-- 左：事例の概要（KICKER → 事例名 → 細罫線）＋ 工程3ステップ（縦積み・等高） -->
      <div class="cs-main">
        <div class="cs-kicker">CASE ／ 製造業</div>
        <div class="cs-name">部品メーカーの採用サイト刷新</div>
        <div class="cs-rule"></div>
        <div class="cs-steps">
          <div class="cs-step">
            <div class="cs-kicker cs-step-no">STEP 01</div>
            <div>
              <div class="cs-step-ttl">現状の棚卸し</div>
              <div class="cs-step-desc">応募の経路と、離脱の多いページを1週間で洗い出す</div>
            </div>
          </div>
          <div class="cs-step">
            <div class="cs-kicker cs-step-no">STEP 02</div>
            <div>
              <div class="cs-step-ttl">型で設計する</div>
              <div class="cs-step-desc">募集職種ごとのページを、同じ型で1枚にまとめる</div>
            </div>
          </div>
          <div class="cs-step">
            <div class="cs-kicker cs-step-no">STEP 03</div>
            <div>
              <div class="cs-step-ttl">公開して計測する</div>
              <div class="cs-step-desc">公開後30日は週1回、数字を見て文言を直す</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 右：成果KPIパネル（アクセント塗り・白文字） -->
      <div class="cs-result">
        <div class="cs-kicker">RESULT ／ 公開後3ヶ月</div>
        <div class="cs-num-row"><span class="cs-num">2.4</span><span class="cs-unit">倍</span></div>
        <div class="cs-desc">月間の応募数（公開前比）</div>
        <div class="cs-wrule"></div>
        <div class="cs-metrics">
          <div class="cs-metric"><span>応募数</span><span class="cs-metric-v">月5件 → 月12件</span></div>
          <div class="cs-metric"><span>直帰率</span><span class="cs-metric-v">68% → 41%</span></div>
        </div>
        <div class="cs-note">例：応募フォームの送信数で集計</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
