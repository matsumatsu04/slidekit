<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-kpi-progress-bars</title>
<style>
  body { margin:0; padding:0; background:#E8E8E8; font-family:sans-serif; }
  /* デザインの規律 v2：文字の組みは .slide に集約（palt・禁則・字間.06em・行間1.8・インク色・太さは400/700のみ） */
  .slide { width:960px; height:540px; background:#FFFFFF; overflow:hidden; position:relative; box-sizing:border-box;
           color:var(--sk-ink,#3f4a52); font-size:16px; font-weight:400; line-height:1.8; letter-spacing:.06em;
           font-feature-settings:"palt" 1; line-break:strict; -webkit-font-smoothing:antialiased; }
  .slide p { margin:0; }
  /* 本文エリア：左右48px・見出しONで上76px・行の束は上下中央 */
  .content-area { position:absolute; left:48px; right:48px; top:0; bottom:0; display:flex; align-items:center; }
  html[data-heading="on"] .content-area { top:76px; }

  /* KPI進捗バー4本：行は細罫線で区切る。塗りはバーの進捗だけ */
  .pb-list { width:100%; display:flex; flex-direction:column; }
  .pb-row  { padding:16px 0; }
  .pb-row + .pb-row { border-top:1px solid var(--sk-line,#E2E2E2); }
  /* 行の型：KICKER＋指標名（左）／数値20px＋単位（右端）→ バー8px → 目標値の注記 */
  .pb-head   { display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
  .pb-label  { display:flex; align-items:baseline; gap:12px; min-width:0; }
  .pb-kicker { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; line-height:1; color:var(--sk-accent,#666666); white-space:nowrap; }
  .pb-name   { font-size:16px; font-weight:700; line-height:1.5; }
  .pb-value  { display:flex; align-items:baseline; gap:4px; white-space:nowrap; }
  .pb-num    { font-size:20px; font-weight:700; line-height:1; letter-spacing:.02em; color:var(--sk-accent,#666666); }
  .pb-unit   { font-size:11.5px; font-weight:400; line-height:1; }
  .pb-track  { margin-top:8px; height:8px; border-radius:4px; background:var(--sk-soft,#F0F0F0); overflow:hidden; }
  .pb-fill   { height:100%; border-radius:4px; background:var(--sk-accent,#666666); }
  .pb-note   { margin-top:8px; font-size:11.5px; line-height:1.8; color:var(--sk-muted,#888888); }

/* === 共通見出し v5（6スタイル・固定metrics・余白=4の倍数）=== */
.sk-head{display:none}
html[data-heading="on"] .slide{position:relative;box-sizing:border-box;padding-top:76px;}
html[data-heading="on"] .sk-head{display:flex;align-items:baseline;position:absolute;top:0;left:40px;right:40px;padding:24px 0 12px;box-sizing:border-box;border-bottom:2px solid var(--sk-accent,#333333);z-index:5;}
.sk-head .sk-head-ttl{font-size:24px;font-weight:bold;color:#333333;line-height:1.2;}
html[data-heading="on"][data-hstyle="b"] .sk-head{left:40px;right:auto;border-bottom:none;padding:24px 0 0 20px;align-items:center;position:absolute;}
html[data-heading="on"][data-hstyle="b"] .sk-head::before{content:"";position:absolute;left:0;top:31px;width:3px;height:18px;background:var(--sk-accent,#333333);}
html[data-heading="on"][data-hstyle="c"] .sk-head{left:0;right:0;top:0;height:76px;box-sizing:border-box;align-items:center;border-bottom:none;background:var(--sk-accent,#4A4A4A);padding:0 40px;}
html[data-heading="on"][data-hstyle="c"] .sk-head-ttl{color:#FFFFFF;}
html[data-heading="on"][data-hstyle="d"] .sk-head{flex-direction:column;align-items:flex-start;gap:4px;border-bottom:none;padding:16px 0 0;}
html[data-heading="on"][data-hstyle="d"] .sk-head::before{content:"● " attr(data-label);font-size:12px;font-weight:bold;color:var(--sk-accent,#555);letter-spacing:.06em;}

/* === デザインの規律 v2 — 文字の組み（2026-09-02 第2弾で一括適用。SPEC「デザインの規律 v2」）=== */
.slide{font-feature-settings:"palt" 1;line-break:strict;word-break:normal;letter-spacing:.06em;line-height:1.8;color:var(--sk-ink,#3f4a52);}
</style>
</head>
<body>
<div class="slide">
  <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
  <div class="sk-head" data-label="Section"><span class="sk-head-ttl">セクションタイトル</span></div>
  <!-- コンテンツエリア：KPI進捗バー4本（バーの width ＝ 達成率） -->
  <div class="content-area">
    <div class="pb-list">
      <div class="pb-row">
        <div class="pb-head">
          <div class="pb-label"><span class="pb-kicker">Leads</span><span class="pb-name">問い合わせ数</span></div>
          <div class="pb-value"><span class="pb-num">128</span><span class="pb-unit">件</span></div>
        </div>
        <div class="pb-track"><div class="pb-fill" style="width:85%"></div></div>
        <div class="pb-note">目標 150件 ／ 達成率 85%</div>
      </div>
      <div class="pb-row">
        <div class="pb-head">
          <div class="pb-label"><span class="pb-kicker">CVR</span><span class="pb-name">問い合わせ率</span></div>
          <div class="pb-value"><span class="pb-num">2.4</span><span class="pb-unit">%</span></div>
        </div>
        <div class="pb-track"><div class="pb-fill" style="width:80%"></div></div>
        <div class="pb-note">目標 3.0% ／ 達成率 80%</div>
      </div>
      <div class="pb-row">
        <div class="pb-head">
          <div class="pb-label"><span class="pb-kicker">Pages</span><span class="pb-name">公開ページ数</span></div>
          <div class="pb-value"><span class="pb-num">36</span><span class="pb-unit">ページ</span></div>
        </div>
        <div class="pb-track"><div class="pb-fill" style="width:90%"></div></div>
        <div class="pb-note">目標 40ページ ／ 達成率 90%</div>
      </div>
      <div class="pb-row">
        <div class="pb-head">
          <div class="pb-label"><span class="pb-kicker">Review</span><span class="pb-name">目視チェック完了率</span></div>
          <div class="pb-value"><span class="pb-num">62</span><span class="pb-unit">%</span></div>
        </div>
        <div class="pb-track"><div class="pb-fill" style="width:62%"></div></div>
        <div class="pb-note">目標 100% ／ 達成率 62%</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
