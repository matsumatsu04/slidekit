name: パターンリクエスト
description: 「こういう構図パターンが欲しい」をリクエストする（自分で作らなくてOK）
title: "[パターンリクエスト] "
labels: ["pattern-request"]
body:
  - type: markdown
    attributes:
      value: |
        構図パターンのリクエスト用フォームです。**対応期限（SLA）はありません。誰が拾って PR にしてもOKです**
        （リクエストした本人以外が作っても構いません）。
        自分で作って提案したい場合は [CONTRIBUTING.md](https://github.com/matsumatsu04/slidekit/blob/main/CONTRIBUTING.md) を参照してください。
        参考画像を貼る場合は、権利上問題のないもの（自作・許諾済み）にしてください。
  - type: textarea
    id: purpose
    attributes:
      label: 用途
      description: どんな資料の、どんな場面で使いたいですか（例：提案書の課題整理、勉強会の振り返り、料金説明）
      placeholder: 例）提案書の「現状の課題」を3つ並べて、右側に共通する原因を1つ示したい
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: 欲しい構図の説明
      description: 要素の置き方を言葉で。カラム数・行・並び・強調したい箇所など（色やフォントは書かなくてOK）
      placeholder: |
        例）左70%に縦3段のカード（番号＋見出し＋1行説明）、右30%に縦長の囲み1つ（共通原因）。
        左と右は矢印1本でつなぐ。項目数が2〜4に変わっても崩れない形がよい。
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 参考画像（任意）
      description: ここに画像を貼り付け（ドラッグ＆ドロップまたはペースト）。手描きのラフでもOK
      placeholder: ここに画像を貼り付け
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: カテゴリ（任意）
      description: 近いものがあれば選んでください（分からなければ空欄でOK）
      options:
        - 表紙
        - セクション
        - 目次
        - 本文
        - リスト
        - ステップ
        - 図解・ダイアグラム
        - カード
        - グラフ
        - テーブル
        - KPI
        - まとめ
        - FAQ
        - プロフィール
    validations:
      required: false
  - type: input
    id: scene
    attributes:
      label: 使う場面（任意）
      description: 一言で（例：営業提案、社内報告、勉強会、採用資料）
      placeholder: 例）営業提案の課題整理
    validations:
      required: false
